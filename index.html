<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Point Cloud Martial Arts - Ultimate</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        /* 分頁 UI 面板 */
        .ui-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            width: 250px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .ui-header {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        /* 頁籤標籤 */
        .tab-nav {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 2px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #888888;
            padding: 5px 0;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #000000;
        }
        /* 頁籤內容 */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .ui-group {
            margin-bottom: 8px;
        }
        .ui-group label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #aaaaaa;
            margin-bottom: 3px;
        }
        .ui-group input[type=range], .ui-group input[type=color] {
            width: 100%;
            accent-color: #ffffff;
            background: #222222;
            height: 4px;
            border: none;
            border-radius: 2px;
        }
        .ui-group input[type=color] {
            height: 24px;
            cursor: pointer;
            border-radius: 4px;
        }
        /* 色卡 Palette 樣式 */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }
        .color-dot {
            width: 100%;
            height: 22px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .color-dot:hover, .color-dot.active {
            transform: scale(1.15);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 4px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover, .btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            border-color: #ffffff;
        }
        .hint {
            position: absolute;
            bottom: 12px;
            width: 100%;
            text-align: center;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: rgba(255,255,255,0.4);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="ui-panel">
        <div class="ui-header">
            <span>3D POINTCLOUD</span>
            <span id="fps" style="color: #00ffcc;">60 FPS</span>
        </div>

        <!-- 分頁按鈕 -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('style', event)">風格模式</button>
            <button class="tab-btn" onclick="switchTab('visual', event)">視覺參數</button>
            <button class="tab-btn" onclick="switchTab('motion', event)">招式選擇</button>
        </div>

        <!-- 分頁 1: 風格模式 -->
        <div id="tab-style" class="tab-content active">
            <div class="btn-grid">
                <button class="btn active" id="mode-halftone" onclick="setRenderMode('halftone')">網點 Halftone</button>
                <button class="btn" id="mode-glow" onclick="setRenderMode('glow')">絢麗光暈 Glow</button>
                <button class="btn" id="mode-wireframe" onclick="setRenderMode('wireframe')">骨架網格 Wire</button>
                <button class="btn" id="mode-classic" onclick="setRenderMode('classic')">經典點雲 Pure</button>
            </div>
        </div>

        <!-- 分頁 2: 視覺參數 -->
        <div id="tab-visual" class="tab-content">
            <div class="ui-group">
                <label>快捷色卡 (Color Presets)</label>
                <div class="palette-grid">
                    <div class="color-dot active" style="background: #ffffff;" onclick="setColor('#ffffff', this)" title="經典白"></div>
                    <div class="color-dot" style="background: #00f0ff;" onclick="setColor('#00f0ff', this)" title="霓虹藍"></div>
                    <div class="color-dot" style="background: #ff2a5f;" onclick="setColor('#ff2a5f', this)" title="朱砂紅"></div>
                    <div class="color-dot" style="background: #00ff66;" onclick="setColor('#00ff66', this)" title="矩陣綠"></div>
                    <div class="color-dot" style="background: #ffb700;" onclick="setColor('#ffb700', this)" title="鈦金黃"></div>
                    <div class="color-dot" style="background: #888888;" onclick="setColor('#888888', this)" title="暗黑灰"></div>
                </div>
            </div>
            <div class="ui-group">
                <label>自訂調色 (Custom Color)</label>
                <input type="color" id="input-color" value="#ffffff">
            </div>
            <div class="ui-group">
                <label>粒子密度 (Density) <span id="val-density">2200</span></label>
                <input type="range" id="input-density" min="800" max="4000" step="100" value="2200">
            </div>
            <div class="ui-group">
                <label>粒子/網點尺寸 (Size) <span id="val-size">2.2</span></label>
                <input type="range" id="input-size" min="0.8" max="5.0" step="0.1" value="2.2">
            </div>
            <div class="ui-group">
                <label>演武速度 (Speed) <span id="val-speed">1.0</span></label>
                <input type="range" id="input-speed" min="0.2" max="2.5" step="0.1" value="1.0">
            </div>
        </div>

        <!-- 分頁 3: 招式選擇 -->
        <div id="tab-motion" class="tab-content">
            <div class="btn-grid">
                <button class="btn active" id="btn-taichi" onclick="setMotion('taichi')">太極圓融</button>
                <button class="btn" id="btn-kick" onclick="setMotion('kick')">飛踢連擊</button>
                <button class="btn" id="btn-chun" onclick="setMotion('chun')">詠春中線</button>
            </div>
        </div>
    </div>

    <div class="hint">SWIPE TO ROTATE // TAP FOR SHOCKWAVE</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, autoFitScale = 1.0;

        function updateScreenDimensions() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            const minDim = Math.min(width, height);
            autoFitScale = (minDim / 450) * (height > width ? 1.25 : 1.0);
        }
        updateScreenDimensions();

        const params = {
            renderMode: 'halftone', // halftone, glow, wireframe, classic
            density: 2200,
            pointSize: 2.2,
            speed: 1.0,
            color: '#ffffff',
            motion: 'taichi'
        };

        let rotX = 0.1, rotY = 0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        let shockwave = { x: 0, y: 0, z: 0, radius: 0, active: false };

        const JOINTS_COUNT = 16;
        const joints = Array.from({ length: JOINTS_COUNT }, () => ({ x: 0, y: 0, z: 0 }));
        
        const BONES = [
            { from: 0, to: 1, radius: 18 },
            { from: 1, to: 2, radius: 28 },
            { from: 2, to: 3, radius: 24 },
            { from: 2, to: 4, radius: 14 },
            { from: 4, to: 5, radius: 11 },
            { from: 5, to: 6, radius: 9 },
            { from: 2, to: 7, radius: 14 },
            { from: 7, to: 8, radius: 11 },
            { from: 8, to: 9, radius: 9 },
            { from: 3, to: 10, radius: 18 },
            { from: 10, to: 11, radius: 14 },
            { from: 11, to: 12, radius: 10 },
            { from: 3, to: 13, radius: 18 },
            { from: 13, to: 14, radius: 14 },
            { from: 14, to: 15, radius: 10 }
        ];

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.boneIndex = Math.floor(Math.random() * BONES.length);
                this.u = Math.random();
                this.theta = Math.random() * Math.PI * 2;
                this.rRatio = Math.sqrt(Math.random()); 
                this.vx = 0; this.vy = 0; this.vz = 0;
                this.x = 0; this.y = 0; this.z = 0;
            }
            update(bonesJoints) {
                const bone = BONES[this.boneIndex];
                const jA = bonesJoints[bone.from];
                const jB = bonesJoints[bone.to];

                const cx = jA.x + (jB.x - jA.x) * this.u;
                const cy = jA.y + (jB.y - jA.y) * this.u;
                const cz = jA.z + (jB.z - jA.z) * this.u;

                const r = bone.radius * this.rRatio;
                const jitter = (Math.random() - 0.5) * 1.5;

                const px = cx + Math.cos(this.theta) * r + jitter;
                const py = cy + Math.sin(this.theta) * r + jitter;
                const pz = cz + Math.sin(this.theta * 2) * (r * 0.5) + jitter;

                if (shockwave.active) {
                    const dX = px - shockwave.x;
                    const dY = py - shockwave.y;
                    const dZ = pz - shockwave.z;
                    const dist = Math.sqrt(dX*dX + dY*dY + dZ*dZ);

                    if (dist < shockwave.radius + 50 && dist > shockwave.radius - 50) {
                        const force = (1 - dist / 700) * 18;
                        this.vx += (dX / dist) * force;
                        this.vy += (dY / dist) * force;
                        this.vz += (dZ / dist) * force;
                    }
                }

                this.vx *= 0.85; this.vy *= 0.85; this.vz *= 0.85;
                this.x = px + this.vx;
                this.y = py + this.vy;
                this.z = pz + this.vz;
            }
        }

        let particles = [];
        function rebuildParticles() {
            particles = [];
            for (let i = 0; i < params.density; i++) {
                particles.push(new Particle());
            }
        }
        rebuildParticles();

        function updateSkeleton(t) {
            const time = t * params.speed;
            
            if (params.motion === 'taichi') {
                const baseY = Math.sin(time * 1.5) * 15;
                joints[3] = { x: 0, y: 30 + baseY, z: 0 };
                joints[2] = { x: Math.sin(time) * 12, y: -60 + baseY, z: Math.cos(time * 0.8) * 18 };
                joints[1] = { x: joints[2].x * 0.8, y: joints[2].y - 30, z: joints[2].z * 0.8 };
                joints[0] = { x: joints[1].x, y: joints[1].y - 25, z: joints[1].z };

                joints[4] = { x: joints[2].x - 35, y: joints[2].y + 8, z: joints[2].z };
                joints[5] = { x: joints[4].x - 30 + Math.sin(time * 1.2) * 25, y: joints[4].y + 25, z: joints[4].z + Math.cos(time * 1.2) * 35 };
                joints[6] = { x: joints[5].x - 20 + Math.cos(time * 1.5) * 30, y: joints[5].y - 12, z: joints[5].z + Math.sin(time * 1.5) * 25 };

                joints[7] = { x: joints[2].x + 35, y: joints[2].y + 8, z: joints[2].z };
                joints[8] = { x: joints[7].x + 30 + Math.cos(time * 1.2) * 25, y: joints[7].y + 30, z: joints[7].z - Math.sin(time * 1.2) * 35 };
                joints[9] = { x: joints[8].x + 20 - Math.sin(time * 1.5) * 30, y: joints[8].y - 18, z: joints[8].z - Math.cos(time * 1.5) * 25 };

                joints[10] = { x: -28, y: joints[3].y + 20, z: 0 };
                joints[11] = { x: -55, y: joints[10].y + 60, z: 25 };
                joints[12] = { x: -60, y: joints[11].y + 65, z: 0 };

                joints[13] = { x: 28, y: joints[3].y + 20, z: 0 };
                joints[14] = { x: 55, y: joints[13].y + 60, z: -15 };
                joints[15] = { x: 60, y: joints[14].y + 65, z: -25 };
            } 
            else if (params.motion === 'kick') {
                const cycle = (time * 2) % (Math.PI * 2);
                const kickExt = Math.max(0, Math.sin(cycle));

                joints[3] = { x: -10, y: 10 - kickExt * 25, z: 0 };
                joints[2] = { x: -20, y: -70, z: -10 };
                joints[1] = { x: -22, y: -100, z: -10 };
                joints[0] = { x: -25, y: -125, z: -10 };

                joints[10] = { x: -20, y: joints[3].y + 20, z: 10 };
                joints[11] = { x: 15 + kickExt * 50, y: joints[10].y - kickExt * 40, z: 25 };
                joints[12] = { x: 40 + kickExt * 110, y: joints[11].y - kickExt * 70, z: 35 };

                joints[13] = { x: 20, y: joints[3].y + 20, z: -10 };
                joints[14] = { x: 25, y: joints[13].y + 70, z: -10 };
                joints[15] = { x: 25, y: joints[14].y + 70, z: -10 };

                joints[4] = { x: -40, y: -65, z: 20 };
                joints[5] = { x: -25, y: -35, z: 45 };
                joints[6] = { x: 0, y: -50, z: 50 };

                joints[7] = { x: 0, y: -65, z: -20 };
                joints[8] = { x: 20, y: -40, z: -15 };
                joints[9] = { x: 25, y: -70, z: 0 };
            }
            else if (params.motion === 'chun') {
                const punchR = Math.sin(time * 9);
                const punchL = Math.cos(time * 9);

                joints[3] = { x: 0, y: 20, z: 0 };
                joints[2] = { x: 0, y: -60, z: 0 };
                joints[1] = { x: 0, y: -90, z: 0 };
                joints[0] = { x: 0, y: -115, z: 0 };

                joints[10] = { x: -30, y: 35, z: 0 };
                joints[11] = { x: -22, y: 90, z: 20 };
                joints[12] = { x: -32, y: 145, z: 0 };

                joints[13] = { x: 30, y: 35, z: 0 };
                joints[14] = { x: 22, y: 90, z: 20 };
                joints[15] = { x: 32, y: 145, z: 0 };

                joints[4] = { x: -30, y: -55, z: 0 };
                joints[5] = { x: -18, y: -35, z: 25 + punchL * 25 };
                joints[6] = { x: 0, y: -40, z: 50 + punchL * 75 };

                joints[7] = { x: 30, y: -55, z: 0 };
                joints[8] = { x: 18, y: -35, z: 25 + punchR * 25 };
                joints[9] = { x: 0, y: -40, z: 50 + punchR * 75 };
            }
        }

        function project3D(x, y, z) {
            let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            let x1 = x * cosY - z * sinY;
            let z1 = z * cosY + x * sinY;

            let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            let y2 = y * cosX - z1 * sinX;
            let z2 = z1 * cosX + y * sinX;

            const fov = 400;
            const distance = 480;
            const perspectiveScale = fov / (fov + z2 + distance);
            const totalScale = perspectiveScale * autoFitScale;

            return {
                x: width / 2 + x1 * totalScale,
                y: height / 2 + 20 * autoFitScale + y2 * totalScale,
                scale: totalScale,
                z: z2
            };
        }

        let lastTime = performance.now();
        let frameCount = 0;

        function animate(now) {
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // 背景細微網點
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let x = 0; x < width; x += 24) {
                for (let y = 0; y < height; y += 24) {
                    if ((x + y) % 48 === 0) ctx.fillRect(x, y, 1, 1);
                }
            }

            updateSkeleton(now * 0.001);

            if (shockwave.active) {
                shockwave.radius += 15;
                if (shockwave.radius > 700) shockwave.active = false;
            }

            // 繪製骨架線條 (Wireframe 模式)
            if (params.renderMode === 'wireframe') {
                ctx.strokeStyle = params.color;
                ctx.lineWidth = 1.5;
                BONES.forEach(bone => {
                    const pA = project3D(joints[bone.from].x, joints[bone.from].y, joints[bone.from].z);
                    const pB = project3D(joints[bone.to].x, joints[bone.to].y, joints[bone.to].z);
                    ctx.beginPath();
                    ctx.moveTo(pA.x, pA.y);
                    ctx.lineTo(pB.x, pB.y);
                    ctx.stroke();
                });
            }

            const renderList = [];
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.update(joints);
                const proj = project3D(p.x, p.y, p.z);
                renderList.push({ x: proj.x, y: proj.y, scale: proj.scale, z: proj.z });
            }

            renderList.sort((a, b) => b.z - a.z);

            // 粒子/網點繪製
            for (let i = 0; i < renderList.length; i++) {
                const p = renderList[i];
                
                if (params.renderMode === 'halftone') {
                    const depthFactor = Math.min(1.2, Math.max(0.1, (p.z + 280) / 500));
                    const radius = params.pointSize * p.scale * depthFactor * 1.8;
                    if (radius > 0.2) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = params.color;
                        ctx.fill();
                    }
                } 
                else if (params.renderMode === 'glow') {
                    const radius = params.pointSize * p.scale * 1.2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = params.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = params.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                else { // classic & wireframe
                    const radius = params.pointSize * p.scale;
                    ctx.fillStyle = params.color;
                    ctx.fillRect(p.x - radius/2, p.y - radius/2, radius, radius);
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', updateScreenDimensions);

        // 分頁切換
        window.switchTab = function(tabName, evt) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            evt.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        };

        // 色卡切換
        window.setColor = function(hexColor, el) {
            params.color = hexColor;
            document.getElementById('input-color').value = hexColor;
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
            if(el) el.classList.add('active');
        };

        // 視覺模式切換
        window.setRenderMode = function(mode) {
            params.renderMode = mode;
            document.querySelectorAll('#tab-style .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
        };

        // 招式切換
        window.setMotion = function(motion) {
            params.motion = motion;
            document.querySelectorAll('#tab-motion .btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${motion}`).classList.add('active');
        };

        // 滑鼠與觸控事件
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                rotY += (e.clientX - lastMouseX) * 0.006;
                rotX += (e.clientY - lastMouseY) * 0.006;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (isDragging && e.touches.length === 1) {
                rotY += (e.touches[0].clientX - lastMouseX) * 0.006;
                rotX += (e.touches[0].clientY - lastMouseY) * 0.006;
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchend', () => isDragging = false);

        canvas.addEventListener('click', () => {
            shockwave.x = 0; shockwave.y = 0; shockwave.z = 0;
            shockwave.radius = 0;
            shockwave.active = true;
        });

        // 選單 Slider 控制
        document.getElementById('input-density').addEventListener('input', (e) => {
            params.density = parseInt(e.target.value);
            document.getElementById('val-density').innerText = params.density;
            rebuildParticles();
        });

        document.getElementById('input-size').addEventListener('input', (e) => {
            params.pointSize = parseFloat(e.target.value);
            document.getElementById('val-size').innerText = params.pointSize.toFixed(1);
        });

        document.getElementById('input-speed').addEventListener('input', (e) => {
            params.speed = parseFloat(e.target.value);
            document.getElementById('val-speed').innerText = params.speed.toFixed(1);
        });

        document.getElementById('input-color').addEventListener('input', (e) => {
            params.color = e.target.value;
            document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
        });

        requestAnimationFrame(animate);
    </script>
</body>
</html>
