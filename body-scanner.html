<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科幻全像投影系統</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020712;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        /* 原生 2D 畫布，100% 本地相容 */
        #local-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .scifi-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        @keyframes floatAnimation {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-12px); }
            100% { transform: translate(-50%, -50%) translateY(0px); }
        }

        .scifi-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            padding: 25px;
            background: rgba(6, 26, 44, 0.5); /* 加深底色確保本地無毛玻璃時也清晰 */
            border: 1px solid #00f3ff;
            border-radius: 4px;
            color: #d1f4ff;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            z-index: 10;
            animation: floatAnimation 5s ease-in-out infinite;
        }

        .scifi-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 15px; height: 15px;
            border-top: 3px solid #ff0055;
            border-left: 3px solid #ff0055;
        }

        .panel-header {
            border-bottom: 1px solid rgba(0, 243, 255, 0.25);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .panel-title {
            margin: 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 14px;
        }

        .data-label { color: rgba(209, 244, 255, 0.6); }
        .data-value { color: #00f3ff; font-weight: bold; }

        .progress-bar-container {
            background: rgba(0, 243, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00f3ff, #ff0055);
            height: 100%;
            width: 78%; 
            box-shadow: 0 0 8px #00f3ff;
        }
    </style>
</head>
<body>

    <!-- 1. 純本地 Canvas 畫布層 -->
    <canvas id="local-canvas"></canvas>

    <!-- 2. 背景網格 -->
    <div class="scifi-overlay"></div>

    <!-- 3. 文字面板 -->
    <div class="scifi-panel">
        <div class="panel-header">
            <h2 class="panel-title">SYSTEM // VITAL_SIGNS</h2>
        </div>
        <div class="data-row">
            <span class="data-label">主體結構狀態</span>
            <span class="data-value">ONLINE</span>
        </div>
        <div class="data-row">
            <span class="data-label">神經網絡連結度</span>
            <span class="data-value">98.2 %</span>
        </div>
        <div class="data-row">
            <span class="data-label">全像投影穩定率</span>
            <span class="data-value">78 %</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-fill"></div>
        </div>
    </div>

    <script>
        // 本地純 JS 3D 粒子矩陣運算
        const canvas = document.getElementById('local-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // 生成 3D 球體點雲資料
        const points = [];
        const numPoints = 350; // 粒子數量
        const radius = 220;    // 3D 結構半徑

        for (let i = 0; i < numPoints; i++) {
            // 數學公式分配球面坐標
            let theta = Math.acos(Math.random() * 2 - 1);
            let phi = Math.random() * Math.PI * 2;

            points.push({
                x: radius * Math.sin(theta) * Math.cos(phi),
                y: radius * Math.sin(theta) * Math.sin(phi),
                z: radius * Math.cos(theta)
            });
        }

        let angleY = 0.01; // 旋轉速度
        let angleX = 0.005;

        function rotateY(point, angle) {
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            let x1 = point.x * cos - point.z * sin;
            let z1 = point.z * cos + point.x * sin;
            point.x = x1;
            point.z = z1;
        }

        function rotateX(point, angle) {
            let cos = Math.cos(angle);
            let sin = Math.sin(angle);
            let y1 = point.y * cos - point.z * sin;
            let z1 = point.z * cos + point.y * sin;
            point.y = y1;
            point.z = z1;
        }

        // 渲染循環
        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // 設定畫布重疊發光模式 (雷射全像感)
            ctx.globalCompositeOperation = 'screen';

            let cx = width / 2;
            let cy = height / 2;
            let fov = 400; // 視角深度

            points.forEach(p => {
                // 計算旋轉
                rotateY(p, angleY);
                rotateX(p, angleX);

                // 3D 投影到 2D 螢幕坐標
                let scale = fov / (fov + p.z);
                let x2d = p.x * scale + cx;
                let y2d = p.y * scale + cy;

                // 根據 3D 深度 (Z 軸) 決定粒子大小與透明度
                let size = (p.z + radius) / radius * 2 + 1;
                let alpha = (p.z + radius) / (radius * 2) * 0.6 + 0.2;

                // 繪製科技發光點
                ctx.beginPath();
                ctx.arc(x2d, y2d, size, 0, Math.PI * 2);
                
                // 漸層混合色（前半段偏藍，後半段偏粉）
                if (p.z > 0) {
                    ctx.fillStyle = `rgba(0, 243, 255, ${alpha})`;
                } else {
                    ctx.fillStyle = `rgba(255, 0, 85, ${alpha * 0.8})`;
                }
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }

        draw();

        // 監聽視窗縮放
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
