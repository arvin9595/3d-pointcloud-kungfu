<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科幻全像投影面板</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #030a16; /* 深科技感背景 */
            background-image: 
                radial-gradient(circle at 50% 50%, #0a1c3a 0%, #030a16 100%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px; /* 內建科幻網格背景 */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 呼吸漂浮動效 */
        @keyframes floatAnimation {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(0.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* 霓虹閃爍動效 */
        @keyframes glitchBlink {
            0%, 100% { opacity: 1; }
            95% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
            98% { opacity: 0.5; }
            99% { opacity: 1; }
        }

        /* 科幻毛玻璃面板 */
        .scifi-panel {
            width: 380px;
            padding: 25px;
            background: rgba(6, 26, 44, 0.4); /* 半透明暗藍 */
            border: 1px solid #00f3ff; /* 亮藍科幻邊框 */
            border-radius: 4px;
            color: #d1f4ff;
            backdrop-filter: blur(12px); /* 關鍵：毛玻璃透明感 */
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.15), 
                inset 0 0 15px rgba(0, 243, 255, 0.1);
            position: relative;
            animation: floatAnimation 6s ease-in-out infinite, glitchBlink 8s infinite;
        }

        /* 面板裝飾角 (Cyberpunk 常見的切角設計) */
        .scifi-panel::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px;
            width: 15px; height: 15px;
            border-top: 3px solid #ff0055; /* 霓虹紅點綴 */
            border-left: 3px solid #ff0055;
        }

        .panel-header {
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .panel-title {
            margin: 0;
            font-size: 18px;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); /* 文字發光 */
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 14px;
        }

        .data-label { color: rgba(209, 244, 255, 0.6); }
        .data-value { color: #00f3ff; font-weight: bold; }

        /* 科幻進度條 */
        .progress-bar-container {
            background: rgba(0, 243, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #00f3ff, #ff0055);
            height: 100%;
            width: 78%; /* 進度數值 */
            box-shadow: 0 0 8px #00f3ff;
        }
    </style>
</head>
<body>

    <!-- 科幻透明面板主體 -->
    <div class="scifi-panel">
        <div class="panel-header">
            <h2 class="panel-title">SYSTEM // VITAL_SIGNS</h2>
        </div>
        <div class="data-row">
            <span class="data-label">主體結構狀態</span>
            <span class="data-value">ONLINE</span>
        </div>
        <div class="data-row">
            <span class="data-label">神經網絡連結度</span>
            <span class="data-value">98.2 %</span>
        </div>
        <div class="data-row">
            <span class="data-label">全像投影穩定率</span>
            <span class="data-value">78 %</span>
        </div>
        <!-- 進度條展示 -->
        <div class="progress-bar-container">
            <div class="progress-fill"></div>
        </div>
    </div>

</body>
</html>
