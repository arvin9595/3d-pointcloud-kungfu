<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraLens 3D | 次世代 3D 地球與實景導覽系統</title>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 現代化 Glassmorphism UI 面板 */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 340px;
            padding: 20px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .hud-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #38ef7d, #11998e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .hud-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        /* 導覽按鈕群組 */
        .tour-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-tour {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(56, 239, 125, 0.2), rgba(17, 153, 142, 0.2));
            border: 1px solid rgba(56, 239, 125, 0.4);
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-tour:hover {
            background: linear-gradient(135deg, rgba(56, 239, 125, 0.4), rgba(17, 153, 142, 0.4));
            border-color: #38ef7d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
        }

        /* 故事介紹卡片 (Cinematic Story Card) */
        .story-card {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            width: 380px;
            padding: 24px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 16px;
            color: #f8fafc;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .story-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .story-tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 4px 8px;
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .story-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .story-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <!-- UI 面板 -->
    <div class="hud-panel">
        <div class="hud-title">TERRALENS 3D</div>
        <div class="hud-subtitle">次世代 3D 地球與實景導覽系統</div>

        <div class="tour-controls">
            <button class="btn-tour" onclick="flyToLocation(0)">
                <span>01. 台灣 玉山主峰</span>
                <small>3,952 m</small>
            </button>
            <button class="btn-tour" onclick="flyToLocation(1)">
                <span>02. 日本 東京塔</span>
                <small>332.9 m</small>
            </button>
            <button class="btn-tour" onclick="flyToLocation(2)">
                <span>03. 美國 大峽谷</span>
                <small>Grand Canyon</small>
            </button>
            <button class="btn-tour" style="margin-top: 8px; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);" onclick="resetView()">
                <span>返回全景視角</span>
                <small>Global View</small>
            </button>
        </div>
    </div>

    <!-- 故事卡片 UI -->
    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">DESTINATION</div>
        <div id="storyTitle" class="story-title">地標標題</div>
        <div id="storyDesc" class="story-desc">地標詳細介紹內容...</div>
    </div>

    <!-- CesiumJS Library -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        // 1. 初始化 Cesium 引擎與基本設定
        Cesium.Ion.defaultAccessToken = ''; 

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain({
                requestWaterMask: true,
                requestVertexNormals: true
            }),
            animation: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            navigationHelpButton: false,
            scene3DOnly: true
        });

        const scene = viewer.scene;

        // 2. 強化物理大氣散射與視覺效果
        scene.globe.enableLighting = true;
        scene.globe.atmosphereRayleighScattering = new Cesium.Cartesian3(5.5e-6, 13.0e-6, 28.4e-6);
        scene.globe.showGroundAtmosphere = true;
        scene.skyAtmosphere.show = true;
        scene.highDynamicRange = true;

        // 3. 預留 OpenStreetMap 3D 建築加載
        async function init3DTiles() {
            try {
                const buildingTileset = await Cesium.createOsmBuildingsAsync();
                scene.primitives.add(buildingTileset);
            } catch (error) {
                console.log("3D Tiles 加載提示:", error);
            }
        }
        init3DTiles();

        // 4. 劇本化故事導覽資料庫
        const tourScript = [
            {
                name: "玉山主峰 (Mt. Jade)",
                tag: "TAIWAN / MOUNTAIN",
                desc: "東亞第一高峰，海拔 3,952 公尺。具備極具震撼力的山脈地質構造與高山地形，在 3D 地形加載下可呈現極致雄偉的脊樑特徵。",
                destination: Cesium.Cartesian3.fromDegrees(120.9573, 23.4700, 4800),
                orientation: {
                    heading: Cesium.Math.toRadians(30.0),
                    pitch: Cesium.Math.toRadians(-20.0),
                    roll: 0.0
                }
            },
            {
                name: "東京鐵塔 (Tokyo Tower)",
                tag: "JAPAN / URBAN",
                desc: "位於日本東京都港區的標誌性鐵塔。結合 3D Tiles 城市建築網格，能在夜間光影與日落時分呈現出細膩的都市沉浸感。",
                destination: Cesium.Cartesian3.fromDegrees(139.7454, 35.6540, 600),
                orientation: {
                    heading: Cesium.Math.toRadians(45.0),
                    pitch: Cesium.Math.toRadians(-25.0),
                    roll: 0.0
                }
            },
            {
                name: "大峽谷國家公園 (Grand Canyon)",
                tag: "USA / NATURE",
                desc: "世界七大自然奇景之一，由科羅拉多河億萬年切割而成。透過高解析度高程圖與地層紋理，展現出絕佳的地質層次與大氣散射霞光。",
                destination: Cesium.Cartesian3.fromDegrees(-112.1129, 36.1069, 3200),
                orientation: {
                    heading: Cesium.Math.toRadians(290.0),
                    pitch: Cesium.Math.toRadians(-18.0),
                    roll: 0.0
                }
            }
        ];

        // 5. 電影級平滑飛行運鏡控制
        function flyToLocation(index) {
            const target = tourScript[index];
            if (!target) return;

            hideStoryCard();

            viewer.camera.flyTo({
                destination: target.destination,
                orientation: target.orientation,
                duration: 4.5,
                easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT,
                complete: () => {
                    showStoryCard(target);
                }
            });
        }

        function resetView() {
            hideStoryCard();
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, 12000000),
                duration: 3.0,
                easingFunction: Cesium.EasingFunction.QUINTIC_OUT
            });
        }

        // 6. UI 卡片互動邏輯
        const storyCard = document.getElementById('storyCard');
        const storyTag = document.getElementById('storyTag');
        const storyTitle = document.getElementById('storyTitle');
        const storyDesc = document.getElementById('storyDesc');

        function showStoryCard(data) {
            storyTag.innerText = data.tag;
            storyTitle.innerText = data.name;
            storyDesc.innerText = data.desc;
            storyCard.classList.add('active');
        }

        function hideStoryCard() {
            storyCard.classList.remove('active');
        }
    </script>
</body>
</html>
