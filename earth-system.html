<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSHIP COCKPIT // GLOBAL HUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background-color: #000205; font-family: 'Courier New', Courier, monospace, sans-serif; 
            color: #00f2fe; cursor: crosshair;
            display: flex; justify-content: center; align-items: center;
        }

        .space-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at center, #051329 0%, #01040a 100%);
        }

        .cockpit-screen-frame {
            position: relative; width: 96vw; height: 94vh; z-index: 5;
            border: 2px solid rgba(0, 242, 254, 0.4);
            background: rgba(1, 5, 12, 0.82);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.2), inset 0 0 60px rgba(0, 242, 254, 0.08);
            display: grid;
            grid-template-columns: 320px 1fr 380px;
            grid-template-rows: 40px 1fr 30px;
            padding: 12px; gap: 12px;
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
        }

        .screen-top-bar {
            grid-column: 1 / 4;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            padding-bottom: 5px; font-size: 0.75rem; letter-spacing: 2px; color: #ffe600;
        }

        .mod-nav {
            grid-column: 1 / 2; grid-row: 2 / 3;
            background: rgba(2, 9, 20, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.4);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .module-header {
            padding: 8px 10px; background: rgba(0, 242, 254, 0.15);
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            font-size: 0.7rem; font-weight: bold; letter-spacing: 1.5px;
            display: flex; justify-content: space-between; color: #00f2fe;
        }
        .tour-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .tour-list::-webkit-scrollbar { width: 3px; }
        .tour-list::-webkit-scrollbar-thumb { background: #00f2fe; }

        .accordion-header {
            background: rgba(0, 242, 254, 0.06); border: 1px solid rgba(0, 242, 254, 0.3);
            color: #ffe600; padding: 6px 10px; font-size: 0.7rem; font-weight: bold;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .accordion-header::after { content: '►'; font-size: 0.55rem; transition: transform 0.3s; }
        .accordion-header.active::after { transform: rotate(90deg); color: #ff0055; }

        .accordion-content {
            max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out;
            display: flex; flex-direction: column; gap: 4px; padding-left: 4px;
        }
        .accordion-content.show { max-height: 500px; transition: max-height 0.3s ease-in; padding-top: 4px; }

        .btn-target {
            width: 100%; padding: 8px 10px; background: rgba(0, 242, 254, 0.03);
            border: 1px solid rgba(0, 242, 254, 0.25); color: #00f2fe;
            font-family: inherit; font-size: 0.7rem; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            position: relative; overflow: hidden; transition: all 0.2s;
        }
        .btn-target:hover { background: rgba(0, 242, 254, 0.15); border-color: #00f2fe; color: #fff; }
        
        .btn-target.active { 
            background: rgba(255, 0, 85, 0.15); border-color: #ff0055; color: #ff0055; font-weight: bold; 
        }
        .btn-target.active::before {
            content: '';
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(255, 0, 85, 0.8), transparent 30%);
            animation: ai-ring-spin 1.5s linear infinite;
            z-index: 1; pointer-events: none;
        }
        .btn-target.active span, .btn-target.active small { position: relative; z-index: 2; }

        @keyframes ai-ring-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #canvas-container {
            grid-column: 2 / 3; grid-row: 2 / 3;
            position: relative; width: 100%; height: 100%; overflow: hidden;
            border: 1px solid rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.1);
        }

        .mod-sub-screen {
            grid-column: 3 / 4; grid-row: 2 / 3;
            background: rgba(2, 9, 20, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.4);
            display: flex; flex-direction: column; padding: 8px; gap: 8px; overflow-y: auto;
        }
        .map-frame-box {
            width: 100%; height: 160px; border: 1px solid #00f2fe; background: #000; position: relative;
        }
        .map-iframe { width: 100%; height: 100%; border: none; }

        .data-card {
            background: rgba(0, 242, 254, 0.04); border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 8px; font-size: 0.7rem; display: flex; flex-direction: column; gap: 4px;
        }
        .data-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0, 242, 254, 0.2); padding-bottom: 3px; }
        .data-val { color: #ffe600; font-weight: bold; }

        .desc-box {
            font-size: 0.7rem; line-height: 1.4; color: #cbd5e1;
            background: rgba(0, 0, 0, 0.5); padding: 8px; border-left: 2px solid #00f2fe;
            flex: 1; overflow-y: auto;
        }

        .screen-bottom-bar {
            grid-column: 1 / 4; grid-row: 3 / 4;
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid rgba(0, 242, 254, 0.3);
            font-size: 0.65rem; color: rgba(0, 242, 254, 0.6);
        }

        .click-pulse {
            position: absolute; width: 12px; height: 12px; border: 2px solid #00f2fe;
            border-radius: 50%; pointer-events: none; z-index: 99;
            animation: pulse-anim 0.4s ease-out forwards;
        }
        @keyframes pulse-anim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="space-bg"></div>

    <div class="cockpit-screen-frame">
        
        <div class="screen-top-bar">
            <span>[SYS.VER // GLOBAL COCKPIT HUD]</span>
            <span style="color:#00f2fe;">TOUCH CONTROL: ACTIVE</span>
            <span>SECURE LINK: ONLINE</span>
        </div>

        <div class="mod-nav">
            <div class="module-header">
                <span>[GLOBAL TARGETS]</span>
                <small style="color:#ffe600;">FULL WORLD</small>
            </div>
            <div class="tour-list" id="accordionContainer"></div>
        </div>

        <div id="canvas-container"></div>

        <div class="mod-sub-screen">
            <div class="module-header">
                <span>[TARGET ANALYZER]</span>
                <span style="color:#ffe600;" id="targetStatus">STANDBY</span>
            </div>

            <div class="map-frame-box">
                <iframe class="map-iframe" id="mapIframe" src="about:blank"></iframe>
            </div>

            <div class="data-card">
                <div class="data-row"><span>目標地標:</span><span class="data-val" id="targetName" style="color:#ff0055;">請選擇目標</span></div>
                <div class="data-row"><span>歷史年代:</span><span class="data-val" id="targetEra">--</span></div>
                <div class="data-row"><span>軌道距離:</span><span class="data-val" id="targetDist">35,000 KM</span></div>
                <div class="data-row"><span>座標位置:</span><span class="data-val" id="targetCoords">0.00° N, 0.00° E</span></div>
            </div>

            <div class="desc-box" id="targetDesc">
                >> 系統準備就緒。<br>點擊左側地標按鈕，將解鎖全球目標並載入詳細情資。
            </div>
        </div>

        <div class="screen-bottom-bar">
            <span>STATUS: ALL SYSTEMS NOMINAL</span>
            <span>AI CORE: GLOBAL MAPPING ACTIVE</span>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'lock') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'expand') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            }
        }

        // 全球完整地標資料庫 (包含非洲、亞洲、歐洲、美洲、大洋洲)
        const tourData = [
            {
                category: "[01] 非洲大陸 (AFRICA)",
                items: [
                    { name: "吉薩金字塔群", sub: "GIZA PYRAMIDS", lat: 29.9792, lon: 31.1342, era: "BC 2560年", dist: "36,450 KM", desc: "埃及尼羅河流域，古代世界七大奇蹟中唯一保存至今的偉大宏偉陵墓群。" },
                    { name: "卡納克神廟", sub: "KARNAK TEMPLE", lat: 25.7188, lon: 32.6573, era: "BC 2000年", dist: "36,200 KM", desc: "埃及路克索龐大的古神廟遺址，以巨大的多柱廳與石雕壁畫聞名於世。" },
                    { name: "桌山", sub: "TABLE MOUNTAIN", lat: -33.9628, lon: 18.4098, era: "遠古造山地貌", dist: "41,000 KM", desc: "南非開普敦的地標，擁有平坦如桌面的山頂，俯瞰大西洋與印度洋交會處。" },
                    { name: "維多利亞瀑布", sub: "VICTORIA FALLS", lat: -17.9243, lon: 25.8572, era: "自然奇觀", dist: "39,500 KM", desc: "位於贊比西河上，世界最大瀑布群之一，水霧如煙霧般震撼壯麗。" }
                ]
            },
            {
                category: "[02] 亞洲大陸 (ASIA)",
                items: [
                    { name: "台北 101", sub: "TAIPEI 101", lat: 25.0330, lon: 121.5645, era: "2004 年竣工", dist: "35,508 KM", desc: "臺灣地標，融合竹節意象與風阻尼球抗震科技的高空摩天大樓。" },
                    { name: "萬里長城 (八達嶺)", sub: "GREAT WALL", lat: 40.4319, lon: 116.5704, era: "明代修築", dist: "35,210 KM", desc: "橫亙中國北方崇山峻嶺間之宏偉防禦工事，人類文明歷史奇蹟。" },
                    { name: "泰姬瑪哈陵", sub: "TAJ MAHAL", lat: 27.1751, lon: 78.0421, era: "1653 年竣工", dist: "35,800 KM", desc: "印度阿格拉的純白大理石陵寢，蒙兀兒帝國建築藝術的巔峰之作。" },
                    { name: "東京晴空塔", sub: "TOKYO SKYTREE", lat: 35.7100, lon: 139.8107, era: "2012 年啟用", dist: "35,350 KM", desc: "高 634 公尺，融合日本傳統美學與現代鋼構技術的通訊塔。" }
                ]
            },
            {
                category: "[03] 歐洲大陸 (EUROPE)",
                items: [
                    { name: "巴黎 艾菲爾鐵塔", sub: "EIFFEL TOWER", lat: 48.8584, lon: 2.2945, era: "1889 年落成", dist: "37,100 KM", desc: "法國巴黎標誌性鐵件建築，工業革命與現代設計的先驅。" },
                    { name: "羅馬競技場", sub: "COLOSSEUM", lat: 41.8902, lon: 12.4922, era: "AD 80 年", dist: "36,900 KM", desc: "古羅馬帝國時期最大之圓形角鬥場，精湛的混凝土拱門工程。" },
                    { name: "雅典帕德嫩神廟", sub: "PARTHENON", lat: 37.9715, lon: 23.7266, era: "BC 438 年", dist: "36,600 KM", desc: "希臘雅典衛城核心，古希臘古典建築與美學黃金比例的典範。" }
                ]
            },
            {
                category: "[04] 美洲與大洋洲 (AMERICA & OCEANIA)",
                items: [
                    { name: "紐約 自由女神像", sub: "STATUE OF LIBERTY", lat: 40.6892, lon: -74.0445, era: "1886 年揭幕", dist: "37,800 KM", desc: "美國紐約港的巨大銅像，象徵民主、自由與美法友誼。" },
                    { name: "印加 馬丘比丘", sub: "MACHU PICCHU", lat: -13.1631, lon: -72.5450, era: "AD 1450 年", dist: "38,200 KM", desc: "秘魯安地斯山脈上的神祕天空之城，高精密度乾砌石工藝。" },
                    { name: "雪梨歌劇院", sub: "SYDNEY OPERA HOUSE", lat: -33.8568, lon: 151.2153, era: "1973 年啟用", dist: "38,500 KM", desc: "澳洲雪梨港灣的貝殼造型現代主義建築傑作。" }
                ]
            }
        ];

        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');
            const EARTH_RADIUS = 5;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            camera.position.set(0, 0, 22);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);

            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const textureLoader = new THREE.TextureLoader();
            // 使用標準等距柱狀世界地圖
            const texture = textureLoader.load('https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg', (tex) => {
                // 載入成功後微調地球初始旋轉，讓非洲與歐亞大陸對準正前方
                earth.rotation.y = -Math.PI / 2.2;
            });
            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            function latLonToVector3(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const z = (radius * Math.sin(phi) * Math.sin(theta));
                const y = (radius * Math.cos(phi));
                return new THREE.Vector3(x, y, z);
            }

            const accordionContainer = document.getElementById('accordionContainer');
            let globalLocations = [];
            let locIndex = 0;

            tourData.forEach((group, gIdx) => {
                const head = document.createElement('div');
                head.className = 'accordion-header';
                head.innerText = group.category;

                const content = document.createElement('div');
                content.className = 'accordion-content';

                if (gIdx === 0) {
                    head.classList.add('active');
                    content.classList.add('show');
                }

                head.onclick = () => {
                    playSound('expand');
                    head.classList.toggle('active');
                    content.classList.toggle('show');
                };

                group.items.forEach(item => {
                    const pos = latLonToVector3(item.lat, item.lon, EARTH_RADIUS + 0.02);

                    const dotGeo = new THREE.SphereGeometry(0.06, 16, 16);
                    const dotMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
                    const dotMesh = new THREE.Mesh(dotGeo, dotMat);
                    dotMesh.position.copy(pos);
                    earth.add(dotMesh);

                    const ringGeo = new THREE.RingGeometry(0.08, 0.15, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.copy(pos.clone().multiplyScalar(1.01));
                    ringMesh.lookAt(pos.clone().multiplyScalar(2));
                    ringMesh.visible = false;
                    earth.add(ringMesh);

                    const btn = document.createElement('button');
                    btn.className = 'btn-target';
                    const idx = locIndex;
                    btn.id = `btn-${idx}`;
                    btn.onclick = () => updateSubScreen(idx);
                    btn.innerHTML = `<span>${item.name}</span><small style="color:#64748b;">${item.sub}</small>`;
                    content.appendChild(btn);

                    globalLocations.push({ ...item, targetPos: pos, dotMesh: dotMesh, ringMesh: ringMesh });
                    locIndex++;
                });

                accordionContainer.appendChild(head);
                accordionContainer.appendChild(content);
            });

            window.updateSubScreen = function(index) {
                playSound('lock');
                const loc = globalLocations[index];

                globalLocations.forEach((item, i) => {
                    item.dotMesh.material.color.setHex(0x00f2fe);
                    item.ringMesh.visible = false;
                    const b = document.getElementById(`btn-${i}`);
                    if (b) b.classList.remove('active');
                });

                loc.dotMesh.material.color.setHex(0xff0055);
                loc.ringMesh.visible = true;
                const activeBtn = document.getElementById(`btn-${index}`);
                if (activeBtn) activeBtn.classList.add('active');

                loc.ringMesh.scale.set(1, 1, 1);
                new TWEEN.Tween(loc.ringMesh.scale)
                    .to({ x: 2.2, y: 2.2, z: 2.2 }, 800)
                    .yoyo(true).repeat(Infinity).start();

                document.getElementById('targetStatus').innerText = "LOCKED";
                document.getElementById('targetStatus').style.color = "#ff0055";
                document.getElementById('targetName').innerText = loc.name;
                document.getElementById('targetEra').innerText = loc.era;
                document.getElementById('targetDist').innerText = loc.dist || "35,000 KM";
                document.getElementById('targetCoords').innerText = `${loc.lat.toFixed(2)}° N, ${loc.lon.toFixed(2)}° E`;
                document.getElementById('targetDesc').innerHTML = `>> <span style="color:#ff0055;">[AI 全球鎖定]</span> 情資：<br>${loc.desc}`;

                const googleMapUrl = `https://maps.google.com/maps?q=${loc.lat},${loc.lon}&t=k&z=15&ie=UTF8&iwloc=&output=embed`;
                document.getElementById('mapIframe').src = googleMapUrl;
            };

            window.addEventListener('click', (e) => {
                initAudio();
                const pulse = document.createElement('div');
                pulse.className = 'click-pulse';
                pulse.style.left = `${e.clientX - 6}px`;
                pulse.style.top = `${e.clientY - 6}px`;
                document.body.appendChild(pulse);
                setTimeout(() => pulse.remove(), 400);
            });

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();
                // 如果沒有手動轉動地球，讓它微微自轉
                earth.rotation.y += 0.0003;
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        });
    </script>
</body>
</html>
