<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球與全亞洲全球導覽系統 (NASA 貼圖版)</title>
    <!-- CesiumJS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.115.0/Widgets/widgets.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 左側導覽控制面板 */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 320px;
            max-height: calc(100vh - 40px);
            padding: 18px;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .hud-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-status {
            font-size: 0.75rem;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
        }

        /* 景點列表滾動區 */
        .tour-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            max-height: 55vh;
        }

        .tour-list::-webkit-scrollbar {
            width: 4px;
        }
        .tour-list::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.4);
            border-radius: 4px;
        }

        .category-title {
            font-size: 0.75rem;
            color: #00f2fe;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            padding-bottom: 3px;
        }

        .btn-tour {
            width: 100%;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-tour:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: #00f2fe;
            transform: translateX(3px);
        }

        .btn-orbit {
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(79, 172, 254, 0.25));
            border-color: #00f2fe;
            flex-shrink: 0;
        }

        /* 右側面板 */
        .telemetry-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 280px;
            padding: 16px;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            color: #e2e8f0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            font-size: 0.8rem;
        }

        .telemetry-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #00f2fe;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            padding-bottom: 4px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .data-label { color: #94a3b8; }
        .data-value { color: #38bdf8; font-family: monospace; font-weight: 600; }

        /* 底部詳細介紹卡片 */
        .story-card {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 10;
            width: 420px;
            max-width: 90vw;
            padding: 16px 20px;
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            color: #f8fafc;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .story-card.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .story-tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .story-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
        .story-desc { font-size: 0.82rem; line-height: 1.4; color: #cbd5e1; }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <div class="hud-panel">
        <div class="hud-title">EARTH EXPLORER</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span id="statusText">太空中：軌道運轉中</span>
        </div>

        <div class="tour-list" id="tourList"></div>

        <button class="btn-tour btn-orbit" onclick="returnToOrbit()">
            <span>🚀 返回太空軌道俯瞰</span>
            <small>Orbit View</small>
        </button>
    </div>

    <div class="telemetry-panel">
        <div class="telemetry-title">🌐 地球與即時數據 (Data)</div>
        <div class="data-row"><span class="data-label">視角高度:</span><span class="data-value" id="valAltitude">15,000 km</span></div>
        <div class="data-row"><span class="data-label">中心緯度:</span><span class="data-value" id="valLat">23.500° N</span></div>
        <div class="data-row"><span class="data-label">中心經度:</span><span class="data-value" id="valLon">121.000° E</span></div>

        <div class="telemetry-title" style="margin-top: 12px;">🪐 天文常數</div>
        <div class="data-row"><span class="data-label">自轉週期:</span><span class="data-value">23小時 56分 4秒</span></div>
        <div class="data-row"><span class="data-label">赤道自轉線速度:</span><span class="data-value">1,670 km/h</span></div>
        <div class="data-row"><span class="data-label">公轉平均速度:</span><span class="data-value">29.78 km/s</span></div>
    </div>

    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">LOCATION</div>
        <div id="storyTitle" class="story-title">景點名稱</div>
        <div id="storyDesc" class="story-desc">景點詳細說明...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.115.0/Cesium.js"></script>
    <script>
        window.addEventListener('load', () => {
            // 使用 NASA Blue Marble 高解析度衛星圖像作為底圖
            const viewer = new Cesium.Viewer('cesiumContainer', {
                imageryProvider: new Cesium.SingleTileImageryProvider({
                    url: 'https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Assets/Textures/NaturalEarthII/256/0/0/0.jpg'
                }),
                animation: false,
                baseLayerPicker: false,
                fullscreenButton: false,
                geocoder: false,
                homeButton: false,
                infoBox: false,
                sceneModePicker: false,
                selectionIndicator: false,
                timeline: false,
                navigationHelpButton: false,
                scene3DOnly: true
            });

            const scene = viewer.scene;
            scene.globe.enableLighting = true;

            let isOrbiting = true;
            const orbitAltitude = 15000000;
            let lastTime = Date.now();

            viewer.clock.onTick.addEventListener(() => {
                if (isOrbiting) {
                    const now = Date.now();
                    const delta = (now - lastTime) / 1000;
                    lastTime = now;
                    scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.04 * delta);
                }

                const cameraPosition = viewer.camera.positionCartographic;
                if (cameraPosition) {
                    const alt = (cameraPosition.height / 1000).toFixed(0);
                    const lat = (Cesium.Math.toDegrees(cameraPosition.latitude)).toFixed(3);
                    const lon = (Cesium.Math.toDegrees(cameraPosition.longitude)).toFixed(3);

                    document.getElementById('valAltitude').innerText = Number(alt).toLocaleString() + " km";
                    document.getElementById('valLat').innerText = Math.abs(lat) + "° " + (lat >= 0 ? 'N' : 'S');
                    document.getElementById('valLon').innerText = Math.abs(lon) + "° " + (lon >= 0 ? 'E' : 'W');
                }
            });

            // 涵蓋全亞洲及全球各大洲主要地標的完整數據庫
            const tourData = [
                {
                    category: "🇹🇼 臺灣經典名勝",
                    items: [
                        { name: "台北 101", sub: "Taipei 101", tag: "TAIPEI / URBAN", desc: "臺灣第一高樓，高度 508 公尺，信義區指標建築。", lon: 121.5645, lat: 25.0330, range: 12000, pitch: -45 },
                        { name: "玉山主峰", sub: "Yushan Peak", tag: "TAIWAN / MOUNTAIN", desc: "東北亞第一高峰，海拔 3,952 公尺。", lon: 120.9573, lat: 23.4700, range: 35000, pitch: -50 },
                        { name: "高雄流行音樂中心", sub: "Kaohsiung Music Center", tag: "KAOHSIUNG / HARBOR", desc: "高雄港愛河灣文化新地標。", lon: 120.2930, lat: 22.6180, range: 15000, pitch: -45 },
                        { name: "日月潭", sub: "Sun Moon Lake", tag: "NANTOU / LAKE", desc: "臺灣最大半天然湖泊，高空視野極佳。", lon: 120.9159, lat: 23.8517, range: 25000, pitch: -50 },
                        { name: "太魯閣國家公園", sub: "Taroko Gorge", tag: "HUALIEN / GORGE", desc: "雄偉的大理岩峽谷景觀。", lon: 121.5500, lat: 24.1600, range: 30000, pitch: -50 }
                    ]
                },
                {
                    category: "🇯🇵 東亞：日本",
                    items: [
                        { name: "東京鐵塔", sub: "Tokyo Tower", tag: "JAPAN / TOKYO", desc: "日本首都著名地標塔。", lon: 139.7454, lat: 35.6586, range: 15000, pitch: -45 },
                        { name: "富士山", sub: "Mount Fuji", tag: "JAPAN / FUJI", desc: "日本最高峰，海拔 3,776 公尺的聖山。", lon: 138.7274, lat: 35.3606, range: 40000, pitch: -50 },
                        { name: "京都 清水寺", sub: "Kiyomizu-dera", tag: "JAPAN / KYOTO", desc: "古都京都最著名的古老寺院。", lon: 135.7850, lat: 34.9948, range: 15000, pitch: -45 }
                    ]
                },
                {
                    category: "🇰🇷 東亞：韓國",
                    items: [
                        { name: "首爾 N首爾塔", sub: "N Seoul Tower", tag: "KOREA / SEOUL", desc: "座落於南山之巔的首爾城市地標。", lon: 126.9882, lat: 37.5512, range: 15000, pitch: -45 },
                        { name: "漢拏山 (濟州島)", sub: "Hallasan Peak", tag: "KOREA / JEJU", desc: "韓國最高峰，位於濟州島中央。", lon: 126.5370, lat: 33.3617, range: 35000, pitch: -50 }
                    ]
                },
                {
                    category: "🇨🇳 🇭🇰 東亞：中國與香港",
                    items: [
                        { name: "香港 維多利亞港", sub: "Victoria Harbour", tag: "HONG KONG / HARBOR", desc: "世界三大夜景之一的天際線。", lon: 114.1628, lat: 22.2859, range: 20000, pitch: -45 },
                        { name: "北京 故宮博物院", sub: "Forbidden City", tag: "CHINA / BEIJING", desc: "世界規模最大的木結構古建築群。", lon: 116.3972, lat: 39.9166, range: 15000, pitch: -45 },
                        { name: "萬里長城 (八達嶺)", sub: "Great Wall", tag: "CHINA / HERITAGE", desc: "浩瀚的古代防禦工程建築奇蹟。", lon: 116.0169, lat: 40.3597, range: 30000, pitch: -50 }
                    ]
                },
                {
                    category: "🇸🇬 🇹🇭 🇰🇭 東南亞區域",
                    items: [
                        { name: "新加坡 濱海灣金沙", sub: "Marina Bay Sands", tag: "SINGAPORE / URBAN", desc: "新加坡最具代表性的現代建築群。", lon: 103.8597, lat: 1.2834, range: 15000, pitch: -45 },
                        { name: "柬埔寨 吳哥窟", sub: "Angkor Wat", tag: "CAMBODIA / HERITAGE", desc: "高棉帝國宏偉的石造廟宇遺跡。", lon: 103.8670, lat: 13.4125, range: 25000, pitch: -50 },
                        { name: "泰國 曼谷大皇宮", sub: "Grand Palace", tag: "THAILAND / BANGKOK", desc: "曼谷市中心輝煌的泰式皇宮建築。", lon: 100.4916, lat: 13.7500, range: 15000, pitch: -45 },
                        { name: "印尼 峇里島阿貢火山", sub: "Mount Agung", tag: "INDONESIA / BALI", desc: "峇里島最高峰與聖山。", lon: 115.5080, lat: -8.3405, range: 35000, pitch: -50 }
                    ]
                },
                {
                    category: "🇮🇳 🇳🇵 南亞區域",
                    items: [
                        { name: "印度 泰姬瑪哈陵", sub: "Taj Mahal", tag: "INDIA / HERITAGE", desc: "世界七大奇蹟之一的大理石陵墓。", lon: 78.0421, lat: 27.1751, range: 15000, pitch: -45 },
                        { name: "尼泊爾 聖母峰", sub: "Mount Everest", tag: "NEPAL / HIMALAYAS", desc: "地球第一高峰，海拔 8,848.86 公尺。", lon: 86.9250, lat: 27.9881, range: 45000, pitch: -50 }
                    ]
                },
                {
                    category: "🇦🇪 🇸🇦 中東區域",
                    items: [
                        { name: "杜拜 哈里發塔", sub: "Burj Khalifa", tag: "UAE / DUBAI", desc: "全球第一高樓，高度達 828 公尺。", lon: 55.2744, lat: 25.1972, range: 15000, pitch: -45 },
                        { name: "沙烏地 麥加禁寺", sub: "Masjid al-Haram", tag: "SAUDI / MECCA", desc: "伊斯蘭教最神聖的聖地。", lon: 39.8262, lat: 21.4225, range: 15000, pitch: -45 }
                    ]
                },
                {
                    category: "🌍 歐洲與非洲重點",
                    items: [
                        { name: "法國 艾菲爾鐵塔", sub: "Eiffel Tower", tag: "FRANCE / PARIS", desc: "巴黎最具代表性的鋼鐵地標。", lon: 2.2945, lat: 48.8584, range: 15000, pitch: -45 },
                        { name: "埃及 吉薩金字塔", sub: "Giza Pyramids", tag: "EGYPT / CAIRO", desc: "千年古文明吉薩金字塔群。", lon: 31.1342, lat: 29.9792, range: 20000, pitch: -45 },
                        { name: "坦尚尼亞 乞力馬扎羅山", sub: "Kilimanjaro", tag: "TANZANIA / AFRICA", desc: "非洲最高峰，獨立火山結構。", lon: 37.3556, lat: -3.0674, range: 40000, pitch: -50 }
                    ]
                },
                {
                    category: "🌎 美洲與極地",
                    items: [
                        { name: "美國 大峽谷", sub: "Grand Canyon", tag: "USA / NATURE", desc: "科羅拉多河切割出的壯麗自然奇觀。", lon: -112.1129, lat: 36.1069, range: 50000, pitch: -50 },
                        { name: "巴西 救世基督像", sub: "Christ the Redeemer", tag: "BRAZIL / RIO", desc: "里約熱內盧駝背山上的巨大雕像。", lon: -43.2105, lat: -22.9519, range: 15000, pitch: -45 },
                        { name: "南極洲 南極點", sub: "South Pole", tag: "ANTARCTICA / POLE", desc: "地球最南端極點。", lon: 0.0000, lat: -90.0000, range: 100000, pitch: -60 }
                    ]
                }
            ];

            const tourListContainer = document.getElementById('tourList');
            let globalLocations = [];
            let locIndex = 0;

            tourData.forEach(group => {
                const catHeader = document.createElement('div');
                catHeader.className = 'category-title';
                catHeader.innerText = group.category;
                tourListContainer.appendChild(catHeader);

                group.items.forEach(item => {
                    // 地表發光標示點與標籤
                    viewer.entities.add({
                        name: item.name,
                        position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat, 100),
                        point: { pixelSize: 8, color: Cesium.Color.fromCssColorString('#00f2fe'), outlineColor: Cesium.Color.WHITE, outlineWidth: 1.5 },
                        label: {
                            text: item.name,
                            font: '13px sans-serif',
                            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                            outlineWidth: 2,
                            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                            pixelOffset: new Cesium.Cartesian2(0, -10),
                            fillColor: Cesium.Color.WHITE
                        }
                    });

                    // 選單按鈕生成
                    const btn = document.createElement('button');
                    btn.className = 'btn-tour';
                    const currentIndex = locIndex;
                    btn.onclick = () => flyToLocation(currentIndex);
                    btn.innerHTML = `<span>${item.name}</span><small style="color:#00f2fe">${item.sub}</small>`;
                    tourListContainer.appendChild(btn);

                    globalLocations.push(item);
                    locIndex++;
                });
            });

            window.flyToLocation = function(index) {
                isOrbiting = false;
                document.getElementById('statusText').innerText = "地面模式：景點對焦中";
                document.getElementById('storyCard').classList.remove('active');

                const loc = globalLocations[index];
                const targetPos = Cesium.Cartesian3.fromDegrees(loc.lon, loc.lat, 0);
                
                viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(targetPos, 0), {
                    offset: new Cesium.HeadingPitchRange(Cesium.Math.toRadians(0), Cesium.Math.toRadians(loc.pitch), loc.range),
                    duration: 2.8,
                    complete: () => {
                        document.getElementById('storyTag').innerText = loc.tag;
                        document.getElementById('storyTitle').innerText = loc.name;
                        document.getElementById('storyDesc').innerText = loc.desc;
                        document.getElementById('storyCard').classList.add('active');
                    }
                });
            };

            window.returnToOrbit = function() {
                document.getElementById('storyCard').classList.remove('active');
                document.getElementById('statusText').innerText = "太空中：軌道運轉中";

                viewer.camera.flyTo({
                    destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, orbitAltitude),
                    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
                    duration: 2.5,
                    complete: () => {
                        lastTime = Date.now();
                        isOrbiting = true;
                    }
                });
            };
        });
    </script>
</body>
</html>
