<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraLens 3D | 台灣地標沉浸式 3D 導覽系統</title>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 現代化 Glassmorphism UI 控制面板 */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 380px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* 自定義捲軸 */
        .hud-panel::-webkit-scrollbar {
            width: 6px;
        }
        .hud-panel::-webkit-scrollbar-thumb {
            background: rgba(56, 239, 125, 0.3);
            border-radius: 3px;
        }

        .hud-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #38ef7d, #11998e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 16px;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #38ef7d;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 導覽按鈕群組 */
        .tour-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-tour {
            width: 100%;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(56, 239, 125, 0.15), rgba(17, 153, 142, 0.15));
            border: 1px solid rgba(56, 239, 125, 0.35);
            border-radius: 8px;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
        }

        .btn-tour:hover {
            background: linear-gradient(135deg, rgba(56, 239, 125, 0.35), rgba(17, 153, 142, 0.35));
            border-color: #38ef7d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 239, 125, 0.3);
        }

        .btn-tour small {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .btn-reset {
            margin-top: 4px;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }
        .btn-reset:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        /* 故事介紹卡片 (Cinematic Story Card) */
        .story-card {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            width: 400px;
            padding: 24px;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 239, 125, 0.3);
            border-radius: 16px;
            color: #f8fafc;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .story-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .story-tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            padding: 4px 8px;
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .story-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .story-coords {
            font-size: 0.75rem;
            color: #38ef7d;
            font-family: monospace;
            margin-bottom: 10px;
        }

        .story-desc {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <!-- UI 控制面板 -->
    <div class="hud-panel">
        <div class="hud-title">TERRALENS 3D</div>
        <div class="hud-subtitle">次世代 3D 地球與台灣地標實景導覽</div>

        <div class="section-label">台灣標竿地標特輯 (Taiwan Landmarks)</div>
        <div class="tour-controls" id="tourButtons">
            <!-- 動態生成按鈕 -->
        </div>

        <button class="btn-tour btn-reset" onclick="resetView()">
            <span>返回地球全景視角</span>
            <small>Global View</small>
        </button>
    </div>

    <!-- 故事卡片 UI -->
    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">DESTINATION</div>
        <div id="storyTitle" class="story-title">地標標題</div>
        <div id="storyCoords" class="story-coords">經緯度與高度</div>
        <div id="storyDesc" class="story-desc">地標詳細介紹內容...</div>
    </div>

    <!-- CesiumJS Library CDN -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        // 初始化 Cesium 基礎設定
        Cesium.Ion.defaultAccessToken = ''; 

        const viewer = new Cesium.Viewer('cesiumContainer', {
            animation: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            navigationHelpButton: false,
            scene3DOnly: true
        });

        const scene = viewer.scene;

        // 設定大氣與光影
        scene.globe.enableLighting = true;
        scene.globe.showGroundAtmosphere = true;
        scene.skyAtmosphere.show = true;
        scene.highDynamicRange = true;

        // 非同步安全載入地形與 3D 建築
        async function initEnvironment() {
            try {
                viewer.terrainProvider = await Cesium.createWorldTerrainAsync({
                    requestWaterMask: true,
                    requestVertexNormals: true
                });
                const buildingTileset = await Cesium.createOsmBuildingsAsync();
                scene.primitives.add(buildingTileset);
            } catch (error) {
                console.warn("載入提示:", error);
            }
        }
        initEnvironment();

        // 台灣精準地標資料庫 (含高精度經緯度與太空俯瞰高度)
        const tourScript = [
            {
                id: 0,
                name: "台北 101 (Taipei 101)",
                tag: "TAIPEI / URBAN ARCHITECTURE",
                coordsText: "25.0339° N, 121.5645° E | 觀看高度: 800m",
                desc: "曾為世界第一高樓，融合傳統竹節與如意造型的經典摩天大樓。在 3D Tiles 城市網格中能清晰呈現其現代化的信義計畫區天際線。",
                destination: Cesium.Cartesian3.fromDegrees(121.5645, 25.0339, 800),
                orientation: { heading: Cesium.Math.toRadians(20.0), pitch: Cesium.Math.toRadians(-25.0), roll: 0.0 }
            },
            {
                id: 1,
                name: "玉山主峰 (Mt. Jade)",
                tag: "NANTOU/CHIAYI / MOUNTAIN",
                coordsText: "23.4700° N, 120.9573° E | 觀看高度: 4,800m",
                desc: "東亞第一高峰，海拔 3,952 公尺。台灣五岳之首，四周群峰環繞，透過高解析度高程地形展現出極具震撼力的冰河遺跡與雄偉岩壁。",
                destination: Cesium.Cartesian3.fromDegrees(120.9573, 23.4700, 4800),
                orientation: { heading: Cesium.Math.toRadians(30.0), pitch: Cesium.Math.toRadians(-20.0), roll: 0.0 }
            },
            {
                id: 2,
                name: "日月潭涵碧半島 (Sun Moon Lake)",
                tag: "NANTOU / NATURE & WATER",
                coordsText: "23.8504° N, 120.9127° E | 觀看高度: 2,500m",
                desc: "台灣最大的天然湖泊，以日潭與月潭的獨特雙湖貌著稱。水面與周邊山巒交織，在 3D 渲染下呈現出絕佳的水波與山脈折射感。",
                destination: Cesium.Cartesian3.fromDegrees(120.9127, 23.8504, 2500),
                orientation: { heading: Cesium.Math.toRadians(0.0), pitch: Cesium.Math.toRadians(-35.0), roll: 0.0 }
            },
            {
                id: 3,
                name: "太魯閣峽谷 (Taroko Gorge)",
                tag: "HUALIEN / WORLD HERITAGE",
                coordsText: "24.1740° N, 121.6230° E | 觀看高度: 3,500m",
                desc: "世界級的大理石峽谷奇景，立霧溪百萬年向下切穿厚實的大理石層，形成險峻壯麗的絕壁深谷與鬼斧神工的自然地質。",
                destination: Cesium.Cartesian3.fromDegrees(121.6230, 24.1740, 3500),
                orientation: { heading: Cesium.Math.toRadians(270.0), pitch: Cesium.Math.toRadians(-25.0), roll: 0.0 }
            },
            {
                id: 4,
                name: "阿里山森林遊樂區 (Alishan)",
                tag: "CHIAYI / ALPINE FOREST",
                coordsText: "23.5118° N, 120.8068° E | 觀看高度: 3,000m",
                desc: "聞名國際的高山森林遊樂區，以日出、雲海、晚霞、森林與高山鐵路「五奇」聞名，孕育著豐富的紅檜神木群生態。",
                destination: Cesium.Cartesian3.fromDegrees(120.8068, 23.5118, 3000),
                orientation: { heading: Cesium.Math.toRadians(120.0), pitch: Cesium.Math.toRadians(-30.0), roll: 0.0 }
            }
        ];

        // 動態生成左側導覽選單按鈕
        const tourButtonsContainer = document.getElementById('tourButtons');
        tourScript.forEach((item, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-tour';
            btn.innerHTML = `<span>0${index + 1}. ${item.name.split(' ')[0]}</span><small>${item.name.split('(')[1] || ''}</small>`;
            btn.onclick = () => flyToLocation(index);
            tourButtonsContainer.appendChild(btn);
        });

        // UI DOM 元素
        const storyCard = document.getElementById('storyCard');
        const storyTag = document.getElementById('storyTag');
        const storyTitle = document.getElementById('storyTitle');
        const storyCoords = document.getElementById('storyCoords');
        const storyDesc = document.getElementById('storyDesc');

        function showStoryCard(data) {
            storyTag.innerText = data.tag;
            storyTitle.innerText = data.name;
            storyCoords.innerText = data.coordsText;
            storyDesc.innerText = data.desc;
            storyCard.classList.add('active');
        }

        function hideStoryCard() {
            storyCard.classList.remove('active');
        }

        // 飛行導覽控制函式
        function flyToLocation(index) {
            const target = tourScript[index];
            if (!target) return;

            hideStoryCard();

            viewer.camera.flyTo({
                destination: target.destination,
                orientation: target.orientation,
                duration: 4.5,
                easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT,
                complete: () => {
                    showStoryCard(target);
                }
            });
        }

        // 返回全景視角
        function resetView() {
            hideStoryCard();
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, 12000000),
                duration: 3.0,
                easingFunction: Cesium.EasingFunction.QUINTIC_OUT
            });
        }
    </script>
</body>
</html>
