<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js + NASA 紋理 3D 地球系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; }
        
        .hud-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            padding: 15px 20px; background: rgba(10, 15, 30, 0.85);
            border: 1px solid #00f2fe; border-radius: 10px; color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }
        .hud-title { font-size: 1.1rem; font-weight: bold; color: #00f2fe; margin-bottom: 5px; }
        .hud-sub { font-size: 0.8rem; color: #a0aec0; }
    </style>
</head>
<body>

    <div class="hud-overlay">
        <div class="hud-title">🌍 Three.js + NASA 高畫質地球</div>
        <div class="hud-sub">均勻光照設定｜無黑夜盲區｜100% 離線穩定</div>
    </div>

    <div id="canvas-container"></div>

    <!-- 載入 Three.js 與 控制器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');

            // 1. 建立場景與相機
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 25);

            // 2. 建立渲染器
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 3. 建立 OrbitControls 滑鼠控制（旋轉/縮放）
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 4. 關鍵光照設定：使用全方位環境光，確保地球完全明亮、絕不變黑夜
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            // 5. 建立地球球體與 NASA 貼圖
            const geometry = new THREE.SphereGeometry(5, 64, 64);
            
            // 使用 NASA / Wikimedia 公開的高解析度藍色大理石全球貼圖
            const textureLoader = new THREE.TextureLoader();
            const nasaTextureUrl = 'https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg';

            const texture = textureLoader.load(nasaTextureUrl, () => {
                console.log("NASA 地球貼圖載入成功！");
            });

            const material = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.6
            });

            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // 預設將臺灣/東亞調整至正面視角
            earth.rotation.y = -Math.PI / 1.8;

            // 6. 動態渲染循環與自轉效果
            function animate() {
                requestAnimationFrame(animate);
                
                // 緩慢自轉
                earth.rotation.y += 0.0008;

                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            // 7. 視窗大小自適應
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
