<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSHIP COMMAND // GLOBAL SCANNER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        /* 1. 科幻自訂滑鼠準心 */
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background-color: #01040a; font-family: 'Courier New', Courier, monospace, sans-serif; 
            color: #00f2fe; cursor: crosshair;
        }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 2. 背景掃描線與科幻網格 */
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 242, 254, 0.04) 50%);
            background-size: 100% 4px;
        }

        /* 3. 星艦舷窗四角邊框模組 */
        .hud-corner {
            position: absolute; z-index: 5; pointer-events: none;
            border: 2px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .c-tl { top: 20px; left: 20px; width: 35px; height: 35px; border-right: none; border-bottom: none; }
        .c-tr { top: 20px; right: 20px; width: 35px; height: 35px; border-left: none; border-bottom: none; }
        .c-bl { bottom: 20px; left: 20px; width: 35px; height: 35px; border-right: none; border-top: none; }
        .c-br { bottom: 20px; right: 20px; width: 35px; height: 35px; border-left: none; border-top: none; }

        /* 通用科幻模組視窗基底 (Glassmorphism) */
        .module-window {
            position: absolute; z-index: 10;
            background: rgba(4, 12, 24, 0.82); backdrop-filter: blur(8px);
            border: 1px solid #00f2fe;
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.15), 0 10px 30px rgba(0,0,0,0.8);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
        .module-header {
            padding: 8px 12px; background: rgba(0, 242, 254, 0.12);
            border-bottom: 1px solid rgba(0, 242, 254, 0.4);
            font-size: 0.75rem; font-weight: 900; letter-spacing: 1.5px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 模組 A：左側戰術目標選單 */
        .mod-nav { top: 40px; left: 40px; width: 290px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
        .tour-list { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 50vh; }
        .tour-list::-webkit-scrollbar { width: 3px; }
        .tour-list::-webkit-scrollbar-thumb { background: #00f2fe; }
        
        .cat-title { font-size: 0.65rem; color: #ffe600; font-weight: bold; margin-top: 8px; border-left: 2px solid #ffe600; padding-left: 5px; }
        .btn-target {
            width: 100%; padding: 8px; background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.25); color: #00f2fe;
            font-family: inherit; font-size: 0.78rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; display: flex; justify-content: space-between;
        }
        .btn-target:hover { background: rgba(0, 242, 254, 0.25); border-color: #00f2fe; box-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }

        /* 模組 B：右上角戰術掃描數據儀表 */
        .mod-scanner { top: 40px; right: 40px; width: 260px; padding: 12px; font-size: 0.75rem; }
        .scan-row { display: flex; justify-content: space-between; margin-bottom: 6px; border-bottom: 1px dashed rgba(0,242,254,0.2); padding-bottom: 4px; }
        .scan-val { color: #ffe600; font-weight: bold; }

        /* 模組 C：地貌高畫質彈窗 Modal (Google Maps 結合) */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
            background: rgba(1, 4, 10, 0.88); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .mod-deep-scan {
            width: 80vw; height: 75vh; position: relative;
            clip-path: polygon(0 0, calc(100% - 25px) 0, 100% 25px, 100% 100%, 25px 100%, 0 calc(100% - 25px));
        }
        .btn-close {
            background: #ff0055; color: #fff; border: none; padding: 4px 12px;
            font-weight: bold; cursor: pointer; font-family: inherit; box-shadow: 0 0 8px #ff0055;
        }
        .btn-close:hover { background: #ff3300; }
        .modal-iframe { width: 100%; height: calc(100% - 35px); border: none; }

        /* 點擊能量水波紋特效 */
        .click-pulse {
            position: absolute; width: 20px; height: 20px; border: 2px solid #00f2fe;
            border-radius: 50%; pointer-events: none; z-index: 99;
            animation: pulse-anim 0.6s ease-out forwards;
        }
        @keyframes pulse-anim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <!-- 星艦舷窗邊框 -->
    <div class="hud-corner c-tl"></div>
    <div class="hud-corner c-tr"></div>
    <div class="hud-corner c-bl"></div>
    <div class="hud-corner c-br"></div>

    <div id="canvas-container"></div>

    <!-- 模组 A：導航主控台 -->
    <div class="module-window mod-nav">
        <div class="module-header">
            <span>[NAV-TARGETS]</span>
            <small style="color:#00f2fe;">SYS: ONLINE</small>
        </div>
        <div class="tour-list" id="tourList"></div>
        <div style="padding: 10px;">
            <button class="btn-target" style="border-color:#ff0055; color:#ff0055;" onclick="returnToOrbit()">
                <span>🚀 重置星艦視角</span>
                <small>RESET</small>
            </button>
        </div>
    </div>

    <!-- 模組 B：即時戰術掃描數據面板 -->
    <div class="module-window mod-scanner">
        <div class="module-header" style="margin-bottom: 8px;">
            <span>[SCANNER STATUS]</span>
            <span style="color:#ffe600;">ACTIVE</span>
        </div>
        <div class="scan-row"><span>ORBIT ALT:</span><span class="scan-val">35,000 KM</span></div>
        <div class="scan-row"><span>TARGET LAT:</span><span class="scan-val" id="valLat">23.50 N</span></div>
        <div class="scan-row"><span>TARGET LON:</span><span class="scan-val" id="valLon">121.00 E</span></div>
        <div class="scan-row"><span>SENSOR MODE:</span><span class="scan-val">THERMAL/OPTICAL</span></div>
    </div>

    <!-- 模組 C：高清地貌深度掃描視窗 (Google Maps 衛星) -->
    <div class="modal-overlay" id="mapModal">
        <div class="module-window mod-deep-scan">
            <div class="module-header">
                <span id="modalTitle">[DEEP SCAN: LOCKING...]</span>
                <button class="btn-close" onclick="closeMapModal()">ABORT SCAN [X]</button>
            </div>
            <iframe class="modal-iframe" id="mapIframe" src=""></iframe>
        </div>
    </div>

    <!-- 載入 Three.js、控制元件與 TWEEN 動畫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');
            const EARTH_RADIUS = 5;

            // 1. 3D 場景 setup
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 22);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 2. 光照系統 (全亮絕不黑夜)
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);

            // 3. 地球與 NASA 紋理
            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const textureLoader = new THREE.TextureLoader();
            const nasaTextureUrl = 'https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg';
            const texture = textureLoader.load(nasaTextureUrl);

            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // 經緯度轉 3D Vector 公式
            function latLonToVector3(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const z = (radius * Math.sin(phi) * Math.sin(theta));
                const y = (radius * Math.cos(phi));
                return new THREE.Vector3(x, y, z);
            }

            // 4. 地標資料庫
            const tourData = [
                {
                    category: "TARGET: TAIWAN",
                    items: [
                        { name: "台北 101", sub: "TAIPEI 101", lat: 25.0330, lon: 121.5645 },
                        { name: "玉山主峰", sub: "YUSHAN PEAK", lat: 23.4700, lon: 120.9573 },
                        { name: "高雄港", sub: "KAOHSIUNG", lat: 22.6180, lon: 120.2930 },
                        { name: "日月潭", sub: "SUN MOON LAKE", lat: 23.8517, lon: 120.9159 }
                    ]
                },
                {
                    category: "TARGET: ASIA",
                    items: [
                        { name: "東京鐵塔", sub: "TOKYO TOWER", lat: 35.6586, lon: 139.7454 },
                        { name: "富士山", sub: "MOUNT FUJI", lat: 35.3606, lon: 138.7274 },
                        { name: "首爾 N首爾塔", sub: "SEOUL TOWER", lat: 37.5512, lon: 126.9882 }
                    ]
                },
                {
                    category: "TARGET: GLOBAL",
                    items: [
                        { name: "杜拜 哈里發塔", sub: "BURJ KHALIFA", lat: 25.1972, lon: 55.2744 },
                        { name: "巴黎 艾菲爾鐵塔", sub: "EIFFEL TOWER", lat: 48.8584, lon: 2.2945 }
                    ]
                }
            ];

            const tourListContainer = document.getElementById('tourList');
            let globalLocations = [];
            let locIndex = 0;

            tourData.forEach(group => {
                const catHeader = document.createElement('div');
                catHeader.className = 'cat-title';
                catHeader.innerText = group.category;
                tourListContainer.appendChild(catHeader);

                group.items.forEach(item => {
                    const pos = latLonToVector3(item.lat, item.lon, EARTH_RADIUS + 0.03);
                    const markerGeo = new THREE.SphereGeometry(0.08, 16, 16);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    marker.position.copy(pos);
                    earth.add(marker);

                    const btn = document.createElement('button');
                    btn.className = 'btn-target';
                    const idx = locIndex;
                    btn.onclick = () => flyAndOpenMap(idx);
                    btn.innerHTML = `<span>${item.name}</span><small style="color:#ffe600">${item.sub}</small>`;
                    tourListContainer.appendChild(btn);

                    globalLocations.push({ ...item, targetPos: pos });
                    locIndex++;
                });
            });

            let isOrbiting = true;

            // 5. 飛航與開啟深度掃描視窗
            window.flyAndOpenMap = function(index) {
                isOrbiting = false;
                const loc = globalLocations[index];
                const targetCameraPos = loc.targetPos.clone().multiplyScalar(1.8);

                // 更新即時儀表板數據
                document.getElementById('valLat').innerText = loc.lat.toFixed(2) + " N";
                document.getElementById('valLon').innerText = loc.lon.toFixed(2) + " E";

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCameraPos.x, y: targetCameraPos.y, z: targetCameraPos.z }, 1800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .onComplete(() => {
                        const googleMapUrl = `https://maps.google.com/maps?q=${loc.lat},${loc.lon}&t=k&z=15&ie=UTF8&iwloc=&output=embed`;
                        document.getElementById('modalTitle').innerText = `[DEEP SCAN: ${loc.name} // LAT:${loc.lat.toFixed(2)} LON:${loc.lon.toFixed(2)}]`;
                        document.getElementById('mapIframe').src = googleMapUrl;
                        document.getElementById('mapModal').classList.add('active');
                    })
                    .start();
            };

            window.closeMapModal = function() {
                document.getElementById('mapModal').classList.remove('active');
                document.getElementById('mapIframe').src = "";
            };

            window.returnToOrbit = function() {
                closeMapModal();
                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 0, z: 22 }, 1800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .onComplete(() => { isOrbiting = true; })
                    .start();
            };

            // 6. 全螢幕點擊能量水波紋效果
            window.addEventListener('click', (e) => {
                const pulse = document.createElement('div');
                pulse.className = 'click-pulse';
                pulse.style.left = `${e.clientX - 10}px`;
                pulse.style.top = `${e.clientY - 10}px`;
                document.body.appendChild(pulse);
                setTimeout(() => pulse.remove(), 600);
            });

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();
                if (isOrbiting) earth.rotation.y += 0.0008;
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
