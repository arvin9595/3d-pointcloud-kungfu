<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球與天文實景導覽系統</title>
    <!-- 使用 cdnjs 穩定鏡像 CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.115.0/Widgets/widgets.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        .hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10; width: 320px;
            max-height: calc(100vh - 40px); padding: 18px; background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px); border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px; color: #fff; display: flex; flex-direction: column;
        }
        .hud-title { font-size: 1.15rem; font-weight: 700; color: #00f2fe; margin-bottom: 4px; }
        .hud-status { font-size: 0.75rem; color: #00f2fe; margin-bottom: 12px; }
        .tour-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 50vh; }
        .category-title { font-size: 0.75rem; color: #94a3b8; margin-top: 10px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn-tour { width: 100%; padding: 8px 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 6px; color: #fff; font-size: 0.82rem; cursor: pointer; display: flex; justify-content: space-between; }
        .btn-tour:hover { background: rgba(0, 242, 254, 0.2); border-color: #00f2fe; }
        .btn-orbit { margin-top: 12px; padding: 10px; background: rgba(0, 242, 254, 0.25); border-color: #00f2fe; }
        
        .telemetry-panel {
            position: absolute; top: 20px; right: 20px; z-index: 10; width: 280px; padding: 16px;
            background: rgba(10, 15, 30, 0.88); backdrop-filter: blur(16px); border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px; color: #e2e8f0; font-size: 0.8rem;
        }
        .telemetry-title { font-size: 0.95rem; font-weight: 700; color: #00f2fe; margin-bottom: 10px; border-bottom: 1px solid rgba(0, 242, 254, 0.3); }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .data-value { color: #38bdf8; font-family: monospace; font-weight: 600; }

        .story-card {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(20px);
            z-index: 10; width: 420px; max-width: 90vw; padding: 16px 20px; background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 254, 0.35); border-radius: 14px; color: #f8fafc;
            opacity: 0; transition: all 0.4s ease; pointer-events: none;
        }
        .story-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .story-tag { font-size: 0.7rem; padding: 2px 6px; background: rgba(0, 242, 254, 0.2); color: #00f2fe; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .story-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
        .story-desc { font-size: 0.82rem; line-height: 1.4; color: #cbd5e1; }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <div class="hud-panel">
        <div class="hud-title">EARTH EXPLORER</div>
        <div class="hud-status">● <span id="statusText">太空中：軌道運轉中</span></div>
        <div class="tour-list" id="tourList"></div>
        <button class="btn-tour btn-orbit" onclick="returnToOrbit()">🚀 返回太空軌道俯瞰</button>
    </div>

    <div class="telemetry-panel">
        <div class="telemetry-title">🌐 地球與即時數據 (Data)</div>
        <div class="data-row"><span>視角高度:</span><span class="data-value" id="valAltitude">15,000 km</span></div>
        <div class="data-row"><span>中心緯度:</span><span class="data-value" id="valLat">23.500° N</span></div>
        <div class="data-row"><span>中心經度:</span><span class="data-value" id="valLon">121.000° E</span></div>
        <div class="telemetry-title" style="margin-top: 12px;">🪐 天文常數</div>
        <div class="data-row"><span>自轉週期:</span><span class="data-value">23小時 56分 4秒</span></div>
        <div class="data-row"><span>赤道自轉線速度:</span><span class="data-value">1,670 km/h</span></div>
        <div class="data-row"><span>公轉平均速度:</span><span class="data-value">29.78 km/s</span></div>
    </div>

    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">LOCATION</div>
        <div id="storyTitle" class="story-title">景點名稱</div>
        <div id="storyDesc" class="story-desc">景點詳細說明...</div>
    </div>

    <!-- cdnjs 穩定庫源 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.115.0/Cesium.js"></script>
    <script>
        // 確保 DOM 與 Cesium 載入完畢後執行
        window.addEventListener('load', () => {
            try {
                const viewer = new Cesium.Viewer('cesiumContainer', {
                    imageryProvider: new Cesium.UrlTemplateImageryProvider({
                        url: 'https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
                        subdomains: ['a', 'b', 'c', 'd'],
                        maximumLevel: 19
                    }),
                    animation: false,
                    baseLayerPicker: false,
                    fullscreenButton: false,
                    geocoder: false,
                    homeButton: false,
                    infoBox: false,
                    sceneModePicker: false,
                    selectionIndicator: false,
                    timeline: false,
                    navigationHelpButton: false,
                    scene3DOnly: true
                });

                const scene = viewer.scene;
                scene.globe.enableLighting = true;

                let isOrbiting = true;
                const orbitAltitude = 15000000;
                let lastTime = Date.now();

                viewer.clock.onTick.addEventListener(() => {
                    if (isOrbiting) {
                        const now = Date.now();
                        const delta = (now - lastTime) / 1000;
                        lastTime = now;
                        scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.04 * delta);
                    }

                    const cameraPosition = viewer.camera.positionCartographic;
                    if (cameraPosition) {
                        const alt = (cameraPosition.height / 1000).toFixed(0);
                        const lat = (Cesium.Math.toDegrees(cameraPosition.latitude)).toFixed(3);
                        const lon = (Cesium.Math.toDegrees(cameraPosition.longitude)).toFixed(3);

                        document.getElementById('valAltitude').innerText = Number(alt).toLocaleString() + " km";
                        document.getElementById('valLat').innerText = Math.abs(lat) + "° " + (lat >= 0 ? 'N' : 'S');
                        document.getElementById('valLon').innerText = Math.abs(lon) + "° " + (lon >= 0 ? 'E' : 'W');
                    }
                });

                const tourData = [
                    {
                        category: "臺灣經典名勝",
                        items: [
                            { name: "台北 101", sub: "Taipei 101", tag: "TAIPEI / URBAN", desc: "臺灣第一高樓，高度 508 公尺。", lon: 121.5645, lat: 25.0330, range: 8000, pitch: -45 },
                            { name: "玉山主峰", sub: "Yushan Peak", tag: "TAIWAN / MOUNTAIN", desc: "東北亞第一高峰。", lon: 120.9573, lat: 23.4700, range: 35000, pitch: -50 }
                        ]
                    }
                ];

                const tourListContainer = document.getElementById('tourList');
                let globalLocations = [];
                let locIndex = 0;

                tourData.forEach(group => {
                    const catHeader = document.createElement('div');
                    catHeader.className = 'category-title';
                    catHeader.innerText = group.category;
                    tourListContainer.appendChild(catHeader);

                    group.items.forEach(item => {
                        viewer.entities.add({
                            name: item.name,
                            position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat, 100),
                            point: { pixelSize: 10, color: Cesium.Color.fromCssColorString('#00f2fe'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
                            label: { text: item.name, font: '14px sans-serif', style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2, verticalOrigin: Cesium.VerticalOrigin.BOTTOM, pixelOffset: new Cesium.Cartesian2(0, -12), fillColor: Cesium.Color.WHITE }
                        });

                        const btn = document.createElement('button');
                        btn.className = 'btn-tour';
                        const currentIndex = locIndex;
                        btn.onclick = () => flyToLocation(currentIndex);
                        btn.innerHTML = `<span>${item.name}</span><small style="color:#00f2fe">${item.sub}</small>`;
                        tourListContainer.appendChild(btn);

                        globalLocations.push(item);
                        locIndex++;
                    });
                });

                window.flyToLocation = function(index) {
                    isOrbiting = false;
                    document.getElementById('statusText').innerText = "地面模式：景點對焦中";
                    document.getElementById('storyCard').classList.remove('active');

                    const loc = globalLocations[index];
                    const targetPos = Cesium.Cartesian3.fromDegrees(loc.lon, loc.lat, 0);
                    
                    viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(targetPos, 0), {
                        offset: new Cesium.HeadingPitchRange(Cesium.Math.toRadians(0), Cesium.Math.toRadians(loc.pitch), loc.range),
                        duration: 3.0,
                        complete: () => {
                            document.getElementById('storyTag').innerText = loc.tag;
                            document.getElementById('storyTitle').innerText = loc.name;
                            document.getElementById('storyDesc').innerText = loc.desc;
                            document.getElementById('storyCard').classList.add('active');
                        }
                    });
                };

                window.returnToOrbit = function() {
                    document.getElementById('storyCard').classList.remove('active');
                    document.getElementById('statusText').innerText = "太空中：軌道運轉中";

                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, orbitAltitude),
                        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 },
                        duration: 2.5,
                        complete: () => {
                            lastTime = Date.now();
                            isOrbiting = true;
                        }
                    });
                };

            } catch (err) {
                console.error("Cesium 初始化失敗：", err);
                alert("3D 渲染引擎啟動失敗，請檢查 Console 報錯資訊。");
            }
        });
    </script>
</body>
</html>
