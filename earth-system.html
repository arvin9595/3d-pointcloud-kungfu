<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球與實景導覽系統 (Next-Gen Earth 3D)</title>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 導覽主控制面板 */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 340px;
            max-height: calc(100vh - 40px);
            padding: 20px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }

        .hud-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-status {
            font-size: 0.75rem;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
        }

        /* 選單分類與按鈕容器（支援滾動） */
        .tour-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .tour-list::-webkit-scrollbar {
            width: 4px;
        }
        .tour-list::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.4);
            border-radius: 4px;
        }

        .category-title {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 8px;
            margin-bottom: 2px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-tour {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-tour:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            transform: translateX(4px);
        }

        .btn-orbit {
            margin-top: 10px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            border-color: #00f2fe;
            flex-shrink: 0;
        }

        /* 地標資訊卡片 */
        .story-card {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            width: 360px;
            padding: 20px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            color: #f8fafc;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .story-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .story-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .story-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .story-desc {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <!-- 主選單面板 -->
    <div class="hud-panel">
        <div class="hud-title">SATELLITE & GROUND TOUR</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span id="statusText">太空中：衛星軌道運轉中</span>
        </div>

        <div class="tour-list" id="tourList">
            <!-- 動態生成地標列表 -->
        </div>

        <button class="btn-tour btn-orbit" onclick="returnToOrbit()">
            <span>🚀 返回太空軌道運行</span>
            <small>Orbit View</small>
        </button>
    </div>

    <!-- 介紹卡片 -->
    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">LOCATION</div>
        <div id="storyTitle" class="story-title">地標名稱</div>
        <div id="storyDesc" class="story-desc">地標詳細敘述...</div>
    </div>

    <!-- CesiumJS Library -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        // 🔑 1. 設定 Cesium Ion Access Token (使用您提供的金鑰)
        Cesium.Ion.defaultAccessToken = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IklhNEdrRkZmYzZaWTNZaVUiLCJqdGkiOiI2NmI4ZmY4NC01NjY0LTRlZDYtYTJiYS1jZjk0NmYzMWNjMzYiLCJpZCI6NTA2NDI4LCJpc3MiOiJodHRwczovL2FwaS5jZXNpdW0uY29tIiwiYXVkIjoidW5kZWZpbmVkX2RlZmF1bHQiLCJpYXQiOjE3OTAyMzg3MzR9.fnoc-A5kVV2LJFmyvvtLvt_UkAeporC6Q6azntIZqgw';

        // 2. 初始化 Cesium 視圖 (加載 Bing / Cesium 衛星地圖與地形)
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain({ requestWaterMask: true }),
            animation: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            navigationHelpButton: false,
            scene3DOnly: true
        });

        const scene = viewer.scene;
        scene.globe.enableLighting = true; // 開啟光照
        scene.highDynamicRange = true;     // HDR 畫面

        // 3. 自動載入 3D 建築 (OSM 3D Buildings)
        async function load3DBuildings() {
            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                scene.primitives.add(buildings);
            } catch (e) {
                console.log("3D 建築載入提示: ", e);
            }
        }
        load3DBuildings();

        // 4. 太空軌道運轉邏輯
        let isOrbiting = true;
        const orbitAltitude = 15000000; // 太空高度 (米)
        let lastTime = Date.now();

        viewer.clock.onTick.addEventListener(() => {
            if (isOrbiting) {
                const now = Date.now();
                const delta = (now - lastTime) / 1000;
                lastTime = now;
                scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.05 * delta);
            }
        });

        // 5. 擴充版地標資料庫 (台灣 + 全球熱門景點)
        const tourData = [
            {
                category: "臺灣經典地標",
                items: [
                    {
                        name: "台北 101",
                        sub: "Taipei 101",
                        tag: "TAIPEI / URBAN 3D",
                        desc: "臺灣第一高樓，高度 508 公尺。搭配 3D 建築模型，可精細俯瞰信義區整體現代都市景觀。",
                        destination: Cesium.Cartesian3.fromDegrees(121.5645, 25.0330, 700),
                        orientation: { heading: Cesium.Math.toRadians(330), pitch: Cesium.Math.toRadians(-25), roll: 0 }
                    },
                    {
                        name: "玉山主峰",
                        sub: "3,952 m",
                        tag: "TAIWAN / MOUNTAIN",
                        desc: "東北亞第一高峰。高精度地形數據精準呈現陡峭的脊樑山脈與磅礡的百岳地貌。",
                        destination: Cesium.Cartesian3.fromDegrees(120.9573, 23.4700, 4800),
                        orientation: { heading: Cesium.Math.toRadians(25), pitch: Cesium.Math.toRadians(-20), roll: 0 }
                    },
                    {
                        name: "高雄流行音樂中心",
                        sub: "Kaohsiung Harbor",
                        tag: "KAOHSIUNG / HARBOR",
                        desc: "座落於高雄港 11-15 號碼頭，具備獨特的海浪與蜂巢建築外觀，展現港灣城市的沉浸視野。",
                        destination: Cesium.Cartesian3.fromDegrees(120.2930, 22.6180, 600),
                        orientation: { heading: Cesium.Math.toRadians(45), pitch: Cesium.Math.toRadians(-30), roll: 0 }
                    },
                    {
                        name: "日月潭",
                        sub: "Sun Moon Lake",
                        tag: "NANTOU / LAKE",
                        desc: "台灣最大的半天然湖泊，四周群山環抱，提供絕佳的高空水岸視野與湖光山色。",
                        destination: Cesium.Cartesian3.fromDegrees(120.9159, 23.8517, 2200),
                        orientation: { heading: Cesium.Math.toRadians(180), pitch: Cesium.Math.toRadians(-35), roll: 0 }
                    }
                ]
            },
            {
                category: "全球國際名勝",
                items: [
                    {
                        name: "日本 東京塔",
                        sub: "Tokyo Tower",
                        tag: "JAPAN / TOKYO",
                        desc: "位於東京都港區的紅白色地標塔，周邊結合豐富的 3D 建築網格，展現繁華的東京都市圈。",
                        destination: Cesium.Cartesian3.fromDegrees(139.7454, 35.6586, 650),
                        orientation: { heading: Cesium.Math.toRadians(140), pitch: Cesium.Math.toRadians(-25), roll: 0 }
                    },
                    {
                        name: "法國 艾菲爾鐵塔",
                        sub: "Eiffel Tower",
                        tag: "FRANCE / PARIS",
                        desc: "巴黎最具代表性的標誌性建築，可俯瞰塞納河畔與巴黎平原的典雅城市規劃。",
                        destination: Cesium.Cartesian3.fromDegrees(2.2945, 48.8584, 550),
                        orientation: { heading: Cesium.Math.toRadians(50), pitch: Cesium.Math.toRadians(-20), roll: 0 }
                    },
                    {
                        name: "美國 大峽谷",
                        sub: "Grand Canyon",
                        tag: "USA / NATURE",
                        desc: "科羅拉多河數百萬年切割出的壯麗峽谷，展現出極致的地層層次與大氣霞光效果。",
                        destination: Cesium.Cartesian3.fromDegrees(-112.1129, 36.1069, 3200),
                        orientation: { heading: Cesium.Math.toRadians(290), pitch: Cesium.Math.toRadians(-18), roll: 0 }
                    },
                    {
                        name: "埃及 金字塔群",
                        sub: "Giza Pyramids",
                        tag: "EGYPT / HERITAGE",
                        desc: "位於開羅吉薩高原的古代世界七大奇蹟，呈現沙漠地形與千年前宏偉陵墓的歷史沉浸感。",
                        destination: Cesium.Cartesian3.fromDegrees(31.1342, 29.9792, 900),
                        orientation: { heading: Cesium.Math.toRadians(70), pitch: Cesium.Math.toRadians(-25), roll: 0 }
                    }
                ]
            }
        ];

        // 6. 動態渲染選單
        const tourListContainer = document.getElementById('tourList');
        let globalLocations = [];
        let locIndex = 0;

        tourData.forEach(group => {
            const catHeader = document.createElement('div');
            catHeader.className = 'category-title';
            catHeader.innerText = group.category;
            tourListContainer.appendChild(catHeader);

            group.items.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'btn-tour';
                const currentIndex = locIndex;
                btn.onclick = () => flyToLocation(currentIndex);
                btn.innerHTML = `<span>${item.name}</span><small>${item.sub}</small>`;
                tourListContainer.appendChild(btn);

                globalLocations.push(item);
                locIndex++;
            });
        });

        // 7. 飛行與運鏡邏輯
        function flyToLocation(index) {
            isOrbiting = false;
            document.getElementById('statusText').innerText = "地面模式：實景導覽中";
            hideCard();

            const loc = globalLocations[index];
            viewer.camera.flyTo({
                destination: loc.destination,
                orientation: loc.orientation,
                duration: 4.0,
                easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT,
                complete: () => {
                    showCard(loc);
                }
            });
        }

        function returnToOrbit() {
            hideCard();
            document.getElementById('statusText').innerText = "太空中：衛星軌道運轉中";

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, orbitAltitude),
                orientation: {
                    heading: 0,
                    pitch: Cesium.Math.toRadians(-90),
                    roll: 0
                },
                duration: 3.5,
                easingFunction: Cesium.EasingFunction.QUINTIC_OUT,
                complete: () => {
                    lastTime = Date.now();
                    isOrbiting = true;
                }
            });
        }

        // 8. 卡片顯示
        const card = document.getElementById('storyCard');
        function showCard(data) {
            document.getElementById('storyTag').innerText = data.tag;
            document.getElementById('storyTitle').innerText = data.name;
            document.getElementById('storyDesc').innerText = data.desc;
            card.classList.add('active');
        }
        function hideCard() {
            card.classList.remove('active');
        }

        returnToOrbit();
    </script>
</body>
</html>
