<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球與天文實景導覽系統 (Earth 3D Sci-System)</title>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 1. 左側控制與景點導覽面板 */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 320px;
            max-height: calc(100vh - 40px);
            padding: 18px;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .hud-title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-status {
            font-size: 0.75rem;
            color: #00f2fe;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
        }

        /* 景點滾動列表 */
        .tour-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            max-height: 50vh;
        }

        .tour-list::-webkit-scrollbar {
            width: 4px;
        }
        .tour-list::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.4);
            border-radius: 4px;
        }

        .category-title {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 10px;
            margin-bottom: 2px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 2px;
        }

        .btn-tour {
            width: 100%;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-tour:hover {
            background: rgba(0, 242, 254, 0.2);
            border-color: #00f2fe;
            transform: translateX(3px);
        }

        .btn-orbit {
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(79, 172, 254, 0.25));
            border-color: #00f2fe;
            flex-shrink: 0;
        }

        /* 2. 右側天文與科學監控數據面板 */
        .telemetry-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            width: 280px;
            padding: 16px;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            color: #e2e8f0;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            font-size: 0.8rem;
        }

        .telemetry-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #00f2fe;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.3);
            padding-bottom: 4px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .data-label {
            color: #94a3b8;
        }

        .data-value {
            color: #38bdf8;
            font-family: monospace;
            font-weight: 600;
        }

        /* 3. 底部景點詳細介紹卡片 */
        .story-card {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 10;
            width: 420px;
            max-width: 90vw;
            padding: 16px 20px;
            background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            color: #f8fafc;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .story-card.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .story-tag {
            font-size: 0.7rem;
            padding: 2px 6px;
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 6px;
        }

        .story-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .story-desc {
            font-size: 0.82rem;
            line-height: 1.4;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <!-- 左側導覽面板 -->
    <div class="hud-panel">
        <div class="hud-title">EARTH EXPLORER</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span id="statusText">太空中：軌道運轉中</span>
        </div>

        <div class="tour-list" id="tourList">
            <!-- 動態生成景點列表 -->
        </div>

        <button class="btn-tour btn-orbit" onclick="returnToOrbit()">
            <span>🚀 返回太空軌道俯瞰</span>
            <small>Orbit View</small>
        </button>
    </div>

    <!-- 右側科學與天文參數面板 -->
    <div class="telemetry-panel">
        <div class="telemetry-title">🌐 地球與即時數據 (Data)</div>
        
        <div class="data-row">
            <span class="data-label">視角高度 / 距離:</span>
            <span class="data-value" id="valAltitude">15,000 km</span>
        </div>
        <div class="data-row">
            <span class="data-label">中心緯度:</span>
            <span class="data-value" id="valLat">23.500° N</span>
        </div>
        <div class="data-row">
            <span class="data-label">中心經度:</span>
            <span class="data-value" id="valLon">121.000° E</span>
        </div>

        <div class="telemetry-title" style="margin-top: 12px;">🪐 天文常數 (Constants)</div>
        
        <div class="data-row">
            <span class="data-label">自轉週期 (赤道):</span>
            <span class="data-value">23小時 56分 4秒</span>
        </div>
        <div class="data-row">
            <span class="data-label">赤道自轉線速度:</span>
            <span class="data-value">1,670 km/h</span>
        </div>
        <div class="data-row">
            <span class="data-label">公轉平均速度:</span>
            <span class="data-value">29.78 km/s</span>
        </div>
        <div class="data-row">
            <span class="data-label">平均赤道半徑:</span>
            <span class="data-value">6,378.137 km</span>
        </div>
        <div class="data-row">
            <span class="data-label">大氣層卡門線:</span>
            <span class="data-value">100 km</span>
        </div>
    </div>

    <!-- 景點介紹卡片 -->
    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">LOCATION</div>
        <div id="storyTitle" class="story-title">景點名稱</div>
        <div id="storyDesc" class="story-desc">景點詳細說明...</div>
    </div>

    <!-- CesiumJS Library -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        // 1. 初始化 Cesium Viewer (採用穩定高解析衛星影像圖層)
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: new Cesium.ArcGisMapServerImageryProvider({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
            }),
            animation: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            navigationHelpButton: false,
            scene3DOnly: true
        });

        const scene = viewer.scene;
        scene.globe.enableLighting = true; // 開啟太陽光效果

        // 2. 自轉與即時數據更新
        let isOrbiting = true;
        const orbitAltitude = 15000000;
        let lastTime = Date.now();

        viewer.clock.onTick.addEventListener(() => {
            if (isOrbiting) {
                const now = Date.now();
                const delta = (now - lastTime) / 1000;
                lastTime = now;
                scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.04 * delta);
            }

            const cameraPosition = viewer.camera.positionCartographic;
            if (cameraPosition) {
                const alt = (cameraPosition.height / 1000).toFixed(0);
                const lat = (Cesium.Math.toDegrees(cameraPosition.latitude)).toFixed(3);
                const lon = (Cesium.Math.toDegrees(cameraPosition.longitude)).toFixed(3);

                document.getElementById('valAltitude').innerText = Number(alt).toLocaleString() + " km";
                document.getElementById('valLat').innerText = Math.abs(lat) + "° " + (lat >= 0 ? 'N' : 'S');
                document.getElementById('valLon').innerText = Math.abs(lon) + "° " + (lon >= 0 ? 'E' : 'W');
            }
        });

        // 3. 修正後的景點資料（包含經緯度、鏡頭距離 range、傾角 pitch）
        const tourData = [
            {
                category: "臺灣經典名勝",
                items: [
                    {
                        name: "台北 101",
                        sub: "Taipei 101",
                        tag: "TAIPEI / URBAN",
                        desc: "臺灣第一高樓，高度 508 公尺，俯瞰信義區整體現代都市景觀。",
                        lon: 121.5645, lat: 25.0330, range: 8000, pitch: -45
                    },
                    {
                        name: "玉山主峰",
                        sub: "Yushan Peak (3,952m)",
                        tag: "TAIWAN / MOUNTAIN",
                        desc: "東北亞第一高峰。高空還原雄偉的中央山脈主脊地貌。",
                        lon: 120.9573, lat: 23.4700, range: 35000, pitch: -50
                    },
                    {
                        name: "高雄流行音樂中心",
                        sub: "Kaohsiung Music Center",
                        tag: "KAOHSIUNG / HARBOR",
                        desc: "座落於高雄愛河灣與高雄港區，俯瞰南臺灣港灣新地標。",
                        lon: 120.2930, lat: 22.6180, range: 10000, pitch: -45
                    },
                    {
                        name: "日月潭",
                        sub: "Sun Moon Lake",
                        tag: "NANTOU / LAKE",
                        desc: "臺灣最大半天然湖泊，群山環抱，提供高空極佳的水岸地形視野。",
                        lon: 120.9159, lat: 23.8517, range: 25000, pitch: -50
                    },
                    {
                        name: "太魯閣國家公園",
                        sub: "Taroko Gorge",
                        tag: "HUALIEN / GORGE",
                        desc: "立霧溪切割出近乎垂直的大理岩峽谷，展現臺灣造山運動的壯麗地質風貌。",
                        lon: 121.5500, lat: 24.1600, range: 30000, pitch: -50
                    }
                ]
            },
            {
                category: "全球指標建築與地貌",
                items: [
                    {
                        name: "日本 東京塔",
                        sub: "Tokyo Tower",
                        tag: "JAPAN / TOKYO",
                        desc: "東京著名地標塔，展現繁華的東京都心風貌。",
                        lon: 139.7454, lat: 35.6586, range: 10000, pitch: -45
                    },
                    {
                        name: "法國 艾菲爾鐵塔",
                        sub: "Eiffel Tower",
                        tag: "FRANCE / PARIS",
                        desc: "巴黎最具代表性的標誌建築，俯瞰塞納河畔與古典巴黎城區規劃。",
                        lon: 2.2945, lat: 48.8584, range: 10000, pitch: -45
                    },
                    {
                        name: "美國 大峽谷",
                        sub: "Grand Canyon",
                        tag: "USA / NATURE",
                        desc: "科羅拉多河數百萬年切割出的深邃峽谷，展示地殼層次與壯麗的自然奇觀。",
                        lon: -112.1129, lat: 36.1069, range: 50000, pitch: -50
                    },
                    {
                        name: "埃及 吉薩金字塔",
                        sub: "Giza Pyramids",
                        tag: "EGYPT / HERITAGE",
                        desc: "開羅吉薩高原的千年古文明遺跡，展現沙漠地形與浩瀚古建築群。",
                        lon: 31.1342, lat: 29.9792, range: 15000, pitch: -45
                    }
                ]
            }
        ];

        // 4. 在地圖上記錄與在地表標記地標 Pin
        const tourListContainer = document.getElementById('tourList');
        let globalLocations = [];
        let locIndex = 0;

        tourData.forEach(group => {
            const catHeader = document.createElement('div');
            catHeader.className = 'category-title';
            catHeader.innerText = group.category;
            tourListContainer.appendChild(catHeader);

            group.items.forEach(item => {
                // 建立 3D 畫面的地標 Pin
                viewer.entities.add({
                    name: item.name,
                    position: Cesium.Cartesian3.fromDegrees(item.lon, item.lat, 100),
                    point: {
                        pixelSize: 10,
                        color: Cesium.Color.fromCssColorString('#00f2fe'),
                        outlineColor: Cesium.Color.WHITE,
                        outlineWidth: 2
                    },
                    label: {
                        text: item.name,
                        font: '14px sans-serif',
                        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                        outlineWidth: 2,
                        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                        pixelOffset: new Cesium.Cartesian2(0, -12),
                        fillColor: Cesium.Color.WHITE
                    }
                });

                // 生成左側選單按鈕
                const btn = document.createElement('button');
                btn.className = 'btn-tour';
                const currentIndex = locIndex;
                btn.onclick = () => flyToLocation(currentIndex);
                btn.innerHTML = `<span>${item.name}</span><small style="color:#00f2fe">${item.sub}</small>`;
                tourListContainer.appendChild(btn);

                globalLocations.push(item);
                locIndex++;
            });
        });

        // 5. 修正後的鏡頭飛行算法 (使用 BoundingSphere 精準對焦)
        function flyToLocation(index) {
            isOrbiting = false;
            document.getElementById('statusText').innerText = "地面模式：景點對焦中";
            hideCard();

            const loc = globalLocations[index];
            const targetPos = Cesium.Cartesian3.fromDegrees(loc.lon, loc.lat, 0);
            
            viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(targetPos, 0), {
                offset: new Cesium.HeadingPitchRange(
                    Cesium.Math.toRadians(0),
                    Cesium.Math.toRadians(loc.pitch),
                    loc.range
                ),
                duration: 3.0,
                complete: () => {
                    showCard(loc);
                }
            });
        }

        // 返回太空軌道
        function returnToOrbit() {
            hideCard();
            document.getElementById('statusText').innerText = "太空中：軌道運轉中";

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, orbitAltitude),
                orientation: {
                    heading: 0,
                    pitch: Cesium.Math.toRadians(-90),
                    roll: 0
                },
                duration: 2.5,
                complete: () => {
                    lastTime = Date.now();
                    isOrbiting = true;
                }
            });
        }

        // 6. 卡片顯示控制
        const card = document.getElementById('storyCard');
        function showCard(data) {
            document.getElementById('storyTag').innerText = data.tag;
            document.getElementById('storyTitle').innerText = data.name;
            document.getElementById('storyDesc').innerText = data.desc;
            card.classList.add('active');
        }
        function hideCard() {
            card.classList.remove('active');
        }

        returnToOrbit();
    </script>
</body>
</html>
