<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球與全球地標導覽系統 (Three.js)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-container { width: 100%; height: 100%; }

        /* 左側選單 HUD */
        .hud-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10; width: 310px;
            max-height: calc(100vh - 40px); padding: 18px; background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(16px); border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px; color: #fff; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            display: flex; flex-direction: column;
        }
        .hud-title {
            font-size: 1.15rem; font-weight: 700; letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
        }
        .hud-status { font-size: 0.75rem; color: #00f2fe; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background-color: #00f2fe; border-radius: 50%; box-shadow: 0 0 8px #00f2fe; }

        .tour-list { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; max-height: 58vh; }
        .tour-list::-webkit-scrollbar { width: 4px; }
        .tour-list::-webkit-scrollbar-thumb { background: rgba(0, 242, 254, 0.4); border-radius: 4px; }

        .category-title {
            font-size: 0.75rem; color: #00f2fe; margin-top: 12px; margin-bottom: 4px; font-weight: 700;
            letter-spacing: 0.5px; border-bottom: 1px solid rgba(0, 242, 254, 0.2); padding-bottom: 3px;
        }
        .btn-tour {
            width: 100%; padding: 8px 10px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 6px; color: #ffffff;
            font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: space-between;
        }
        .btn-tour:hover { background: rgba(0, 242, 254, 0.2); border-color: #00f2fe; transform: translateX(3px); }
        .btn-orbit { margin-top: 12px; padding: 10px; background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(79, 172, 254, 0.25)); border-color: #00f2fe; flex-shrink: 0; }

        /* 底部資訊卡片 */
        .story-card {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(20px);
            z-index: 10; width: 420px; max-width: 90vw; padding: 16px 20px; background: rgba(10, 15, 30, 0.9);
            backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 254, 0.35); border-radius: 14px; color: #f8fafc;
            opacity: 0; transition: all 0.4s ease; pointer-events: none; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        .story-card.active { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .story-tag { font-size: 0.7rem; padding: 2px 6px; background: rgba(0, 242, 254, 0.2); color: #00f2fe; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
        .story-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
        .story-desc { font-size: 0.82rem; line-height: 1.4; color: #cbd5e1; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-panel">
        <div class="hud-title">EARTH EXPLORER</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span id="statusText">太空中：自轉運轉中</span>
        </div>
        <div class="tour-list" id="tourList"></div>
        <button class="btn-tour btn-orbit" onclick="returnToOrbit()">
            <span>🚀 返回太空全景俯瞰</span>
            <small>Orbit View</small>
        </button>
    </div>

    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">LOCATION</div>
        <div id="storyTitle" class="story-title">景點名稱</div>
        <div id="storyDesc" class="story-desc">景點詳細說明...</div>
    </div>

    <!-- 載入 Three.js、控制元件與 TWEEN 飛航動畫庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');
            const EARTH_RADIUS = 5;

            // 1. 建立 Three.js 場景與相機
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 22);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 2. 光照設定 (確保 360 度完全明亮，絕無黑夜)
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            // 3. 建立地球 (套用 NASA 紋理)
            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const textureLoader = new THREE.TextureLoader();
            const nasaTextureUrl = 'https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg';
            const texture = textureLoader.load(nasaTextureUrl);

            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.6 });
            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // 4. 經緯度轉 3D 空間座標 (X, Y, Z) 的經典公式
            function latLonToVector3(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const z = (radius * Math.sin(phi) * Math.sin(theta));
                const y = (radius * Math.cos(phi));
                return new THREE.Vector3(x, y, z);
            }

            // 5. 全亞洲與全球景點選單資料
            const tourData = [
                {
                    category: "🇹🇼 臺灣經典名勝",
                    items: [
                        { name: "台北 101", sub: "Taipei 101", tag: "TAIPEI / URBAN", desc: "臺灣第一高樓，高度 508 公尺，信義區指標建築。", lat: 25.0330, lon: 121.5645 },
                        { name: "玉山主峰", sub: "Yushan Peak", tag: "TAIWAN / MOUNTAIN", desc: "東北亞第一高峰，海拔 3,952 公尺。", lat: 23.4700, lon: 120.9573 },
                        { name: "高雄流行音樂中心", sub: "Kaohsiung Music Center", tag: "KAOHSIUNG / HARBOR", desc: "高雄港愛河灣文化新地標。", lat: 22.6180, lon: 120.2930 },
                        { name: "日月潭", sub: "Sun Moon Lake", tag: "NANTOU / LAKE", desc: "臺灣最大半天然湖泊，高空視野極佳。", lat: 23.8517, lon: 120.9159 },
                        { name: "太魯閣國家公園", sub: "Taroko Gorge", tag: "HUALIEN / GORGE", desc: "雄偉的大理岩峽谷景觀。", lat: 24.1600, lon: 121.5500 }
                    ]
                },
                {
                    category: "🇯🇵 東亞：日本",
                    items: [
                        { name: "東京鐵塔", sub: "Tokyo Tower", tag: "JAPAN / TOKYO", desc: "日本首都著名地標塔。", lat: 35.6586, lon: 139.7454 },
                        { name: "富士山", sub: "Mount Fuji", tag: "JAPAN / FUJI", desc: "日本最高峰，海拔 3,776 公尺的聖山。", lat: 35.3606, lon: 138.7274 },
                        { name: "京都 清水寺", sub: "Kiyomizu-dera", tag: "JAPAN / KYOTO", desc: "古都京都最著名的古老寺院。", lat: 34.9948, lon: 135.7850 }
                    ]
                },
                {
                    category: "🇰🇷 東亞：韓國",
                    items: [
                        { name: "首爾 N首爾塔", sub: "N Seoul Tower", tag: "KOREA / SEOUL", desc: "座落於南山之巔的首爾城市地標。", lat: 37.5512, lon: 126.9882 },
                        { name: "漢拏山 (濟州島)", sub: "Hallasan Peak", tag: "KOREA / JEJU", desc: "韓國最高峰，位於濟州島中央。", lat: 33.3617, lon: 126.5370 }
                    ]
                },
                {
                    category: "🇸🇬 🇹🇭 東南亞與中東",
                    items: [
                        { name: "新加坡 濱海灣金沙", sub: "Marina Bay Sands", tag: "SINGAPORE / URBAN", desc: "新加坡最具代表性的現代建築群。", lat: 1.2834, lon: 103.8597 },
                        { name: "杜拜 哈里發塔", sub: "Burj Khalifa", tag: "UAE / DUBAI", desc: "全球第一高樓，高度達 828 公尺。", lat: 25.1972, lon: 55.2744 }
                    ]
                },
                {
                    category: "🌍 全球指標名勝",
                    items: [
                        { name: "法國 艾菲爾鐵塔", sub: "Eiffel Tower", tag: "FRANCE / PARIS", desc: "巴黎最具代表性的鋼鐵地標。", lat: 48.8584, lon: 2.2945 },
                        { name: "埃及 吉薩金字塔", sub: "Giza Pyramids", tag: "EGYPT / CAIRO", desc: "千年古文明吉薩金字塔群。", lat: 29.9792, lon: 31.1342 }
                    ]
                }
            ];

            // 6. 生成左側 UI 與地球上的 3D 地標光點
            const tourListContainer = document.getElementById('tourList');
            let globalLocations = [];
            let locIndex = 0;

            tourData.forEach(group => {
                const catHeader = document.createElement('div');
                catHeader.className = 'category-title';
                catHeader.innerText = group.category;
                tourListContainer.appendChild(catHeader);

                group.items.forEach(item => {
                    // 在地球上放一小紅點標記
                    const pos = latLonToVector3(item.lat, item.lon, EARTH_RADIUS + 0.03);
                    const markerGeo = new THREE.SphereGeometry(0.08, 16, 16);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    marker.position.copy(pos);
                    earth.add(marker);

                    // 按鈕生成
                    const btn = document.createElement('button');
                    btn.className = 'btn-tour';
                    const currentIndex = locIndex;
                    btn.onclick = () => flyToLocation(currentIndex);
                    btn.innerHTML = `<span>${item.name}</span><small style="color:#00f2fe">${item.sub}</small>`;
                    tourListContainer.appendChild(btn);

                    globalLocations.push({ ...item, targetPos: pos });
                    locIndex++;
                });
            });

            let isOrbiting = true;

            // 7. 飛航動畫函式 (Fly-to)
            window.flyToLocation = function(index) {
                isOrbiting = false;
                document.getElementById('statusText').innerText = "對焦模式：視角移動中";
                document.getElementById('storyCard').classList.remove('active');

                const loc = globalLocations[index];
                
                // 計算相機飛到的目標位置 (位於標點上方)
                const targetCameraPos = loc.targetPos.clone().multiplyScalar(1.8);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCameraPos.x, y: targetCameraPos.y, z: targetCameraPos.z }, 2000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .onComplete(() => {
                        document.getElementById('storyTag').innerText = loc.tag;
                        document.getElementById('storyTitle').innerText = loc.name;
                        document.getElementById('storyDesc').innerText = loc.desc;
                        document.getElementById('storyCard').classList.add('active');
                    })
                    .start();
            };

            // 返回太空俯瞰
            window.returnToOrbit = function() {
                document.getElementById('storyCard').classList.remove('active');
                document.getElementById('statusText').innerText = "太空中：自轉運轉中";

                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 0, z: 22 }, 2000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .onComplete(() => { isOrbiting = true; })
                    .start();
            };

            // 8. 繪圖循環
            function animate(time) {
                requestAnimationFrame(animate);
                TWEEN.update();

                if (isOrbiting) {
                    earth.rotation.y += 0.0008;
                }

                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
