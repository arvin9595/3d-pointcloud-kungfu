<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSHIP TACTICAL DISPLAY // TARGET LOCK SYSTEM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background-color: #01040a; font-family: 'Courier New', Courier, monospace, sans-serif; 
            color: #00f2fe; cursor: crosshair;
        }

        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 科幻網格與掃描線 */
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 242, 254, 0.04) 50%);
            background-size: 100% 4px;
        }

        /* 星艦舷窗外框 */
        .hud-corner {
            position: absolute; z-index: 5; pointer-events: none;
            border: 2px solid rgba(0, 242, 254, 0.5); box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .c-tl { top: 20px; left: 20px; width: 35px; height: 35px; border-right: none; border-bottom: none; }
        .c-tr { top: 20px; right: 20px; width: 35px; height: 35px; border-left: none; border-bottom: none; }
        .c-bl { bottom: 20px; left: 20px; width: 35px; height: 35px; border-right: none; border-top: none; }
        .c-br { bottom: 20px; right: 20px; width: 35px; height: 35px; border-left: none; border-top: none; }

        /* 通用星艦模組視窗 */
        .module-window {
            position: absolute; z-index: 10;
            background: rgba(4, 12, 24, 0.85); backdrop-filter: blur(10px);
            border: 1px solid #00f2fe;
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.15), 0 10px 30px rgba(0,0,0,0.8);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
        .module-header {
            padding: 8px 12px; background: rgba(0, 242, 254, 0.15);
            border-bottom: 1px solid rgba(0, 242, 254, 0.4);
            font-size: 0.75rem; font-weight: 900; letter-spacing: 1.5px;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 螢幕 1：左側導航選單 */
        .mod-nav { top: 40px; left: 40px; width: 260px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; }
        .tour-list { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; }
        .tour-list::-webkit-scrollbar { width: 3px; }
        .tour-list::-webkit-scrollbar-thumb { background: #00f2fe; }
        
        .cat-title { font-size: 0.65rem; color: #ffe600; font-weight: bold; margin-top: 8px; border-left: 2px solid #ffe600; padding-left: 5px; }
        .btn-target {
            width: 100%; padding: 8px; background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.25); color: #00f2fe;
            font-family: inherit; font-size: 0.78rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; display: flex; justify-content: space-between;
        }
        .btn-target:hover, .btn-target.active { 
            background: rgba(255, 0, 85, 0.2); border-color: #ff0055; color: #ff0055; 
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.6); 
        }

        /* 螢幕 2：右側副螢幕 */
        .mod-sub-screen {
            top: 40px; right: 40px; width: 380px; height: calc(100vh - 80px);
            display: flex; flex-direction: column; padding: 12px; gap: 10px;
        }
        .data-card {
            background: rgba(0, 242, 254, 0.05); border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 10px; font-size: 0.75rem; display: flex; flex-direction: column; gap: 6px;
        }
        .data-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0, 242, 254, 0.2); padding-bottom: 4px; }
        .data-val { color: #ffe600; font-weight: bold; }

        /* 衛星視窗框 */
        .map-frame-box {
            width: 100%; height: 220px; border: 1px solid #00f2fe;
            background: #000; position: relative; overflow: hidden;
        }
        .map-iframe { width: 100%; height: 100%; border: none; }

        /* 文字介紹區塊 */
        .desc-box {
            font-size: 0.75rem; line-height: 1.5; color: #cbd5e1;
            background: rgba(0, 0, 0, 0.4); padding: 8px; border-left: 2px solid #00f2fe;
            overflow-y: auto; max-height: 120px;
        }

        /* 點擊螢幕能量水波紋 */
        .click-pulse {
            position: absolute; width: 20px; height: 20px; border: 2px solid #00f2fe;
            border-radius: 50%; pointer-events: none; z-index: 99;
            animation: pulse-anim 0.6s ease-out forwards;
        }
        @keyframes pulse-anim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(3.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <div class="hud-corner c-tl"></div>
    <div class="hud-corner c-tr"></div>
    <div class="hud-corner c-bl"></div>
    <div class="hud-corner c-br"></div>

    <div id="canvas-container"></div>

    <!-- 左顯示器：戰術選單 -->
    <div class="module-window mod-nav">
        <div class="module-header">
            <span>[NAV-TARGETS]</span>
            <small style="color:#00f2fe;">SYS: READY</small>
        </div>
        <div class="tour-list" id="tourList"></div>
    </div>

    <!-- 右顯示器：星艦副分析螢幕 -->
    <div class="module-window mod-sub-screen">
        <div class="module-header">
            <span>[SECONDARY DISPLAY // TARGET TACTICAL]</span>
            <span style="color:#ffe600;" id="targetStatus">STANDBY</span>
        </div>

        <div class="map-frame-box">
            <iframe class="map-iframe" id="mapIframe" src="about:blank"></iframe>
        </div>

        <div class="data-card">
            <div class="data-row"><span>目標名稱 TARGET:</span><span class="data-val" id="targetName" style="color:#ff0055;">請選擇地標</span></div>
            <div class="data-row"><span>建立/歷史年代 ERA:</span><span class="data-val" id="targetEra">--</span></div>
            <div class="data-row"><span>星艦軌道距離 DISTANCE:</span><span class="data-val" id="targetDist">35,000 KM</span></div>
            <div class="data-row"><span>地理座標 COORDINATES:</span><span class="data-val" id="targetCoords">0.00° N, 0.00° E</span></div>
        </div>

        <div class="desc-box" id="targetDesc">
            >> 戰術系統待命...<br>
            請點擊左側地標，星艦將自動定向座標，並觸發紅色紅色戰術雷達鎖定發光圈。
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');
            const EARTH_RADIUS = 5;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-2, 0, 22);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);

            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const textureLoader = new THREE.TextureLoader();
            const nasaTextureUrl = 'https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg';
            const texture = textureLoader.load(nasaTextureUrl);

            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            function latLonToVector3(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const z = (radius * Math.sin(phi) * Math.sin(theta));
                const y = (radius * Math.cos(phi));
                return new THREE.Vector3(x, y, z);
            }

            const tourData = [
                {
                    category: "TARGET: TAIWAN",
                    items: [
                        { name: "台北 101", sub: "TAIPEI 101", lat: 25.0330, lon: 121.5645, era: "2004 年竣工", dist: "35,508 KM", desc: "曾為世界第一高樓，總高度 508 公尺，為臺灣現代化與竹節建築結構之代表作。" },
                        { name: "玉山主峰", sub: "YUSHAN PEAK", lat: 23.4700, lon: 120.9573, era: "約 300 萬年前造山運動", dist: "35,004 KM", desc: "東北亞第一高峰，海拔 3,952 公尺，為造山運動形成之雄偉板塊地貌。" },
                        { name: "高雄流行音樂中心", sub: "KAOHSIUNG MUSIC", lat: 22.6180, lon: 120.2930, era: "2021 年啟用", dist: "35,000 KM", desc: "座落於高雄港愛河灣，以海洋元素為設計靈感之港灣新地標。" }
                    ]
                },
                {
                    category: "TARGET: ASIA",
                    items: [
                        { name: "東京鐵塔", sub: "TOKYO TOWER", lat: 35.6586, lon: 139.7454, era: "1958 年建造", dist: "35,333 KM", desc: "以巴黎艾菲爾鐵塔為藍本打造，高 332.9 公尺，為東京戰後復興之象徵。" },
                        { name: "富士山", sub: "MOUNT FUJI", lat: 35.3606, lon: 138.7274, era: "約 10 萬年前形成", dist: "35,377 KM", desc: "日本最高峰（3,776 公尺），為標準的複式火山，山頂終年積雪景緻極佳。" }
                    ]
                },
                {
                    category: "TARGET: GLOBAL HISTORIC",
                    items: [
                        { name: "吉薩金字塔", sub: "GIZA PYRAMIDS", lat: 29.9792, lon: 31.1342, era: "西元前 2560 年", dist: "36,450 KM", desc: "古代世界七大奇蹟唯一尚存者，胡夫金字塔由約 230 萬塊巨石堆砌而成。" },
                        { name: "巴黎 艾菲爾鐵塔", sub: "EIFFEL TOWER", lat: 48.8584, lon: 2.2945, era: "1889 年落成", dist: "37,100 KM", desc: "為慶祝法國大革命百週年與世界博覽會所建，高 330 公尺之鍛鐵鏤空結構塔。" }
                    ]
                }
            ];

            const tourListContainer = document.getElementById('tourList');
            let globalLocations = [];
            let locIndex = 0;
            let activeMarkerGroup = null; // 當前鎖定的 3D 紅光標記組

            tourData.forEach(group => {
                const catHeader = document.createElement('div');
                catHeader.className = 'cat-title';
                catHeader.innerText = group.category;
                tourListContainer.appendChild(catHeader);

                group.items.forEach(item => {
                    const pos = latLonToVector3(item.lat, item.lon, EARTH_RADIUS + 0.02);

                    // 建立基礎藍色小點
                    const dotGeo = new THREE.SphereGeometry(0.06, 16, 16);
                    const dotMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
                    const dotMesh = new THREE.Mesh(dotGeo, dotMat);
                    dotMesh.position.copy(pos);
                    earth.add(dotMesh);

                    // 建立紅色鎖定發光光圈 (隱藏預設)
                    const ringGeo = new THREE.RingGeometry(0.08, 0.15, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.copy(pos.clone().multiplyScalar(1.01));
                    ringMesh.lookAt(pos.clone().multiplyScalar(2)); // 面向外側
                    ringMesh.visible = false;
                    earth.add(ringMesh);

                    const btn = document.createElement('button');
                    btn.className = 'btn-target';
                    const idx = locIndex;
                    btn.id = `btn-${idx}`;
                    btn.onclick = () => updateSubScreen(idx);
                    btn.innerHTML = `<span>${item.name}</span><small>${item.sub}</small>`;
                    tourListContainer.appendChild(btn);

                    globalLocations.push({ 
                        ...item, 
                        targetPos: pos, 
                        dotMesh: dotMesh, 
                        ringMesh: ringMesh 
                    });
                    locIndex++;
                });
            });

            // 更新選擇狀態：地標點瞬間變紅 + 光效動畫
            window.updateSubScreen = function(index) {
                const loc = globalLocations[index];

                // 1. 清除上一個目標的紅色鎖定狀態
                globalLocations.forEach((item, i) => {
                    item.dotMesh.material.color.setHex(0x00f2fe); // 恢復藍點
                    item.ringMesh.visible = false; // 隱藏紅圈
                    document.getElementById(`btn-${i}`).classList.remove('active');
                });

                // 2. 啟動當前目標的「紅色戰術發光光圈」
                loc.dotMesh.material.color.setHex(0xff0055); // 點切換成亮紅
                loc.ringMesh.visible = true; // 顯示紅色戰術環
                document.getElementById(`btn-${index}`).classList.add('active');

                // 紅色光環脈衝放大動畫 (Pulse Animate)
                loc.ringMesh.scale.set(1, 1, 1);
                new TWEEN.Tween(loc.ringMesh.scale)
                    .to({ x: 2.2, y: 2.2, z: 2.2 }, 800)
                    .yoyo(true)
                    .repeat(Infinity)
                    .start();

                // 3. 地球轉向目標
                const targetCameraPos = loc.targetPos.clone().multiplyScalar(1.8);
                targetCameraPos.x -= 2;

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCameraPos.x, y: targetCameraPos.y, z: targetCameraPos.z }, 1500)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .start();

                // 4. 更新右側副螢幕數據
                document.getElementById('targetStatus').innerText = "TARGET LOCKED";
                document.getElementById('targetStatus').style.color = "#ff0055";
                document.getElementById('targetName').innerText = loc.name;
                document.getElementById('targetEra').innerText = loc.era;
                document.getElementById('targetDist').innerText = loc.dist || "35,000 KM";
                document.getElementById('targetCoords').innerText = `${loc.lat.toFixed(2)}° N, ${loc.lon.toFixed(2)}° E`;
                document.getElementById('targetDesc').innerHTML = `>> <span style="color:#ff0055;">[鎖定成功]</span> 戰術分析簡報：<br>${loc.desc}`;

                const googleMapUrl = `https://maps.google.com/maps?q=${loc.lat},${loc.lon}&t=k&z=15&ie=UTF8&iwloc=&output=embed`;
                document.getElementById('mapIframe').src = googleMapUrl;
            };

            // 全螢幕點擊能量波紋
            window.addEventListener('click', (e) => {
                const pulse = document.createElement('div');
                pulse.className = 'click-pulse';
                pulse.style.left = `${e.clientX - 10}px`;
                pulse.style.top = `${e.clientY - 10}px`;
                document.body.appendChild(pulse);
                setTimeout(() => pulse.remove(), 600);
            });

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();
                earth.rotation.y += 0.0008; // 保持自轉
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
