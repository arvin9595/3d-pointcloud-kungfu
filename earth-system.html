<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR-COMMAND // 3D 全球戰略導覽系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background-color: #02050e; font-family: 'Courier New', Courier, monospace, sans-serif; color: #00f2fe; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 1. 星艦艦橋 HUD 四角科幻切角邊框 */
        .hud-frame-corner {
            position: absolute; z-index: 5; pointer-events: none;
            border: 2px solid rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }
        .corner-tl { top: 15px; left: 15px; width: 40px; height: 40px; border-right: none; border-bottom: none; }
        .corner-tr { top: 15px; right: 15px; width: 40px; height: 40px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 15px; left: 15px; width: 40px; height: 40px; border-right: none; border-top: none; }
        .corner-br { bottom: 15px; right: 15px; width: 40px; height: 40px; border-left: none; border-top: none; }

        /* 雷達動態掃描線 overlay */
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 242, 254, 0.05) 50%);
            background-size: 100% 4px;
        }

        /* 2. 星際爭霸風格左側主控面板 */
        .hud-panel {
            position: absolute; top: 35px; left: 35px; z-index: 10; width: 320px;
            max-height: calc(100vh - 70px); padding: 20px;
            background: rgba(4, 12, 24, 0.85);
            border: 1px solid #00f2fe;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.2), 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column;
        }
        .hud-header { border-bottom: 2px solid #00f2fe; padding-bottom: 8px; margin-bottom: 12px; }
        .hud-title { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; text-shadow: 0 0 10px #00f2fe; }
        .hud-sub { font-size: 0.65rem; color: #ff0055; letter-spacing: 1px; margin-top: 2px; }

        /* 選單列表裝飾 */
        .tour-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; max-height: 55vh; }
        .tour-list::-webkit-scrollbar { width: 3px; }
        .tour-list::-webkit-scrollbar-thumb { background: #00f2fe; }

        .category-title {
            font-size: 0.7rem; color: #ffe600; margin-top: 10px; font-weight: bold;
            letter-spacing: 1.5px; text-transform: uppercase; border-left: 3px solid #ffe600; padding-left: 6px;
        }
        .btn-tour {
            width: 100%; padding: 10px; background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe;
            font-family: inherit; font-size: 0.8rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease; display: flex; justify-content: space-between; align-items: center;
        }
        .btn-tour:hover {
            background: rgba(0, 242, 254, 0.3); border-color: #00f2fe;
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.6); transform: translateX(4px);
        }
        .btn-orbit {
            margin-top: 15px; background: rgba(255, 0, 85, 0.2); border-color: #ff0055; color: #ff0055;
        }
        .btn-orbit:hover { background: rgba(ff, 0, 85, 0.5); box-shadow: 0 0 15px #ff0055; }

        /* 3. 地形地貌高畫質彈窗 Modal (Google Maps 結合) */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100;
            background: rgba(2, 5, 14, 0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-container {
            width: 85vw; height: 80vh; background: rgba(4, 12, 24, 0.95);
            border: 2px solid #00f2fe; box-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            display: flex; flex-direction: column; position: relative;
            clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
        }
        .modal-header {
            padding: 12px 20px; background: rgba(0, 242, 254, 0.15); border-bottom: 1px solid #00f2fe;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-size: 1.1rem; font-weight: bold; letter-spacing: 2px; }
        .btn-close {
            background: #ff0055; color: #fff; border: none; padding: 6px 15px; font-weight: bold;
            cursor: pointer; font-family: inherit; box-shadow: 0 0 10px #ff0055;
        }
        .btn-close:hover { background: #ff3300; }
        .modal-iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <!-- 科幻四角定位邊框 -->
    <div class="hud-frame-corner corner-tl"></div>
    <div class="hud-frame-corner corner-tr"></div>
    <div class="hud-frame-corner corner-bl"></div>
    <div class="hud-frame-corner corner-br"></div>

    <div id="canvas-container"></div>

    <!-- 左側星艦指揮面板 -->
    <div class="hud-panel">
        <div class="hud-header">
            <div class="hud-title">NAV-COMMAND</div>
            <div class="hud-sub">SYS.STATUS: ONLINE // ORBIT 35,000KM</div>
        </div>
        <div class="tour-list" id="tourList"></div>
        <button class="btn-tour btn-orbit" onclick="returnToOrbit()">
            <span>🚀 重置全景軌道</span>
            <small>RESET ORBIT</small>
        </button>
    </div>

    <!-- 高清地形彈窗 (Google 衛星視角) -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">TACTICAL MAP // TARGET LOCK</div>
                <button class="btn-close" onclick="closeMapModal()">CLOSE SYSTEM [X]</button>
            </div>
            <iframe class="modal-iframe" id="mapIframe" src=""></iframe>
        </div>
    </div>

    <!-- 載入 Three.js、控制元件與 TWEEN 動畫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <script>
        window.addEventListener('load', () => {
            const container = document.getElementById('canvas-container');
            const EARTH_RADIUS = 5;

            // 1. 三維場景
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 22);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 2. 均勻光照（絕不黑夜）
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
            scene.add(ambientLight);

            // 3. NASA 紋理地球
            const geometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const textureLoader = new THREE.TextureLoader();
            const nasaTextureUrl = 'https://upload.wikimedia.org/wikipedia/commons/8/83/Equirectangular_projection_SW.jpg';
            const texture = textureLoader.load(nasaTextureUrl);

            const material = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
            const earth = new THREE.Mesh(geometry, material);
            scene.add(earth);

            // 經緯度轉換公式
            function latLonToVector3(lat, lon, radius) {
                const phi = (90 - lat) * (Math.PI / 180);
                const theta = (lon + 180) * (Math.PI / 180);
                const x = -(radius * Math.sin(phi) * Math.cos(theta));
                const z = (radius * Math.sin(phi) * Math.sin(theta));
                const y = (radius * Math.cos(phi));
                return new THREE.Vector3(x, y, z);
            }

            // 4. 全球與台灣目標資料庫
            const tourData = [
                {
                    category: "TARGET: TAIWAN",
                    items: [
                        { name: "台北 101", sub: "TAIPEI 101", lat: 25.0330, lon: 121.5645 },
                        { name: "玉山主峰", sub: "YUSHAN PEAK", lat: 23.4700, lon: 120.9573 },
                        { name: "高雄流行音樂中心", sub: "KAOHSIUNG MUSIC", lat: 22.6180, lon: 120.2930 },
                        { name: "日月潭", sub: "SUN MOON LAKE", lat: 23.8517, lon: 120.9159 }
                    ]
                },
                {
                    category: "TARGET: EAST ASIA",
                    items: [
                        { name: "東京鐵塔", sub: "TOKYO TOWER", lat: 35.6586, lon: 139.7454 },
                        { name: "富士山", sub: "MOUNT FUJI", lat: 35.3606, lon: 138.7274 },
                        { name: "首爾 N首爾塔", sub: "SEOUL TOWER", lat: 37.5512, lon: 126.9882 }
                    ]
                },
                {
                    category: "TARGET: GLOBAL",
                    items: [
                        { name: "杜拜 哈里發塔", sub: "BURJ KHALIFA", lat: 25.1972, lon: 55.2744 },
                        { name: "巴黎 艾菲爾鐵塔", sub: "EIFFEL TOWER", lat: 48.8584, lon: 2.2945 }
                    ]
                }
            ];

            const tourListContainer = document.getElementById('tourList');
            let globalLocations = [];
            let locIndex = 0;

            tourData.forEach(group => {
                const catHeader = document.createElement('div');
                catHeader.className = 'category-title';
                catHeader.innerText = group.category;
                tourListContainer.appendChild(catHeader);

                group.items.forEach(item => {
                    // 生成 3D 發光目標點
                    const pos = latLonToVector3(item.lat, item.lon, EARTH_RADIUS + 0.03);
                    const markerGeo = new THREE.SphereGeometry(0.09, 16, 16);
                    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
                    const marker = new THREE.Mesh(markerGeo, markerMat);
                    marker.position.copy(pos);
                    earth.add(marker);

                    const btn = document.createElement('button');
                    btn.className = 'btn-tour';
                    const idx = locIndex;
                    btn.onclick = () => flyAndOpenMap(idx);
                    btn.innerHTML = `<span>${item.name}</span><small style="color:#ffe600">${item.sub}</small>`;
                    tourListContainer.appendChild(btn);

                    globalLocations.push({ ...item, targetPos: pos });
                    locIndex++;
                });
            });

            let isOrbiting = true;

            // 5. 點擊鎖定：鏡頭飛躍 + 開啟 Google 高清衛星地形彈窗
            window.flyAndOpenMap = function(index) {
                isOrbiting = false;
                const loc = globalLocations[index];
                const targetCameraPos = loc.targetPos.clone().multiplyScalar(1.8);

                new TWEEN.Tween(camera.position)
                    .to({ x: targetCameraPos.x, y: targetCameraPos.y, z: targetCameraPos.z }, 1800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .onComplete(() => {
                        // 載入 Google Maps 衛星 3D 地貌視角
                        const googleMapUrl = `https://maps.google.com/maps?q=${loc.lat},${loc.lon}&t=k&z=15&ie=UTF8&iwloc=&output=embed`;
                        document.getElementById('modalTitle').innerText = `TARGET LOCKED // ${loc.name} (${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)})`;
                        document.getElementById('mapIframe').src = googleMapUrl;
                        document.getElementById('mapModal').classList.add('active');
                    })
                    .start();
            };

            window.closeMapModal = function() {
                document.getElementById('mapModal').classList.remove('active');
                document.getElementById('mapIframe').src = "";
            };

            window.returnToOrbit = function() {
                closeMapModal();
                new TWEEN.Tween(camera.position)
                    .to({ x: 0, y: 0, z: 22 }, 1800)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .onUpdate(() => controls.update())
                    .onComplete(() => { isOrbiting = true; })
                    .start();
            };

            function animate() {
                requestAnimationFrame(animate);
                TWEEN.update();
                if (isOrbiting) earth.rotation.y += 0.0008;
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
