<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth System - 經緯度偵測與地標飛航系統</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 16px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            z-index: 10;
            max-width: 320px;
        }
        #ui-panel h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #4fc3f7;
            letter-spacing: 1px;
        }
        #ui-panel p {
            margin: 4px 0;
            font-size: 13px;
            color: #b0bec5;
        }
        #mode-indicator {
            display: inline-block;
            margin: 6px 0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #0288d1;
            color: #fff;
        }
        .section-title {
            font-size: 12px;
            color: #81d4fa;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
        }
        #controls-bar, #fly-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            pointer-events: auto;
        }
        .btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(79, 195, 247, 0.4);
            border-color: #4fc3f7;
        }
        .btn.active {
            background: #0288d1;
            border-color: #0288d1;
        }
        .btn-fly {
            background: rgba(46, 125, 50, 0.3);
            border-color: rgba(76, 175, 80, 0.5);
        }
        .btn-fly:hover {
            background: #2e7d32;
            border-color: #81c784;
        }
    </style>

    <!-- 引入 GSAP 補間動畫庫與 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-panel">
        <h2>EARTH SYSTEM</h2>
        <p>✦ 滾輪進行縮放（自動於太空與近地面切換）</p>
        <p id="altitude-readout">視角高度: 計算中...</p>
        <p id="coords-readout">指向座標: 指向地表中...</p>
        <div id="mode-indicator">渲染模式: 太空全域 (晝夜城市燈光開啟)</div>
        
        <div class="section-title">自轉控制</div>
        <div id="controls-bar">
            <button id="btn-pause" class="btn">⏸ 暫停自轉</button>
            <button id="btn-1x" class="btn active">1x 速度</button>
            <button id="btn-2x" class="btn">2x 速度</button>
            <button id="btn-5x" class="btn">5x 速度</button>
        </div>

        <div class="section-title">快速飛往熱門地標</div>
        <div id="fly-bar">
            <button class="btn btn-fly" data-lat="23.47" data-lon="120.95">🏔 台灣玉山</button>
            <button class="btn btn-fly" data-lat="27.98" data-lon="86.92">🏔 喜馬拉雅山</button>
            <button class="btn btn-fly" data-lat="45.83" data-lon="6.86">🏔 阿爾卑斯山</button>
            <button class="btn btn-fly" data-lat="35.67" data-lon="139.65">🗼 東京</button>
            <button class="btn btn-fly" data-lat="40.71" data-lon="-74.00">🏙 紐約</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 初始化場景、相機與渲染器
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.001,
            2000
        );
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            logarithmicDepthBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. 控制器設定
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 6.002; 
        controls.maxDistance = 150;

        // 3. 太陽光源設定
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(100, 20, 50);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x0a1020, 0.15);
        scene.add(ambientLight);

        // 4. 群組設定
        const spaceGroup = new THREE.Group();
        const groundGroup = new THREE.Group();
        scene.add(spaceGroup);
        scene.add(groundGroup);

        // === 貼圖與 Shader ===
        const earthRadius = 6;
        const textureLoader = new THREE.TextureLoader();

        const earthDayMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const earthNightMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');
        const earthNormalMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const cloudMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');

        const earthShaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                dayTexture: { value: earthDayMap },
                nightTexture: { value: earthNightMap },
                sunDirection: { value: sunLight.position.clone().normalize() }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vWorldNormal;
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D dayTexture;
                uniform sampler2D nightTexture;
                uniform vec3 sunDirection;

                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vWorldNormal;

                void main() {
                    vec3 dayColor = texture2D(dayTexture, vUv).rgb;
                    vec3 nightColor = texture2D(nightTexture, vUv).rgb;

                    float cosineAngle = dot(vWorldNormal, sunDirection);
                    float mixFactor = smoothstep(-0.15, 0.25, cosineAngle);
                    vec3 finalColor = mix(nightColor * 1.8, dayColor * 1.2, mixFactor);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMesh = new THREE.Mesh(earthGeometry, earthShaderMaterial);
        spaceGroup.add(earthMesh);

        // 太空雲層
        const cloudGeometry = new THREE.SphereGeometry(earthRadius * 1.015, 64, 64);
        const cloudMaterial = new THREE.MeshStandardMaterial({
            alphaMap: cloudMap,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.8
        });
        const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
        spaceGroup.add(cloudMesh);

        // 太空大氣光暈
        const atmosphereGeometry = new THREE.SphereGeometry(earthRadius * 1.12, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 2.5);
                    gl_FragColor = vec4(0.2, 0.55, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        spaceGroup.add(atmosphereMesh);

        // === 近地面層：高解析實體山脈地形 ===
        const highResGeometry = new THREE.SphereGeometry(earthRadius, 256, 256);
        const highResMaterial = new THREE.MeshStandardMaterial({
            map: earthDayMap,
            normalMap: earthNormalMap,
            normalScale: new THREE.Vector2(1.8, 1.8),
            displacementMap: earthNormalMap,
            displacementScale: 0.35,
            displacementBias: -0.05,
            roughness: 0.5
        });
        const highResEarth = new THREE.Mesh(highResGeometry, highResMaterial);
        groundGroup.add(highResEarth);
        groundGroup.visible = false;


        // 5. 控制狀態變數
        let baseRotationSpeed = 0.0003;
        let speedMultiplier = 1.0;
        let isPaused = false;
        let isFlying = false;

        // 6. 經緯度座標轉換與 Raycaster 射線偵測
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const coordsReadout = document.getElementById('coords-readout');

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const activeEarth = spaceGroup.visible ? earthMesh : highResEarth;
            const intersects = raycaster.intersectObject(activeEarth);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                // 將 3D 世界座標轉回地塊本地座標
                const localPoint = activeEarth.worldToLocal(point.clone());
                
                // 計算緯度與經度
                const lat = 90 - (Math.acos(localPoint.y / earthRadius) * 180 / Math.PI);
                let lon = ((Math.atan2(localPoint.z, localPoint.x) * 180 / Math.PI) + 180) % 360 - 180;
                // 修正球面貼圖 UV 偏移角
                lon = -lon - 90;
                if (lon < -180) lon += 360;

                const latStr = `${Math.abs(lat).toFixed(2)}° ${lat >= 0 ? 'N' : 'S'}`;
                const lonStr = `${Math.abs(lon).toFixed(2)}° ${lon >= 0 ? 'E' : 'W'}`;
                coordsReadout.innerText = `指向座標: ${latStr}, ${lonStr}`;
            } else {
                coordsReadout.innerText = `指向座標: 外太空`;
            }
        });

        // 7. 經緯度轉 3D 空間座標（用於飛行目的地計算）
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        // 8. 飛航動畫邏輯 (GSAP)
        function flyToLocation(lat, lon) {
            if (isFlying) return;
            isFlying = true;
            isPaused = true; // 飛行期間自動暫停自轉

            // 算目標點在地表與近地高度的 3D 向量
            const targetSurfaceVec = latLonToVector3(lat, lon, earthRadius);
            const targetCamVec = latLonToVector3(lat, lon, earthRadius + 0.3); // 降落高度 300km

            // 飛行時間與拋物線高度
            gsap.timeline({
                onComplete: () => {
                    isFlying = false;
                }
            })
            .to(camera.position, {
                duration: 2.5,
                x: targetCamVec.x,
                y: targetCamVec.y,
                z: targetCamVec.z,
                ease: "power2.inOut",
                onUpdate: () => {
                    controls.target.lerp(targetSurfaceVec, 0.1);
                }
            });
        }

        // 地標按鈕事件綁定
        document.querySelectorAll('.btn-fly').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const lat = parseFloat(e.target.dataset.lat);
                const lon = parseFloat(e.target.dataset.lon);
                flyToLocation(lat, lon);
            });
        });

        // 9. 雙層無縫過渡邏輯
        const altitudeReadout = document.getElementById('altitude-readout');
        const modeIndicator = document.getElementById('mode-indicator');
        const transitionThreshold = earthRadius + 2.0; 

        function updateLayersVisibility(camDistance) {
            const altitudeKM = Math.max(0, ((camDistance - earthRadius) * 1000)).toFixed(1);
            altitudeReadout.innerText = `視角高度: ${altitudeKM} km`;

            if (camDistance > transitionThreshold) {
                spaceGroup.visible = true;
                groundGroup.visible = false;
                scene.fog = null;
                
                modeIndicator.innerText = "渲染模式: 太空全域 (晝夜城市燈光)";
                modeIndicator.style.background = "#0288d1";
            } else {
                spaceGroup.visible = false;
                groundGroup.visible = true;
                
                scene.fog = new THREE.FogExp2(0x87ceeb, 0.08); 

                modeIndicator.innerText = "渲染模式: 近地面高解析地形 (High-Res LOD)";
                modeIndicator.style.background = "#2e7d32";
            }
        }

        // 10. 自轉速度控制按鈕
        const btnPause = document.getElementById('btn-pause');
        const btn1x = document.getElementById('btn-1x');
        const btn2x = document.getElementById('btn-2x');
        const btn5x = document.getElementById('btn-5x');
        const speedButtons = [btn1x, btn2x, btn5x];

        btnPause.addEventListener('click', () => {
            isPaused = !isPaused;
            btnPause.innerText = isPaused ? "▶ 恢復自轉" : "⏸ 暫停自轉";
            btnPause.classList.toggle('active', isPaused);
        });

        function setSpeed(multiplier, activeBtn) {
            speedMultiplier = multiplier;
            speedButtons.forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        btn1x.addEventListener('click', () => setSpeed(1.0, btn1x));
        btn2x.addEventListener('click', () => setSpeed(2.0, btn2x));
        btn5x.addEventListener('click', () => setSpeed(5.0, btn5x));

        // 11. 動畫迴圈
        function animate() {
            requestAnimationFrame(animate);

            const camDistance = camera.position.distanceTo(scene.position);
            updateLayersVisibility(camDistance);

            const shouldRotate = !isPaused && spaceGroup.visible && !isFlying;

            if (shouldRotate) {
                const currentSpeed = baseRotationSpeed * speedMultiplier;
                earthMesh.rotation.y += currentSpeed;
                cloudMesh.rotation.y += currentSpeed * 1.2;
                highResEarth.rotation.y += currentSpeed;
            }

            earthShaderMaterial.uniforms.sunDirection.value.copy(sunLight.position).normalize();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // RWD 視窗自動適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
