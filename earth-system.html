<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth System - 雙層 LOD 與 3D Tiles 實時地形模擬</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(10px);
            padding: 16px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }
        #ui-panel h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #4fc3f7;
            letter-spacing: 1px;
        }
        #ui-panel p {
            margin: 4px 0;
            font-size: 13px;
            color: #b0bec5;
        }
        #mode-indicator {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #0288d1;
            color: #fff;
        }
    </style>

    <!-- 引入 Three.js 與 3D Tiles Renderer -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "3d-tiles-renderer": "https://unpkg.com/3d-tiles-renderer@0.2.22/src/index.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui-panel">
        <h2>EARTH SYSTEM</h2>
        <p>✦ 滾輪進行縮放（自動於太空與近地面切換）</p>
        <p id="altitude-readout">視角高度: -- km</p>
        <div id="mode-indicator">渲染模式: 太空全域 (Space Shell)</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TilesRenderer } from '3d-tiles-renderer';

        // 1. 場景、相機與渲染器
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.001, // 支援近距離細節觀察
            2000
        );
        camera.position.set(0, 0, 20);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            logarithmicDepthBuffer: true // 關鍵：防止大尺度縮放時的深度閃爍 (Z-fighting)
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. 控制器設定
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 6.005; // 貼近地表保護限制
        controls.maxDistance = 150;

        // 3. 光源系統
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(100, 20, 50);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x0a1020, 0.2);
        scene.add(ambientLight);

        // -------------------------------------------------------------
        // 4. 群組分層：Space Group (太空層) vs Ground Group (近地面層)
        // -------------------------------------------------------------
        const spaceGroup = new THREE.Group();
        const groundGroup = new THREE.Group();
        scene.add(spaceGroup);
        scene.add(groundGroup);

        // === 太空層：NASA 地球與大氣 Shell ===
        const earthRadius = 6;
        const textureLoader = new THREE.TextureLoader();

        const earthDayMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const earthNormalMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const cloudMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');

        const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMaterial = new THREE.MeshStandardMaterial({
            map: earthDayMap,
            normalMap: earthNormalMap,
            roughness: 0.6
        });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        spaceGroup.add(earthMesh);

        // 雲層
        const cloudGeometry = new THREE.SphereGeometry(earthRadius * 1.015, 64, 64);
        const cloudMaterial = new THREE.MeshStandardMaterial({
            alphaMap: cloudMap,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.8
        });
        const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
        spaceGroup.add(cloudMesh);

        // 大氣光暈
        const atmosphereGeometry = new THREE.SphereGeometry(earthRadius * 1.12, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 2.5);
                    gl_FragColor = vec4(0.2, 0.55, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        spaceGroup.add(atmosphereMesh);


        // === 近地面層：3D Tiles Renderer (開放式 3D 高清地形瓦片) ===
        // 使用開放地圖數據源 (Cesium Ion / Open 3D Tiles 格式範例)
        const tilesRenderer = new TilesRenderer('https://raw.githubusercontent.com/CesiumGS/cesium/main/Apps/SampleData/Cesium3DTiles/Terrain/tileset.json');
        
        // 將相機與渲染器連結至 3D Tiles 系統
        tilesRenderer.setCamera(camera);
        tilesRenderer.setResolutionFromRenderer(camera, renderer);
        
        // 效能最佳化參數設定
        tilesRenderer.errorTarget = 6;      // 螢幕誤差閾值 (數字越小畫質越高、負擔越大；6 為效能與品質最佳平衡點)
        tilesRenderer.maxDepth = 15;        // 限制瓦片最大層級，防止無限下載
        tilesRenderer.lruCache.minSize = 100; // LRU 快取機制，自動清除沒看到的遠處瓦片
        tilesRenderer.lruCache.maxSize = 300;

        // 設定 Tiles 的縮放與位置對齊地球半徑
        tilesRenderer.group.scale.setScalar(earthRadius / 6371); // 將 WGS84 真實單位 (km) 縮放到專案地球尺度
        groundGroup.add(tilesRenderer.group);


        // -------------------------------------------------------------
        // 5. 雙層無縫過渡邏輯 (Cross-Fade System)
        // -------------------------------------------------------------
        const altitudeReadout = document.getElementById('altitude-readout');
        const modeIndicator = document.getElementById('mode-indicator');
        
        const transitionThreshold = earthRadius + 0.5; // 切換高度閾值 (約 500 km)

        function updateLayersVisibility(camDistance) {
            const altitudeKM = Math.max(0, ((camDistance - earthRadius) * 1000)).toFixed(1);
            altitudeReadout.innerText = `視角高度: ${altitudeKM} km`;

            if (camDistance > transitionThreshold) {
                // [ 太空模式 ]：啟動太空全域球體，暫停地表 Tiles 更新以節省 CPU/GPU 算力
                spaceGroup.visible = true;
                groundGroup.visible = false;
                modeIndicator.innerText = "渲染模式: 太空全域 (Space Shell)";
                modeIndicator.style.background = "#0288d1";
            } else {
                // [ 近地面模式 ]：隱藏太空球體，開啟 3D Tiles 動態下載與渲染
                spaceGroup.visible = false;
                groundGroup.visible = true;
                
                // 動態更新 3D Tiles 幾何網格與視野視錐
                tilesRenderer.update();

                modeIndicator.innerText = "渲染模式: 近地面 3D Tiles 地形 (LOD Active)";
                modeIndicator.style.background = "#2e7d32";
            }
        }

        // -------------------------------------------------------------
        // 6. 渲染與動畫迴圈
        // -------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);

            // 太空模式下自轉
            if (spaceGroup.visible) {
                earthMesh.rotation.y += 0.0003;
                cloudMesh.rotation.y += 0.00045;
            }

            // 監測相機距離並進行雙層切換
            const camDistance = camera.position.distanceTo(scene.position);
            updateLayersVisibility(camDistance);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 視窗變更適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
