<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth System - 全精細地標導覽系統</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            z-index: 10;
            width: 280px;
        }
        #ui-panel h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #4fc3f7;
            letter-spacing: 1px;
        }
        #ui-panel p {
            margin: 4px 0;
            font-size: 13px;
            color: #b0bec5;
        }
        #mode-indicator {
            display: inline-block;
            margin: 6px 0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #0288d1;
            color: #fff;
        }
        .section-title {
            font-size: 12px;
            color: #81d4fa;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #landmark-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            pointer-events: auto;
        }
        .btn-landmark {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(79, 195, 247, 0.3);
            color: #e0f7fa;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-landmark:hover {
            background: rgba(79, 195, 247, 0.3);
            border-color: #4fc3f7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 191, 255, 0.3);
        }
        .btn-landmark.active {
            background: #0288d1;
            border-color: #81d4fa;
            color: #fff;
            font-weight: bold;
        }
        #controls-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            pointer-events: auto;
        }
        .btn-sub {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-sub:hover {
            background: rgba(255, 255, 255, 0.25);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-panel">
        <h2>EARTH SYSTEM</h2>
        <p id="altitude-readout">視角高度: 計算中...</p>
        <p id="coords-readout">目標區域: 全球檢視</p>
        <div id="mode-indicator">模式: 太空全域 (Space)</div>

        <div class="section-title">📍 精選高解析地標導覽</div>
        <div id="landmark-grid">
            <button class="btn-landmark" data-lat="23.47" data-lon="120.95" data-name="台灣 玉山">🏔 台灣玉山</button>
            <button class="btn-landmark" data-lat="27.98" data-lon="86.92" data-name="珠穆朗瑪峰">🏔 聖母峰</button>
            <button class="btn-landmark" data-lat="45.83" data-lon="6.86" data-name="阿爾卑斯山">🏔 白朗峰</button>
            <button class="btn-landmark" data-lat="35.36" data-lon="138.72" data-name="日本 富士山">🗻 富士山</button>
            <button class="btn-landmark" data-lat="36.10" data-lon="-112.11" data-name="美國 大峽谷">🏜 大峽谷</button>
            <button class="btn-landmark" data-lat="-22.95" data-lon="-43.21" data-name="里約 耶穌像">🗿 耶穌山</button>
        </div>

        <div class="section-title">系統控制</div>
        <div id="controls-bar">
            <button id="btn-reset" class="btn-sub">🌐 返回太空視野</button>
            <button id="btn-pause" class="btn-sub">⏸ 暫停/播放</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 初始化場景與渲染器
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            40,
            window.innerWidth / window.innerHeight,
            0.001,
            2000
        );
        camera.position.set(0, 0, 22);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            logarithmicDepthBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. 控制器設定
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 6.0015; 
        controls.maxDistance = 150;

        // 3. 光源系統
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.8);
        sunLight.position.set(100, 30, 60);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x0a1020, 0.2);
        scene.add(ambientLight);

        // 4. 群組與材質設定
        const spaceGroup = new THREE.Group();
        const groundGroup = new THREE.Group();
        scene.add(spaceGroup);
        scene.add(groundGroup);

        const earthRadius = 6;
        const textureLoader = new THREE.TextureLoader();

        const earthDayMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const earthNightMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');
        const earthNormalMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const cloudMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');

        // 太空層材質
        const earthShaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                dayTexture: { value: earthDayMap },
                nightTexture: { value: earthNightMap },
                sunDirection: { value: sunLight.position.clone().normalize() }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldNormal;
                void main() {
                    vUv = uv;
                    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D dayTexture;
                uniform sampler2D nightTexture;
                uniform vec3 sunDirection;

                varying vec2 vUv;
                varying vec3 vWorldNormal;

                void main() {
                    vec3 dayColor = texture2D(dayTexture, vUv).rgb;
                    vec3 nightColor = texture2D(nightTexture, vUv).rgb;

                    float cosineAngle = dot(vWorldNormal, sunDirection);
                    float mixFactor = smoothstep(-0.15, 0.25, cosineAngle);
                    vec3 finalColor = mix(nightColor * 1.8, dayColor * 1.2, mixFactor);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
        const earthMesh = new THREE.Mesh(earthGeometry, earthShaderMaterial);
        spaceGroup.add(earthMesh);

        // 太空雲層
        const cloudGeometry = new THREE.SphereGeometry(earthRadius * 1.015, 64, 64);
        const cloudMaterial = new THREE.MeshStandardMaterial({
            alphaMap: cloudMap,
            transparent: true,
            blending: THREE.AdditiveBlending,
            opacity: 0.8
        });
        const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
        spaceGroup.add(cloudMesh);

        // === 近地面地標專用：極高密度 512x512 幾何體與深度立體感 ===
        const highResGeometry = new THREE.SphereGeometry(earthRadius, 512, 512);
        const highResMaterial = new THREE.MeshStandardMaterial({
            map: earthDayMap,
            normalMap: earthNormalMap,
            normalScale: new THREE.Vector2(2.5, 2.5),
            displacementMap: earthNormalMap,
            displacementScale: 0.45, // 顯著推高山脈高度
            displacementBias: -0.05,
            roughness: 0.45
        });
        const highResEarth = new THREE.Mesh(highResGeometry, highResMaterial);
        groundGroup.add(highResEarth);
        groundGroup.visible = false;

        // 5. 狀態變數與邏輯
        let isPaused = false;
        let isFlying = false;

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        // 6. 核心：傾斜視角飛航演算法（帶出立體山脈感）
        const coordsReadout = document.getElementById('coords-readout');

        function flyToLandmark(lat, lon, name) {
            if (isFlying) return;
            isFlying = true;
            isPaused = true;

            coordsReadout.innerText = `目標區域: ${name}`;

            // 1. 計算地表目標座標點
            const targetSurface = latLonToVector3(lat, lon, earthRadius);

            // 2. 計算傾斜鏡頭位置（在目標上方 + 偏移量，形成斜俯視）
            const tiltOffset = new THREE.Vector3(0, 0.15, 0.25); 
            const targetCamPos = latLonToVector3(lat, lon, earthRadius + 0.12).add(tiltOffset);

            // 3. GSAP 平滑飛行
            gsap.timeline({
                onComplete: () => {
                    isFlying = false;
                }
            })
            .to(camera.position, {
                duration: 2.8,
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                ease: "power3.inOut"
            })
            .to(controls.target, {
                duration: 2.8,
                x: targetSurface.x,
                y: targetSurface.y,
                z: targetSurface.z,
                ease: "power3.inOut"
            }, "<");
        }

        // 按鈕點擊事件
        document.querySelectorAll('.btn-landmark').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-landmark').forEach(b => b.classList.remove('active'));
                const targetBtn = e.currentTarget;
                targetBtn.classList.add('active');

                const lat = parseFloat(targetBtn.dataset.lat);
                const lon = parseFloat(targetBtn.dataset.lon);
                const name = targetBtn.dataset.name;
                flyToLandmark(lat, lon, name);
            });
        });

        // 返回太空視野按鈕
        document.getElementById('btn-reset').addEventListener('click', () => {
            document.querySelectorAll('.btn-landmark').forEach(b => b.classList.remove('active'));
            coordsReadout.innerText = "目標區域: 全球檢視";
            isFlying = true;
            
            gsap.timeline({
                onComplete: () => {
                    isFlying = false;
                    isPaused = false;
                }
            })
            .to(camera.position, { duration: 2.0, x: 0, y: 0, z: 22, ease: "power2.inOut" })
            .to(controls.target, { duration: 2.0, x: 0, y: 0, z: 0, ease: "power2.inOut" }, "<");
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            isPaused = !isPaused;
        });

        // 7. 雙層無縫過渡
        const altitudeReadout = document.getElementById('altitude-readout');
        const modeIndicator = document.getElementById('mode-indicator');
        const transitionThreshold = earthRadius + 2.0;

        function updateVisibility(camDistance) {
            const altitudeKM = Math.max(0, ((camDistance - earthRadius) * 1000)).toFixed(1);
            altitudeReadout.innerText = `視角高度: ${altitudeKM} km`;

            if (camDistance > transitionThreshold) {
                spaceGroup.visible = true;
                groundGroup.visible = false;
                scene.fog = null;
                modeIndicator.innerText = "模式: 太空全域 (Space)";
                modeIndicator.style.background = "#0288d1";
            } else {
                spaceGroup.visible = false;
                groundGroup.visible = true;
                scene.fog = new THREE.FogExp2(0x87ceeb, 0.12); // 近地面大氣霧感
                modeIndicator.innerText = "模式: 精細地標近景 (LOD High)";
                modeIndicator.style.background = "#2e7d32";
            }
        }

        // 8. 算繪迴圈
        function animate() {
            requestAnimationFrame(animate);

            const camDistance = camera.position.distanceTo(scene.position);
            updateVisibility(camDistance);

            if (!isPaused && spaceGroup.visible && !isFlying) {
                earthMesh.rotation.y += 0.0003;
                cloudMesh.rotation.y += 0.0004;
                highResEarth.rotation.y += 0.0003;
            }

            earthShaderMaterial.uniforms.sunDirection.value.copy(sunLight.position).normalize();

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
