<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth System - 終極地標導覽體驗版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(10, 15, 30, 0.88);
            backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            z-index: 10;
            width: 280px;
        }
        #ui-panel h2 {
            margin: 0 0 6px 0;
            font-size: 18px;
            color: #4fc3f7;
            letter-spacing: 1px;
        }
        #ui-panel p {
            margin: 4px 0;
            font-size: 13px;
            color: #b0bec5;
        }
        #mode-indicator {
            display: inline-block;
            margin: 6px 0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #0288d1;
            color: #fff;
        }
        .section-title {
            font-size: 12px;
            color: #81d4fa;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        #landmark-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            pointer-events: auto;
        }
        .btn-landmark {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(79, 195, 247, 0.3);
            color: #e0f7fa;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: all 0.25s ease;
        }
        .btn-landmark:hover {
            background: rgba(79, 195, 247, 0.3);
            border-color: #4fc3f7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 191, 255, 0.3);
        }
        .btn-landmark.active {
            background: #0288d1;
            border-color: #81d4fa;
            color: #fff;
            font-weight: bold;
        }
        #controls-bar {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            pointer-events: auto;
        }
        .btn-sub {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        .btn-sub:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 3D 懸浮地標 CSS 標籤 */
        .poi-label {
            position: absolute;
            top: 0;
            left: 0;
            transform: translate(-50%, -100%);
            color: #fff;
            background: rgba(10, 25, 45, 0.85);
            border: 1px solid #4fc3f7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(79, 195, 247, 0.6);
            display: none;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .poi-label::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #4fc3f7 transparent;
            display: block;
            width: 0;
        }
    </style>

    <!-- GSAP 補間動畫庫與 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-panel">
        <h2>EARTH SYSTEM</h2>
        <p id="altitude-readout">視角高度: 計算中...</p>
        <p id="coords-readout">目標區域: 全球檢視</p>
        <div id="mode-indicator">模式: 太空全域 (Space)</div>

        <div class="section-title">📍 精選高解析地標導覽</div>
        <div id="landmark-grid">
            <button class="btn-landmark" data-lat="23.47" data-lon="120.95" data-name="台灣 玉山" data-info="標高 3,952m">🏔 台灣玉山</button>
            <button class="btn-landmark" data-lat="27.98" data-lon="86.92" data-name="珠穆朗瑪峰" data-info="標高 8,848m">🏔 聖母峰</button>
            <button class="btn-landmark" data-lat="45.83" data-lon="6.86" data-name="阿爾卑斯山" data-info="白朗峰 4,807m">🏔 阿爾卑斯山</button>
            <button class="btn-landmark" data-lat="35.36" data-lon="138.72" data-name="日本 富士山" data-info="標高 3,776m">🗻 富士山</button>
            <button class="btn-landmark" data-lat="36.10" data-lon="-112.11" data-name="美國 大峽谷" data-info="深度 1,800m">🏜 大峽谷</button>
            <button class="btn-landmark" data-lat="-22.95" data-lon="-43.21" data-name="里約 耶穌像" data-info="基督山 710m">🗿 耶穌山</button>
        </div>

        <div class="section-title">導覽控制</div>
        <div id="controls-bar">
            <button id="btn-reset" class="btn-sub">🌐 返回太空視野</button>
            <button id="btn-auto-orbit" class="btn-sub">🔄 環視: 開啟</button>
        </div>
    </div>

    <!-- 3D 懸浮動態標籤 -->
    <div id="poi-tag" class="poi-label">📍 地標名稱</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene & Camera & Renderer
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            40,
            window.innerWidth / window.innerHeight,
            0.001,
            2000
        );
        camera.position.set(0, 0, 22);

        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            logarithmicDepthBuffer: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 6.0015; 
        controls.maxDistance = 150;

        // 3. Lighting
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.8);
        sunLight.position.set(100, 30, 60);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x0a1020, 0.25);
        scene.add(ambientLight);

        // 4. Groups & Textures
        const spaceGroup = new THREE.Group();
        const groundGroup = new THREE.Group();
        scene.add(spaceGroup);
        scene.add(groundGroup);

        const earthRadius = 6;
        const textureLoader = new THREE.TextureLoader();

        const earthDayMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const earthNightMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg');
        const earthNormalMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const cloudMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png');

        // Shader for Space Mode
        const earthShaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                dayTexture: { value: earthDayMap },
                nightTexture: { value: earthNightMap },
                sunDirection: { value: sunLight.position.clone().normalize() }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vWorldNormal;
                void main() {
                    vUv = uv;
                    vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D dayTexture;
                uniform sampler2D nightTexture;
                uniform vec3 sunDirection;

                varying vec2 vUv;
                varying vec3 vWorldNormal;

                void main() {
                    vec3 dayColor = texture2D(dayTexture, vUv).rgb;
                    vec3 nightColor = texture2D(nightTexture, vUv).rgb;

                    float cosineAngle = dot(vWorldNormal, sunDirection);
                    float mixFactor = smoothstep(-0.15, 0.25, cosineAngle);
                    vec3 finalColor = mix(nightColor * 1.8, dayColor * 1.2, mixFactor);

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        });

        const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius, 64, 64), earthShaderMaterial);
        spaceGroup.add(earthMesh);

        // Clouds
        const cloudMesh = new THREE.Mesh(
            new THREE.SphereGeometry(earthRadius * 1.015, 64, 64),
            new THREE.MeshStandardMaterial({
                alphaMap: cloudMap,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.8
            })
        );
        spaceGroup.add(cloudMesh);

        // High-Res Ground LOD Mesh
        const highResGeometry = new THREE.SphereGeometry(earthRadius, 512, 512);
        const highResMaterial = new THREE.MeshStandardMaterial({
            map: earthDayMap,
            normalMap: earthNormalMap,
            normalScale: new THREE.Vector2(2.5, 2.5),
            displacementMap: earthNormalMap,
            displacementScale: 0.45,
            displacementBias: -0.05,
            roughness: 0.45
        });
        const highResEarth = new THREE.Mesh(highResGeometry, highResMaterial);
        groundGroup.add(highResEarth);
        groundGroup.visible = false;

        // 5. App State
        let isFlying = false;
        let isAutoOrbiting = true;
        let currentTargetWorldPos = null;

        // Math helper
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        // 6. 核心 UX 飛行與智慧光照系統
        const coordsReadout = document.getElementById('coords-readout');
        const poiTag = document.getElementById('poi-tag');

        function flyToLandmark(lat, lon, name, info) {
            if (isFlying) return;
            isFlying = true;
            controls.enabled = false; // 飛行途中鎖定操作
            poiTag.style.display = 'none';

            coordsReadout.innerText = `目標區域: ${name}`;

            // A. 計算地標與鏡頭目標位置
            const targetSurface = latLonToVector3(lat, lon, earthRadius);
            currentTargetWorldPos = targetSurface.clone();

            // 傾斜俯瞰視角偏移 (Tilt View)
            const tiltOffset = latLonToVector3(lat, lon, 0.25).add(new THREE.Vector3(0, 0.1, 0));
            const targetCamPos = latLonToVector3(lat, lon, earthRadius + 0.12).add(tiltOffset);

            // B. 智慧太陽光追蹤（確保地標永遠處於完美白晝光照下）
            const idealSunPos = latLonToVector3(lat + 15, lon + 25, 120);

            // C. GSAP 多重鏡頭動畫
            gsap.timeline({
                onComplete: () => {
                    isFlying = false;
                    controls.enabled = true; // 釋放控制器
                    controls.autoRotate = isAutoOrbiting; // 啟用自動 360 度旋轉
                    controls.autoRotateSpeed = 0.8;

                    // 顯示 3D 浮動標籤
                    poiTag.innerText = `📍 ${name} (${info})`;
                    poiTag.style.display = 'block';
                }
            })
            .to(camera.position, {
                duration: 2.8,
                x: targetCamPos.x,
                y: targetCamPos.y,
                z: targetCamPos.z,
                ease: "power3.inOut"
            })
            .to(controls.target, {
                duration: 2.8,
                x: targetSurface.x,
                y: targetSurface.y,
                z: targetSurface.z,
                ease: "power3.inOut"
            }, "<")
            .to(sunLight.position, {
                duration: 2.8,
                x: idealSunPos.x,
                y: idealSunPos.y,
                z: idealSunPos.z,
                ease: "power2.inOut"
            }, "<");
        }

        // UI 按鈕事件
        document.querySelectorAll('.btn-landmark').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.btn-landmark').forEach(b => b.classList.remove('active'));
                const targetBtn = e.currentTarget;
                targetBtn.classList.add('active');

                const lat = parseFloat(targetBtn.dataset.lat);
                const lon = parseFloat(targetBtn.dataset.lon);
                const name = targetBtn.dataset.name;
                const info = targetBtn.dataset.info;
                flyToLandmark(lat, lon, name, info);
            });
        });

        // 返回太空視野
        document.getElementById('btn-reset').addEventListener('click', () => {
            document.querySelectorAll('.btn-landmark').forEach(b => b.classList.remove('active'));
            coordsReadout.innerText = "目標區域: 全球檢視";
            isFlying = true;
            controls.enabled = false;
            controls.autoRotate = false;
            poiTag.style.display = 'none';
            currentTargetWorldPos = null;

            gsap.timeline({
                onComplete: () => {
                    isFlying = false;
                    controls.enabled = true;
                }
            })
            .to(camera.position, { duration: 2.2, x: 0, y: 0, z: 22, ease: "power2.inOut" })
            .to(controls.target, { duration: 2.2, x: 0, y: 0, z: 0, ease: "power2.inOut" }, "<")
            .to(sunLight.position, { duration: 2.2, x: 100, y: 30, z: 60, ease: "power2.inOut" }, "<");
        });

        // 切換自動環視按鈕
        const btnAutoOrbit = document.getElementById('btn-auto-orbit');
        btnAutoOrbit.addEventListener('click', () => {
            isAutoOrbiting = !isAutoOrbiting;
            controls.autoRotate = isAutoOrbiting && groundGroup.visible;
            btnAutoOrbit.innerText = `🔄 環視: ${isAutoOrbiting ? '開啟' : '關閉'}`;
        });

        // 7. 更新 3D 懸浮標籤螢幕座標
        function updatePOITagPosition() {
            if (!currentTargetWorldPos || !groundGroup.visible || isFlying) return;

            const tempV = currentTargetWorldPos.clone();
            tempV.project(camera);

            // 當標籤轉到球體背面時隱藏
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(tempV.x, tempV.y), camera);
            const intersects = raycaster.intersectObject(highResEarth);

            if (intersects.length > 0 && intersects[0].distance < camera.position.distanceTo(currentTargetWorldPos) - 0.05) {
                poiTag.style.opacity = '0';
            } else {
                poiTag.style.opacity = '1';
                const x = (tempV.x *  .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;
                poiTag.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
            }
        }

        // 8. 模式動態切換
        const altitudeReadout = document.getElementById('altitude-readout');
        const modeIndicator = document.getElementById('mode-indicator');
        const transitionThreshold = earthRadius + 2.0;

        function updateVisibility(camDistance) {
            const altitudeKM = Math.max(0, ((camDistance - earthRadius) * 1000)).toFixed(1);
            altitudeReadout.innerText = `視角高度: ${altitudeKM} km`;

            if (camDistance > transitionThreshold) {
                spaceGroup.visible = true;
                groundGroup.visible = false;
                scene.fog = null;
                controls.autoRotate = false; // 太空模式不自動環視
                poiTag.style.display = 'none';

                modeIndicator.innerText = "模式: 太空全域 (Space)";
                modeIndicator.style.background = "#0288d1";
            } else {
                spaceGroup.visible = false;
                groundGroup.visible = true;
                scene.fog = new THREE.FogExp2(0x87ceeb, 0.12);

                if (!isFlying && isAutoOrbiting) {
                    controls.autoRotate = true;
                }

                modeIndicator.innerText = "模式: 精細地標近景 (LOD High)";
                modeIndicator.style.background = "#2e7d32";
            }
        }

        // 9. Render Loop
        function animate() {
            requestAnimationFrame(animate);

            const camDistance = camera.position.distanceTo(scene.position);
            updateVisibility(camDistance);

            // 太空緩慢自轉
            if (spaceGroup.visible && !isFlying) {
                earthMesh.rotation.y += 0.0003;
                cloudMesh.rotation.y += 0.0004;
            }

            earthShaderMaterial.uniforms.sunDirection.value.copy(sunLight.position).normalize();

            controls.update();
            updatePOITagPosition();
            renderer.render(scene, camera);
        }

        animate();

        // RWD
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
