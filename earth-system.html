<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 地球與實景導覽系統 (Orbit & Ground Tour)</title>
    <!-- CesiumJS CSS -->
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 導覽主控制面板 */
        .hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 320px;
            padding: 20px;
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 16px;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .hud-title {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .hud-status {
            font-size: 0.75rem;
            color: #00f2fe;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 8px #00f2fe;
        }

        /* 選單按鈕 */
        .tour-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-tour {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-tour:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: #00f2fe;
            transform: translateX(4px);
        }

        .btn-orbit {
            margin-top: 10px;
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            border-color: #00f2fe;
        }

        /* 地標資訊卡片 */
        .story-card {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            width: 360px;
            padding: 20px;
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            color: #f8fafc;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .story-card.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .story-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            background: rgba(0, 242, 254, 0.2);
            color: #00f2fe;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .story-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .story-desc {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div id="cesiumContainer"></div>

    <!-- 主選單面板 -->
    <div class="hud-panel">
        <div class="hud-title">SATELLITE & GROUND TOUR</div>
        <div class="hud-status">
            <span class="status-dot"></span>
            <span id="statusText">太空中：衛星軌道運轉中</span>
        </div>

        <div class="tour-controls">
            <button class="btn-tour" onclick="flyToLocation(0)">
                <span>台北 101 / 信義區 3D</span>
                <small>Taipei 101</small>
            </button>
            <button class="btn-tour" onclick="flyToLocation(1)">
                <span>玉山主峰 3D 地形</span>
                <small>3,952 m</small>
            </button>
            <button class="btn-tour" onclick="flyToLocation(2)">
                <span>高雄流行音樂中心</span>
                <small>Kaohsiung Port</small>
            </button>
            <button class="btn-tour btn-orbit" onclick="returnToOrbit()">
                <span>🚀 返回太空軌道運行</span>
                <small>Orbit View</small>
            </button>
        </div>
    </div>

    <!-- 介紹卡片 -->
    <div id="storyCard" class="story-card">
        <div id="storyTag" class="story-tag">LOCATION</div>
        <div id="storyTitle" class="story-title">地標名稱</div>
        <div id="storyDesc" class="story-desc">地標詳細敘述...</div>
    </div>

    <!-- CesiumJS Library -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
    <script>
        // 1. 初始化 Cesium 視圖
        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: Cesium.createWorldTerrain({ requestWaterMask: true }),
            animation: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            navigationHelpButton: false,
            scene3DOnly: true
        });

        const scene = viewer.scene;
        scene.globe.enableLighting = true; // 開啟光照
        scene.highDynamicRange = true;     // HDR 畫面

        // 2. 自動載入台灣 3D 建築資料 (免 API Key，採用 Cesium OSM 全球 3D 建築)
        async function load3DBuildings() {
            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                scene.primitives.add(buildings);
            } catch (e) {
                console.log("3D 建築載入提示: ", e);
            }
        }
        load3DBuildings();

        // 3. 太空軌道運轉控制 (Orbit Motion Logic)
        let isOrbiting = true;
        const orbitAltitude = 15000000; // 太空軌道高度 (米)
        let lastTime = Date.now();

        // 在太空時自動旋轉地球
        viewer.clock.onTick.addEventListener(() => {
            if (isOrbiting) {
                const now = Date.now();
                const delta = (now - lastTime) / 1000;
                lastTime = now;
                
                // 每秒旋轉相機角度 (模擬衛星視角俯瞰)
                scene.camera.rotate(Cesium.Cartesian3.UNIT_Z, -0.05 * delta);
            }
        });

        // 4. 地標資料庫（降落座標與傾斜俯瞰角度）
        const locations = [
            {
                name: "台北 101 (Taipei 101)",
                tag: "TAIPEI / URBAN 3D",
                desc: "臺灣第一高樓，高度 508 公尺。配合 3D Tiles 建築網格與街道紋理，可清楚俯瞰信義區精細實景。",
                destination: Cesium.Cartesian3.fromDegrees(121.5645, 25.0330, 800),
                orientation: {
                    heading: Cesium.Math.toRadians(330),
                    pitch: Cesium.Math.toRadians(-25),
                    roll: 0
                }
            },
            {
                name: "玉山主峰 (Mt. Jade)",
                tag: "NATURE / TERRAIN 3D",
                desc: "東北亞第一高峰，海拔 3,952 公尺。採用高精度 3D 高程網格，可實地觀賞極具震撼力的山脊陡峭地形。",
                destination: Cesium.Cartesian3.fromDegrees(120.9573, 23.4700, 4800),
                orientation: {
                    heading: Cesium.Math.toRadians(25),
                    pitch: Cesium.Math.toRadians(-20),
                    roll: 0
                }
            },
            {
                name: "高雄流行音樂中心 (KMC)",
                tag: "KAOHSIUNG / HARBOR 3D",
                desc: "座落於高雄港 11-15 號碼頭，具備獨特的海浪與蜂巢建築外型，能清楚觀賞高雄港灣的實景風貌。",
                destination: Cesium.Cartesian3.fromDegrees(120.2930, 22.6180, 600),
                orientation: {
                    heading: Cesium.Math.toRadians(45),
                    pitch: Cesium.Math.toRadians(-30),
                    roll: 0
                }
            }
        ];

        // 5. 飛往地標 (從太空俯衝降落至地面)
        function flyToLocation(index) {
            isOrbiting = false; // 到達地面時停止太空軌道旋轉
            document.getElementById('statusText').innerText = "地面模式：實景導覽中";
            hideCard();

            const loc = locations[index];
            viewer.camera.flyTo({
                destination: loc.destination,
                orientation: loc.orientation,
                duration: 4.0, // 4 秒平滑過渡
                easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT,
                complete: () => {
                    showCard(loc);
                }
            });
        }

        // 6. 返回太空軌道模式
        function returnToOrbit() {
            hideCard();
            document.getElementById('statusText').innerText = "太空中：衛星軌道運轉中";

            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(121.0, 23.5, orbitAltitude),
                orientation: {
                    heading: 0,
                    pitch: Cesium.Math.toRadians(-90), // 垂直俯瞰地球
                    roll: 0
                },
                duration: 3.5,
                easingFunction: Cesium.EasingFunction.QUINTIC_OUT,
                complete: () => {
                    lastTime = Date.now();
                    isOrbiting = true; // 啟動軌道運轉
                }
            });
        }

        // 7. 卡片顯示邏輯
        const card = document.getElementById('storyCard');
        function showCard(data) {
            document.getElementById('storyTag').innerText = data.tag;
            document.getElementById('storyTitle').innerText = data.name;
            document.getElementById('storyDesc').innerText = data.desc;
            card.classList.add('active');
        }
        function hideCard() {
            card.classList.remove('active');
        }

        // 初始設定相機於太空軌道
        returnToOrbit();
    </script>
</body>
</html>
