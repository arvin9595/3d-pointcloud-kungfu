<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth System - Three.js 3D 地球與大氣模擬</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js 與 OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h2>Earth System Simulation</h2>
        <p>拖曳滑鼠旋轉 | 滾輪縮放視角</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 初始化場景、相機與渲染器
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(
            45, 
            window.innerWidth / window.innerHeight, 
            0.1, 
            1000
        );
        camera.position.set(0, 0, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // 2. 控制器設定 (開啟阻尼讓縮放與旋轉更平滑)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 6.5; // 防止相機穿透地表 (地球半徑 6 + 邊界)
        controls.maxDistance = 100;

        // 3. 光源 (模擬太陽光)
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.0);
        sunLight.position.set(50, 10, 30);
        scene.add(sunLight);

        const ambientLight = new THREE.AmbientLight(0x111122, 0.2); // 弱環境光，模擬太空微光
        scene.add(ambientLight);

        // 4. 地球網格 (Earth Mesh)
        const earthRadius = 6;
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 64, 64);
        
        // 使用基礎材質先建立起結構 (後續可替換為自訂 ShaderMaterial)
        const earthMaterial = new THREE.MeshStandardMaterial({
            color: 0x1565c0,
            roughness: 0.7,
            metalness: 0.1
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // 5. 大氣外層光暈 (簡易 Atmosphere Glow Shell)
        const atmosphereGeometry = new THREE.SphereGeometry(earthRadius * 1.15, 64, 64);
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    // Fresnel 效果：計算邊緣光暈
                    float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // 6. 動態渲染迴圈
        function animate() {
            requestAnimationFrame(animate);

            // 地球自轉
            earth.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // 7. 視窗尺寸變更監聽
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
