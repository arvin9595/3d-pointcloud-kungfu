<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Step 1: True 3D Voxel Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #05050a; font-family: -apple-system, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        .panel {
            position: absolute; top: 16px; left: 16px;
            background: rgba(12, 16, 28, 0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 12px;
            padding: 16px; width: 310px; z-index: 10; font-size: 11px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .header { color: #00f0ff; font-weight: bold; margin-bottom: 12px; font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0, 240, 255, 0.2); padding-bottom: 6px; }
        .upload-btn { display: block; width: 100%; padding: 10px; background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000; text-align: center; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 12px; box-shadow: 0 0 10px rgba(0,240,255,0.3); }
        input[type="file"] { display: none; }
        
        .row { margin-bottom: 10px; }
        .row label { display: flex; justify-content: space-between; color: #a0c0d0; margin-bottom: 4px; }
        input[type="range"] { width: 100%; accent-color: #00f0ff; cursor: pointer; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn { background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.3); color: #00f0ff; padding: 8px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 11px; }
        .btn.active { background: #00f0ff; color: #000; font-weight: bold; }
        
        .hint { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #00f0ff; border: 1px solid rgba(0,240,255,0.2); pointer-events: none; }
    </style>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="panel">
        <div class="header">
            <span>STEP 1: 3D VOXEL CUBES</span>
            <span id="fps">60 FPS</span>
        </div>

        <label class="upload-btn">
            📷 選擇照片測試
            <input type="file" id="imgInput" accept="image/*" onchange="loadFile(event)">
        </label>

        <div class="row">
            <label><span>方塊尺寸 (Cube Size)</span><span id="txt-size">1.5</span></label>
            <input type="range" id="sizeVal" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateVoxelSize()">
        </div>

        <div class="row">
            <label><span>3D 浮雕深度 (Depth)</span><span id="txt-depth">1.0x</span></label>
            <input type="range" id="depthVal" min="0" max="3" step="0.1" value="1.0" oninput="updateDepth()">
        </div>

        <div class="btn-grid">
            <button class="btn" onclick="resetCam()">🎯 重置視角</button>
            <button class="btn" id="btn-orbit" onclick="toggleOrbit()">🔄 自動旋轉</button>
        </div>
    </div>

    <div class="hint">🖱️ 滑鼠滾輪可推進穿越方塊 | 觀察近看時方塊的側面光影與銳利邊界</div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050a, 0.001);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 250);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = -300;

        // 💡 關鍵：加入真實光影（讓方塊側面有明暗變化）
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 150, 200);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(600, 30, 0x00f0ff, 0x112244);
        gridHelper.position.y = -120;
        scene.add(gridHelper);

        let instancedMesh = null;
        let baseData = []; // 儲存方塊原始座標與色彩數據
        let depthScale = 1.0;
        let cubeSize = 1.5;

        // 建立預設文字畫面
        function initDefault() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 180; canvas.height = 80;
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('3D VOXEL TEST', 90, 45);
            
            const imgData = ctx.getImageData(0, 0, 180, 80);
            buildVoxelMesh(imgData, 180, 80);
        }

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function processImage(img) {
            const maxDim = 180; // 測試階段採用精準採樣
            let iw = img.width, ih = img.height;
            if (iw > maxDim || ih > maxDim) {
                if (iw > ih) { ih = Math.round((ih * maxDim) / iw); iw = maxDim; }
                else { iw = Math.round((iw * maxDim) / ih); ih = maxDim; }
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = iw; canvas.height = ih;
            ctx.drawImage(img, 0, 0, iw, ih);

            const imgData = ctx.getImageData(0, 0, iw, ih);
            buildVoxelMesh(imgData, iw, ih);
        }

        function buildVoxelMesh(imgData, iw, ih) {
            if (instancedMesh) scene.remove(instancedMesh);

            const data = imgData.data;
            baseData = [];
            const cx = iw / 2, cy = ih / 2;

            for (let y = 0; y < ih; y += 2) {
                for (let x = 0; x < iw; x += 2) {
                    const idx = (y * iw + x) * 4;
                    const r = data[idx] / 255;
                    const g = data[idx+1] / 255;
                    const b = data[idx+2] / 255;
                    const a = data[idx+3] / 255;

                    if (a > 0.2) {
                        const brightness = r * 0.299 + g * 0.587 + b * 0.114;
                        const baseZ = (Math.pow(brightness, 1.3) - 0.5) * 80;

                        baseData.push({
                            x: (x - cx) * 1.8,
                            y: -(y - cy) * 1.8,
                            baseZ: baseZ,
                            color: new THREE.Color(r, g, b)
                        });
                    }
                }
            }

            const count = baseData.length;
            // 💡 關鍵：採用 InstancedMesh 繪製真實的 3D 立體 Cube
            const geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
            const material = new THREE.MeshStandardMaterial({
                roughness: 0.4,
                metalness: 0.1
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, count);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < count; i++) {
                const item = baseData[i];
                dummy.position.set(item.x, item.y, item.baseZ * depthScale);
                dummy.updateMatrix();

                instancedMesh.setMatrixAt(i, dummy.matrix);
                instancedMesh.setColorAt(i, item.color);
            }

            instancedMesh.instanceMatrix.needsUpdate = true;
            if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;

            scene.add(instancedMesh);
        }

        function updateVoxelSize() {
            cubeSize = parseFloat(document.getElementById('sizeVal').value);
            document.getElementById('txt-size').innerText = cubeSize.toFixed(1);
            if (instancedMesh) {
                instancedMesh.geometry.dispose();
                instancedMesh.geometry = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
            }
        }

        function updateDepth() {
            depthScale = parseFloat(document.getElementById('depthVal').value);
            document.getElementById('txt-depth').innerText = depthScale.toFixed(1) + 'x';

            if (!instancedMesh) return;
            const dummy = new THREE.Object3D();
            for (let i = 0; i < baseData.length; i++) {
                const item = baseData[i];
                dummy.position.set(item.x, item.y, item.baseZ * depthScale);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
        }

        function resetCam() {
            camera.position.set(0, 0, 250);
            controls.target.set(0, 0, 0);
        }

        function toggleOrbit() {
            controls.autoRotate = !controls.autoRotate;
            controls.autoRotateSpeed = 2.0;
            document.getElementById('btn-orbit').classList.toggle('active', controls.autoRotate);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initDefault();

        let lastTime = performance.now(), frameCount = 0;
        function animate(now) {
            requestAnimationFrame(animate);

            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = frameCount + ' FPS';
                frameCount = 0; lastTime = now;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);
    </script>
</body>
</html>
