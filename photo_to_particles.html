<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Photo to Particle Cloud</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        .studio-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(10, 10, 14, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px;
            width: 320px;
            max-height: calc(100vh - 30px);
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            transition: opacity 0.3s;
        }
        .studio-header {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #00f0ff;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .section-title {
            font-size: 10px;
            font-weight: bold;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0 5px 0;
        }
        .file-upload-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00f0ff, #0077ff);
            color: #000;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .file-upload-btn:active {
            transform: scale(0.98);
        }
        input[type="file"] {
            display: none;
        }
        .control-group {
            margin-bottom: 8px;
        }
        .control-label {
            font-size: 10px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #00f0ff;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 5px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover, .btn.active {
            background: #00f0ff;
            color: #000000;
            font-weight: bold;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            font-size: 10px;
            color: #aaa;
            font-family: monospace;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .stat-val {
            color: #00ffcc;
            font-weight: bold;
        }
        .nav-link {
            display: block;
            text-align: center;
            color: #00f0ff;
            font-size: 10px;
            margin-top: 10px;
            text-decoration: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="studio-panel" id="studioPanel">
        <div class="studio-header">
            <span>📷 PHOTO 3D CLOUD</span>
            <span id="fps" style="color: #00ffcc;">60 FPS</span>
        </div>

        <label class="file-upload-btn">
            選擇/拍攝照片轉換 3D 粒子
            <input type="file" id="imageLoader" accept="image/*" onchange="handleImage(event)">
        </label>

        <div class="section-title">3D 粒子調整 (Controls)</div>
        
        <div class="control-group">
            <div class="control-label"><span>立體深度強度 (Depth)</span><span id="val-depth">1.0x</span></div>
            <input type="range" id="sliderDepth" min="0" max="3" step="0.1" value="1.0" oninput="updateDepth()">
        </div>

        <div class="control-group">
            <div class="control-label"><span>粒子採樣密度 (Density)</span><span id="val-density">中等</span></div>
            <input type="range" id="sliderDensity" min="2" max="6" step="1" value="3" onchange="reloadParticles()">
        </div>

        <div class="section-title">動態特效 (Effects)</div>
        <div class="btn-grid">
            <button class="btn" onclick="triggerExplode()">粒子爆發</button>
            <button class="btn" onclick="resetParticles()">重組原圖</button>
            <button class="btn" id="btn-orbit" onclick="toggleOrbit()">自動旋轉: 關</button>
            <button class="btn" onclick="takeScreenshot()">快照下載</button>
        </div>

        <div class="stat-box">
            <div class="stat-line"><span>總粒子數量:</span> <span class="stat-val" id="stat-count">0</span></div>
            <div class="stat-line"><span>圖片解析度:</span> <span class="stat-val" id="stat-res">無</span></div>
        </div>

        <a href="studio.html" class="nav-link">➔ 切換回 3D 武術點雲模式 (studio.html)</a>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        let loadedImage = null;
        let particles = [];
        let rotX = 0, rotY = 0;
        let targetRotX = 0, targetRotY = 0;
        let isOrbiting = false;
        let depthScale = 1.0;
        let isExploded = false;

        // 觸控與滑鼠拖拽鏡頭旋轉
        let isDragging = false;
        let lastTouchX = 0, lastTouchY = 0;

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#studioPanel')) return;
            isDragging = true;
            lastTouchX = e.clientX;
            lastTouchY = e.clientY;
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastTouchX;
            const dy = e.clientY - lastTouchY;
            targetRotY += dx * 0.005;
            targetRotX += dy * 0.005;
            lastTouchX = e.clientX;
            lastTouchY = e.clientY;
        });

        window.addEventListener('pointerup', () => isDragging = false);

        // 預設建立文字預覽粒子
        function createDefaultTextParticles() {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 200; tempCanvas.height = 100;
            tCtx.fillStyle = '#ffffff';
            tCtx.font = 'bold 24px sans-serif';
            tCtx.textAlign = 'center';
            tCtx.fillText('請選擇照片', 100, 55);

            const imgData = tCtx.getImageData(0, 0, 200, 100);
            processImageData(imgData, 200, 100, 2);
        }

        function handleImage(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    loadedImage = img;
                    reloadParticles();
                }
                img.src = event.target.result;
            }
            if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        }

        function reloadParticles() {
            if (!loadedImage) {
                createDefaultTextParticles();
                return;
            }
            const step = parseInt(document.getElementById('sliderDensity').value);
            const stepNames = {2: '超高', 3: '高', 4: '中等', 5: '低', 6: '極低'};
            document.getElementById('val-density').innerText = stepNames[step] || '中等';

            const maxDim = 300;
            let w = loadedImage.width;
            let h = loadedImage.height;
            if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }

            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = w;
            tempCanvas.height = h;
            tCtx.drawImage(loadedImage, 0, 0, w, h);

            const imgData = tCtx.getImageData(0, 0, w, h);
            document.getElementById('stat-res').innerText = `${w} x ${h}`;
            processImageData(imgData, w, h, step);
        }

        function processImageData(imgData, w, h, step) {
            particles = [];
            const data = imgData.data;
            const cx = w / 2;
            const cy = h / 2;

            for (let y = 0; y < h; y += step) {
                for (let x = 0; x < w; x += step) {
                    const idx = (y * w + x) * 4;
                    const r = data[idx];
                    const g = data[idx + 1];
                    const b = data[idx + 2];
                    const a = data[idx + 3];

                    if (a > 50) {
                        const brightness = (r + g + b) / 3;
                        const baseZ = (brightness - 128) * 0.8; // 亮度決定深淺

                        const originX = (x - cx) * 2;
                        const originY = (y - cy) * 2;
                        const originZ = baseZ;

                        particles.push({
                            x: originX, y: originY, z: originZ,
                            ox: originX, oy: originY, oz: originZ,
                            vx: 0, vy: 0, vz: 0,
                            baseZ: baseZ,
                            color: `rgb(${r},${g},${b})`
                        });
                    }
                }
            }
            document.getElementById('stat-count').innerText = particles.length.toLocaleString();
            isExploded = false;
        }

        function updateDepth() {
            depthScale = parseFloat(document.getElementById('sliderDepth').value);
            document.getElementById('val-depth').innerText = `${depthScale.toFixed(1)}x`;
            particles.forEach(p => {
                p.oz = p.baseZ * depthScale;
                if (!isExploded) p.z = p.oz;
            });
        }

        function triggerExplode() {
            isExploded = true;
            particles.forEach(p => {
                p.vx = (Math.random() - 0.5) * 25;
                p.vy = (Math.random() - 0.5) * 25;
                p.vz = (Math.random() - 0.5) * 25;
            });
        }

        function resetParticles() {
            isExploded = false;
            particles.forEach(p => {
                p.vx = 0; p.vy = 0; p.vz = 0;
            });
        }

        function toggleOrbit() {
            isOrbiting = !isOrbiting;
            const btn = document.getElementById('btn-orbit');
            btn.innerText = `自動旋轉: ${isOrbiting ? '開' : '關'}`;
            btn.classList.toggle('active', isOrbiting);
        }

        function takeScreenshot() {
            const link = document.createElement('a');
            link.download = `3D_Photo_Particles_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        createDefaultTextParticles();

        // 繪製與動畫迴圈
        let lastTime = performance.now();
        let frameCount = 0;

        function animate(now) {
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            if (isOrbiting) targetRotY += 0.008;

            rotX += (targetRotX - rotX) * 0.1;
            rotY += (targetRotY - rotY) * 0.1;

            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const renderList = [];
            const len = particles.length;

            for (let i = 0; i < len; i++) {
                const p = particles[i];

                if (isExploded) {
                    p.x += p.vx; p.y += p.vy; p.z += p.vz;
                    p.vx *= 0.95; p.vy *= 0.95; p.vz *= 0.95;
                } else {
                    p.x += (p.ox - p.x) * 0.1;
                    p.y += (p.oy - p.y) * 0.1;
                    p.z += (p.oz - p.z) * 0.1;
                }

                // 3D 旋轉矩陣計算
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.z * cosY + p.x * sinY;
                let y2 = p.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + p.y * sinX;

                const fov = 400;
                const scale = fov / (fov + z2 + 400);

                if (scale > 0) {
                    renderList.push({
                        px: width / 2 + x1 * scale,
                        py: height / 2 + y2 * scale,
                        size: Math.max(0.8, 2.5 * scale),
                        z: z2,
                        color: p.color
                    });
                }
            }

            // 深度排序
            renderList.sort((a, b) => b.z - a.z);

            // 渲染粒子
            const rLen = renderList.length;
            for (let i = 0; i < rLen; i++) {
                const item = renderList[i];
                ctx.fillStyle = item.color;
                ctx.fillRect(item.px - item.size / 2, item.py - item.size / 2, item.size, item.size);
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
