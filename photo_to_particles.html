<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Photo Particle Cloud - Cinematic Camera</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #020205; font-family: -apple-system, sans-serif; color: #fff; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        .panel {
            position: absolute; top: 12px; left: 12px;
            background: rgba(10, 10, 18, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px;
            padding: 14px; width: 310px; z-index: 10; font-size: 11px;
        }
        .header { color: #00f0ff; font-weight: bold; margin-bottom: 10px; font-size: 12px; display: flex; justify-content: space-between; }
        .upload-btn { display: block; width: 100%; padding: 8px; background: #00f0ff; color: #000; text-align: center; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
        input[type="file"] { display: none; }
        .row { margin-bottom: 8px; }
        .row label { display: flex; justify-content: space-between; color: #aaa; margin-bottom: 3px; }
        input[type="range"] { width: 100%; accent-color: #00f0ff; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn.active { background: #00f0ff; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header">
            <span>🎥 CINEMATIC CAMERA 3D</span>
            <span id="fps">60 FPS</span>
        </div>

        <label class="upload-btn">
            選擇照片載入粒子
            <input type="file" id="imgInput" accept="image/*" onchange="loadFile(event)">
        </label>

        <div class="row">
            <label><span>鏡頭運鏡距離 (Zoom)</span><span id="txt-zoom">100%</span></label>
            <input type="range" id="zoomVal" min="50" max="600" value="300" oninput="updateCam()">
        </div>

        <div class="row">
            <label><span>近看粒子大小 (Particle Size)</span><span id="txt-size">2.5px</span></label>
            <input type="range" id="sizeVal" min="1" max="8" step="0.5" value="2.5" oninput="draw()">
        </div>

        <div class="row">
            <label><span>3D 立體深度 (Depth)</span><span id="txt-depth">1.0x</span></label>
            <input type="range" id="depthVal" min="0" max="3" step="0.1" value="1.0" oninput="updateDepth()">
        </div>

        <div class="btn-grid">
            <button class="btn active" id="btn-shape" onclick="toggleShape()">粒子形狀: 圓形</button>
            <button class="btn" id="btn-orbit" onclick="toggleOrbit()">自動電影運鏡: 關</button>
        </div>
    </div>

    <canvas id="cvs"></canvas>

    <script>
        const canvas = document.getElementById('cvs');
        const ctx = canvas.getContext('2d');

        let w, h;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        resize();
        window.addEventListener('resize', resize);

        let img = null;
        let particles = [];
        let rotX = 0, rotY = 0;
        let targetRotX = 0, targetRotY = 0;
        let camZ = 300;
        let targetCamZ = 300;
        let isOrbiting = false;
        let useCircle = true;
        let depthScale = 1.0;

        // 手勢與滑鼠操作
        let isDrag = false, lx = 0, ly = 0, pinchDist = 0;

        window.addEventListener('mousedown', e => { if (!e.target.closest('.panel')) { isDrag = true; lx = e.clientX; ly = e.clientY; } });
        window.addEventListener('mousemove', e => {
            if (!isDrag) return;
            targetRotY += (e.clientX - lx) * 0.005;
            targetRotX += (e.clientY - ly) * 0.005;
            lx = e.clientX; ly = e.clientY;
        });
        window.addEventListener('mouseup', () => isDrag = false);

        window.addEventListener('wheel', e => {
            if (e.target.closest('.panel')) return;
            targetCamZ = Math.max(30, Math.min(800, targetCamZ + e.deltaY * 0.4));
            document.getElementById('zoomVal').value = targetCamZ;
            updateCam();
        });

        // Touch 支持
        window.addEventListener('touchstart', e => {
            if (e.target.closest('.panel')) return;
            if (e.touches.length === 1) { isDrag = true; lx = e.touches[0].clientX; ly = e.touches[0].clientY; }
            else if (e.touches.length === 2) {
                pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            }
        });

        window.addEventListener('touchmove', e => {
            if (e.target.closest('.panel')) return;
            if (e.touches.length === 1 && isDrag) {
                targetRotY += (e.touches[0].clientX - lx) * 0.005;
                targetRotX += (e.touches[0].clientY - ly) * 0.005;
                lx = e.touches[0].clientX; ly = e.touches[0].clientY;
            } else if (e.touches.length === 2 && pinchDist) {
                let d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                targetCamZ = Math.max(30, Math.min(800, targetCamZ + (pinchDist - d) * 1.2));
                pinchDist = d;
                document.getElementById('zoomVal').value = targetCamZ;
                updateCam();
            }
        });
        window.addEventListener('touchend', () => isDrag = false);

        function loadFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = event => {
                img = new Image();
                img.onload = () => buildParticles();
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function buildParticles() {
            if (!img) return;
            const maxDim = 220; // 粒子採樣精度
            let iw = img.width, ih = img.height;
            if (iw > maxDim || ih > maxDim) {
                if (iw > ih) { ih = Math.round((ih * maxDim) / iw); iw = maxDim; }
                else { iw = Math.round((iw * maxDim) / ih); ih = maxDim; }
            }

            const tmp = document.createElement('canvas');
            const tctx = tmp.getContext('2d');
            tmp.width = iw; tmp.height = ih;
            tctx.drawImage(img, 0, 0, iw, ih);

            const data = tctx.getImageData(0, 0, iw, ih).data;
            particles = [];
            const cx = iw / 2, cy = ih / 2;

            for (let y = 0; y < ih; y += 2) {
                for (let x = 0; x < iw; x += 2) {
                    const idx = (y * iw + x) * 4;
                    const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
                    if (a > 40) {
                        const bright = (r + g + b) / 3;
                        const z = (bright - 128) * 0.8;
                        particles.push({
                            x: (x - cx) * 2.2,
                            y: (y - cy) * 2.2,
                            z: z,
                            baseZ: z,
                            color: `rgb(${r},${g},${b})`
                        });
                    }
                }
            }
        }

        function updateCam() {
            targetCamZ = parseFloat(document.getElementById('zoomVal').value);
            document.getElementById('txt-zoom').innerText = `${Math.round((300 / targetCamZ) * 100)}%`;
        }

        function updateDepth() {
            depthScale = parseFloat(document.getElementById('depthVal').value);
            document.getElementById('txt-depth').innerText = `${depthScale.toFixed(1)}x`;
            particles.forEach(p => p.z = p.baseZ * depthScale);
        }

        function toggleShape() {
            useCircle = !useCircle;
            const btn = document.getElementById('btn-shape');
            btn.innerText = `粒子形狀: ${useCircle ? '圓形' : '方形'}`;
        }

        function toggleOrbit() {
            isOrbiting = !isOrbiting;
            document.getElementById('btn-orbit').classList.toggle('active', isOrbiting);
            document.getElementById('btn-orbit').innerText = `自動電影運鏡: ${isOrbiting ? '開' : '關'}`;
        }

        // 初始化預設文字粒子
        function initDefault() {
            const tmp = document.createElement('canvas');
            const tctx = tmp.getContext('2d');
            tmp.width = 200; tmp.height = 100;
            tctx.fillStyle = '#fff';
            tctx.font = 'bold 22px sans-serif';
            tctx.textAlign = 'center';
            tctx.fillText('載入照片試試看', 100, 55);
            const data = tctx.getImageData(0, 0, 200, 100).data;
            particles = [];
            for(let y=0; y<100; y+=2) {
                for(let x=0; x<200; x+=2) {
                    let i = (y*200+x)*4;
                    if(data[i+3]>100) {
                        particles.push({
                            x: (x-100)*2, y: (y-50)*2, z: 0, baseZ: 0,
                            color: '#00f0ff'
                        });
                    }
                }
            }
        }
        initDefault();

        let lastT = performance.now(), frames = 0;

        function render(now) {
            frames++;
            if (now - lastT >= 1000) {
                document.getElementById('fps').innerText = `${frames} FPS`;
                frames = 0; lastT = now;
            }

            if (isOrbiting) targetRotY += 0.006;

            rotX += (targetRotX - rotX) * 0.08;
            rotY += (targetRotY - rotY) * 0.08;
            camZ += (targetCamZ - camZ) * 0.08;

            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, w, h);

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            const fov = 350; // Blender 透視焦距
            const baseSize = parseFloat(document.getElementById('sizeVal').value);
            document.getElementById('txt-size').innerText = `${baseSize}px`;

            const renderList = [];

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                // 3D 旋轉變換
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.z * cosY + p.x * sinY;
                let y2 = p.y * cosX - z1 * sinX;
                let z2 = z1 * cosX + p.y * sinX;

                // 鏡頭運鏡距離計算
                const dist = fov + z2 + camZ;
                if (dist > 10) { // 避免剪裁平面問題
                    const scale = fov / dist;
                    renderList.push({
                        px: w / 2 + x1 * scale,
                        py: h / 2 + y2 * scale,
                        // 關鍵：根據透視比例放大粒子，近看時會變得很巨大清晰
                        size: Math.max(0.5, baseSize * scale * 1.8),
                        z: z2,
                        color: p.color
                    });
                }
            }

            // 排序 (Z-buffer) 確保近處粒子遮擋遠處粒子
            renderList.sort((a, b) => b.z - a.z);

            for (let i = 0; i < renderList.length; i++) {
                const item = renderList[i];
                ctx.fillStyle = item.color;

                if (useCircle) {
                    ctx.beginPath();
                    ctx.arc(item.px, item.py, item.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(item.px - item.size / 2, item.py - item.size / 2, item.size * 2, item.size * 2);
                }
            }

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
