<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Studio - 階段 3：Prompt 指令與電影平滑鏡頭</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        .studio-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(12, 12, 14, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px;
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .studio-header {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #00f0ff;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .section-title {
            font-size: 10px;
            font-weight: bold;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 12px 0 6px 0;
        }
        .prompt-box {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .prompt-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px;
            color: #ffffff;
            font-size: 11px;
            outline: none;
        }
        .prompt-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 7px 6px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover, .btn.active {
            background: #00f0ff;
            color: #000000;
            font-weight: bold;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-size: 10px;
            color: #aaa;
            font-family: monospace;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .stat-val {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="studio-panel">
        <div class="studio-header">
            <span>🎬 STUDIO - PHASE 3</span>
            <span id="fps" style="color: #00ffcc;">60 FPS</span>
        </div>

        <div class="section-title">自然語言 Prompt 指令輸入</div>
        <div class="prompt-box">
            <input type="text" id="promptInput" class="prompt-input" placeholder="例如：切換雙人詠春對打、拉近鏡頭" onkeydown="if(event.key==='Enter') processPrompt()">
            <button class="btn" style="width: 60px;" onclick="processPrompt()">解析</button>
        </div>

        <div class="section-title">電影級鏡頭位移 (LERP Camera)</div>
        <div class="btn-grid">
            <button class="btn active" id="btn-cam-front" onclick="setCameraPreset('front')">正面前景</button>
            <button class="btn" id="btn-cam-side" onclick="setCameraPreset('side')">45度特寫</button>
            <button class="btn" id="btn-cam-top" onclick="setCameraPreset('top')">俯瞰視角</button>
            <button class="btn" id="btn-cam-orbit" onclick="toggleOrbit()">動態環繞: 關</button>
        </div>

        <div class="section-title">演武模式與對決 (Battle Mode)</div>
        <div class="btn-grid">
            <button class="btn active" id="btn-mode-1" onclick="setSceneMode('single')">單人單獨演武</button>
            <button class="btn" id="btn-mode-2" onclick="setSceneMode('duel')">雙人近身攻防</button>
            <button class="btn" id="btn-mode-3" onclick="setSceneMode('trio')" style="grid-column: span 2;">三方陣列對攻</button>
        </div>

        <div class="section-title">效能與鏡頭監控 (System Status)</div>
        <div class="stat-box">
            <div class="stat-line"><span>總渲染粒子數:</span> <span class="stat-val" id="stat-total-particles">1,800</span></div>
            <div class="stat-line"><span>鏡頭縮放比例:</span> <span class="stat-val" id="stat-cam-zoom">1.00x</span></div>
            <div class="stat-line"><span>Prompt 解析狀態:</span> <span class="stat-val" id="stat-prompt-status" style="color:#00f0ff;">Ready</span></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, autoFitScale = 1.0;
        function updateScreenDimensions() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            autoFitScale = Math.min(width, height) / 450;
        }
        updateScreenDimensions();

        const BONES = [
            { from: 0, to: 1, radius: 18 }, { from: 1, to: 2, radius: 28 }, { from: 2, to: 3, radius: 24 },
            { from: 2, to: 4, radius: 14 }, { from: 4, to: 5, radius: 11 }, { from: 5, to: 6, radius: 9 },
            { from: 2, to: 7, radius: 14 }, { from: 7, to: 8, radius: 11 }, { from: 8, to: 9, radius: 9 },
            { from: 3, to: 10, radius: 18 }, { from: 10, to: 11, radius: 14 }, { from: 11, to: 12, radius: 10 },
            { from: 3, to: 13, radius: 18 }, { from: 13, to: 14, radius: 14 }, { from: 14, to: 15, radius: 10 }
        ];

        // -------------------------------------------------------------
        // 電影級平滑鏡頭系統 (LERP Camera Controller)
        // -------------------------------------------------------------
        class CameraController {
            constructor() {
                this.rotX = 0.1;
                this.rotY = 0;
                this.zoom = 1.0;

                this.targetRotX = 0.1;
                this.targetRotY = 0;
                this.targetZoom = 1.0;

                this.isOrbiting = false;
                this.orbitSpeed = 0.008;
            }

            update(now) {
                if (this.isOrbiting) {
                    this.targetRotY += this.orbitSpeed;
                }

                // LERP 平滑插值演算法 (柔和逼近目標值)
                this.rotX += (this.targetRotX - this.rotX) * 0.08;
                this.rotY += (this.targetRotY - this.rotY) * 0.08;
                this.zoom += (this.targetZoom - this.zoom) * 0.08;

                updateCameraMatrix(this.rotX, this.rotY);
                document.getElementById('stat-cam-zoom').innerText = `${this.zoom.toFixed(2)}x`;
            }

            setPreset(preset) {
                this.isOrbiting = false;
                document.getElementById('btn-cam-orbit').innerText = "動態環繞: 關";
                document.getElementById('btn-cam-orbit').classList.remove('active');

                if (preset === 'front') {
                    this.targetRotX = 0.1;
                    this.targetRotY = 0;
                    this.targetZoom = 1.0;
                } else if (preset === 'side') {
                    this.targetRotX = 0.15;
                    this.targetRotY = 0.75;
                    this.targetZoom = 1.25;
                } else if (preset === 'top') {
                    this.targetRotX = 0.85;
                    this.targetRotY = 0;
                    this.targetZoom = 0.9;
                }
            }
        }
        const camera = new CameraController();

        // Spark 火花系統
        class SparkEffect {
            constructor() { this.sparks = []; }
            trigger(x, y, z, color = '#ffffff') {
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 3 + Math.random() * 5;
                    this.sparks.push({
                        x, y, z,
                        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, vz: (Math.random() - 0.5) * speed,
                        life: 1.0, color
                    });
                }
            }
            update() {
                for (let i = this.sparks.length - 1; i >= 0; i--) {
                    const s = this.sparks[i];
                    s.x += s.vx; s.y += s.vy; s.z += s.vz;
                    s.life -= 0.05;
                    if (s.life <= 0) this.sparks.splice(i, 1);
                }
            }
        }
        const globalSparks = new SparkEffect();

        // Actor 類別
        class Actor {
            constructor(id, offsetX = 0, color = '#00f0ff', style = 'boxing') {
                this.id = id;
                this.offsetX = offsetX;
                this.color = color;
                this.style = style;
                this.particleCount = 1800;
                this.joints = Array.from({ length: 16 }, () => ({ x: 0, y: 0, z: 0 }));
                this.particles = [];
                this.hitCooldown = 0;
                this.initParticles();
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        boneIndex: Math.floor(Math.random() * BONES.length),
                        u: Math.random(),
                        theta: Math.random() * Math.PI * 2,
                        rRatio: Math.sqrt(Math.random()),
                        x: 0, y: 0, z: 0
                    });
                }
            }

            update(time, phaseShift = 0) {
                if (this.hitCooldown > 0) this.hitCooldown--;
                const t = time + phaseShift;
                const joints = this.joints;
                const ox = this.offsetX;
                const bob = Math.sin(t * 5) * 10;

                if (this.style === 'boxing') {
                    const punch = Math.sin(t * 7) * 55;
                    joints[3] = { x: ox, y: 20 + bob, z: 0 };
                    joints[2] = { x: ox, y: -50 + bob, z: 0 };
                    joints[1] = { x: ox, y: -80 + bob, z: 0 };
                    joints[0] = { x: ox, y: -105 + bob, z: 0 };

                    joints[4] = { x: ox - 25, y: -45, z: 15 };
                    joints[5] = { x: ox - 20, y: -25, z: 30 + punch };
                    joints[6] = { x: ox - 15, y: -35, z: 55 + punch * 1.2 };

                    joints[7] = { x: ox + 25, y: -45, z: 15 };
                    joints[8] = { x: ox + 18, y: -20, z: 20 };
                    joints[9] = { x: ox + 10, y: -30, z: 35 };
                } else if (this.style === 'wingchun') {
                    const chainPunch = Math.cos(t * 12) * 35;
                    joints[3] = { x: ox, y: 15 + bob, z: 0 };
                    joints[2] = { x: ox, y: -50 + bob, z: 0 };
                    joints[1] = { x: ox, y: -80 + bob, z: 0 };
                    joints[0] = { x: ox, y: -105 + bob, z: 0 };

                    joints[4] = { x: ox - 18, y: -45, z: 20 };
                    joints[5] = { x: ox - 10, y: -35, z: 40 + chainPunch };
                    joints[6] = { x: ox - 5, y: -35, z: 65 + chainPunch };

                    joints[7] = { x: ox + 18, y: -45, z: 20 };
                    joints[8] = { x: ox + 10, y: -35, z: 40 - chainPunch };
                    joints[9] = { x: ox + 5, y: -35, z: 65 - chainPunch };
                }

                joints[10] = { x: ox - 20, y: joints[3].y + 15, z: 0 };
                joints[11] = { x: ox - 25, y: joints[10].y + 50, z: 20 };
                joints[12] = { x: ox - 25, y: joints[11].y + 50, z: 0 };

                joints[13] = { x: ox + 20, y: joints[3].y + 15, z: 0 };
                joints[14] = { x: ox + 25, y: joints[13].y + 50, z: -20 };
                joints[15] = { x: ox + 25, y: joints[14].y + 50, z: 0 };

                const len = this.particles.length;
                for (let i = 0; i < len; i++) {
                    const p = this.particles[i];
                    const bone = BONES[p.boneIndex];
                    const jA = joints[bone.from];
                    const jB = joints[bone.to];

                    const cx = jA.x + (jB.x - jA.x) * p.u;
                    const cy = jA.y + (jB.y - jA.y) * p.u;
                    const cz = jA.z + (jB.z - jA.z) * p.u;

                    const r = bone.radius * p.rRatio;
                    p.x = cx + Math.cos(p.theta) * r;
                    p.y = cy + Math.sin(p.theta) * r;
                    p.z = cz + Math.sin(p.theta * 2) * (r * 0.5);
                }
            }
        }

        // 矩陣快取與投影
        let cachedCosX = 1, cachedSinX = 0, cachedCosY = 1, cachedSinY = 0;
        function updateCameraMatrix(rx, ry) {
            cachedCosX = Math.cos(rx); cachedSinX = Math.sin(rx);
            cachedCosY = Math.cos(ry); cachedSinY = Math.sin(ry);
        }

        function project3DFast(x, y, z) {
            let x1 = x * cachedCosY - z * cachedSinY;
            let z1 = z * cachedCosY + x * cachedSinY;
            let y2 = y * cachedCosX - z1 * cachedSinX;
            let z2 = z1 * cachedCosX + y * cachedSinX;

            const fov = 400;
            const scale = (fov / (fov + z2 + 480)) * autoFitScale * camera.zoom;
            return {
                x: width / 2 + x1 * scale,
                y: height / 2 + y2 * scale,
                scale: scale,
                z: z2
            };
        }

        // 碰撞檢測
        function checkHits(actors) {
            if (actors.length < 2) return;
            const threshold = 40;
            for (let i = 0; i < actors.length; i++) {
                for (let j = i + 1; j < actors.length; j++) {
                    const a1 = actors[i], a2 = actors[j];
                    if (a1.hitCooldown > 0 || a2.hitCooldown > 0) continue;

                    const fists1 = [a1.joints[6], a1.joints[9]];
                    const fists2 = [a2.joints[6], a2.joints[9]];

                    for (let f1 of fists1) {
                        for (let f2 of fists2) {
                            const dx = f1.x - f2.x; const dy = f1.y - f2.y; const dz = f1.z - f2.z;
                            if (dx * dx + dy * dy + dz * dz < threshold * threshold) {
                                globalSparks.trigger((f1.x + f2.x) / 2, (f1.y + f2.y) / 2, (f1.z + f2.z) / 2);
                                a1.hitCooldown = 12; a2.hitCooldown = 12;
                            }
                        }
                    }
                }
            }
        }

        // 場景與模式
        let activeActors = [];
        let currentSceneMode = 'single';
        let currentMotionStyle = 'boxing';

        function rebuildScene() {
            activeActors = [];
            if (currentSceneMode === 'single') {
                activeActors.push(new Actor(1, 0, '#00f0ff', currentMotionStyle));
            } else if (currentSceneMode === 'duel') {
                activeActors.push(new Actor(1, -45, '#00f0ff', currentMotionStyle));
                activeActors.push(new Actor(2, 45, '#ff2a5f', currentMotionStyle));
            } else if (currentSceneMode === 'trio') {
                activeActors.push(new Actor(1, -90, '#00f0ff', currentMotionStyle));
                activeActors.push(new Actor(2, 0, '#00ff66', currentMotionStyle));
                activeActors.push(new Actor(3, 90, '#ff2a5f', currentMotionStyle));
            }
            document.getElementById('stat-total-particles').innerText = (activeActors.length * 1800).toLocaleString();
        }
        rebuildScene();

        // -------------------------------------------------------------
        // 自然語言 Prompt 解析器 (Natural Language Prompt Engine)
        // -------------------------------------------------------------
        window.processPrompt = function() {
            const input = document.getElementById('promptInput').value.trim();
            const statusEl = document.getElementById('stat-prompt-status');
            if (!input) return;

            let logs = [];

            // 模式意圖提取
            if (input.includes('雙人') || input.includes('對打') || input.includes('攻防')) {
                setSceneMode('duel');
                logs.push('切換雙人');
            } else if (input.includes('三人') || input.includes('三角色') || input.includes('陣列')) {
                setSceneMode('trio');
                logs.push('切換三人');
            } else if (input.includes('單人') || input.includes('獨演')) {
                setSceneMode('single');
                logs.push('切換單人');
            }

            // 招式意圖提取
            if (input.includes('詠春')) {
                setMotionStyle('wingchun');
                logs.push('詠春拳');
            } else if (input.includes('拳擊') || input.includes('西洋')) {
                setMotionStyle('boxing');
                logs.push('西洋拳擊');
            }

            // 鏡頭意圖提取
            if (input.includes('放大') || input.includes('拉近') || input.includes('特寫')) {
                camera.targetZoom = 1.4;
                logs.push('鏡頭拉近');
            } else if (input.includes('縮小') || input.includes('拉遠') || input.includes('全景')) {
                camera.targetZoom = 0.8;
                logs.push('鏡頭拉遠');
            } else if (input.includes('旋轉') || input.includes('環繞')) {
                if (!camera.isOrbiting) toggleOrbit();
                logs.push('環繞鏡頭');
            } else if (input.includes('正面')) {
                setCameraPreset('front');
                logs.push('正面視角');
            } else if (input.includes('俯瞰')) {
                setCameraPreset('top');
                logs.push('俯瞰視角');
            }

            if (logs.length > 0) {
                statusEl.innerText = `已執行: ${logs.join(' + ')}`;
                statusEl.style.color = '#00ffcc';
            } else {
                statusEl.innerText = '未識別指令';
                statusEl.style.color = '#ff2a5f';
            }
        };

        // UI 鏡頭指令
        window.setCameraPreset = function(preset) {
            document.querySelectorAll('#btn-cam-front, #btn-cam-side, #btn-cam-top').forEach(b => b.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');
            camera.setPreset(preset);
        };

        window.toggleOrbit = function() {
            camera.isOrbiting = !camera.isOrbiting;
            const btn = document.getElementById('btn-cam-orbit');
            if (camera.isOrbiting) {
                btn.innerText = "動態環繞: 開";
                btn.classList.add('active');
            } else {
                btn.innerText = "動態環繞: 關";
                btn.classList.remove('active');
            }
        };

        window.setSceneMode = function(mode) {
            currentSceneMode = mode;
            document.querySelectorAll('#btn-mode-1, #btn-mode-2, #btn-mode-3').forEach(b => b.classList.remove('active'));
            const btnMap = { 'single': 'btn-mode-1', 'duel': 'btn-mode-2', 'trio': 'btn-mode-3' };
            if (document.getElementById(btnMap[mode])) document.getElementById(btnMap[mode]).classList.add('active');
            rebuildScene();
        };

        window.setMotionStyle = function(style) {
            currentMotionStyle = style;
            activeActors.forEach(a => a.style = style);
        };

        // 主繪圖迴圈
        let lastTime = performance.now();
        let frameCount = 0;

        function animate(now) {
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            camera.update(now);

            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            const timeSec = now * 0.001;

            activeActors.forEach((actor, index) => actor.update(timeSec, index * 1.5));
            checkHits(activeActors);
            globalSparks.update();

            const renderQueue = [];

            activeActors.forEach(actor => {
                const particles = actor.particles;
                const len = particles.length;
                const color = actor.color;
                for (let i = 0; i < len; i++) {
                    const p = particles[i];
                    const proj = project3DFast(p.x, p.y, p.z);
                    renderQueue.push({ x: proj.x, y: proj.y, scale: proj.scale, z: proj.z, color });
                }
            });

            globalSparks.sparks.forEach(s => {
                const proj = project3DFast(s.x, s.y, s.z);
                renderQueue.push({ x: proj.x, y: proj.y, scale: proj.scale * 1.5, z: proj.z, color: s.color });
            });

            renderQueue.sort((a, b) => b.z - a.z);

            const renderLen = renderQueue.length;
            for (let i = 0; i < renderLen; i++) {
                const item = renderQueue[i];
                const size = Math.max(0.6, 2.0 * item.scale);
                ctx.fillStyle = item.color;
                ctx.fillRect(item.x - size / 2, item.y - size / 2, size, size);
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', updateScreenDimensions);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
