<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Studio - 階段 1：模組化架構與效能優化</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        .studio-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(12, 12, 14, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px;
            width: 300px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .studio-header {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #00f0ff;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .section-title {
            font-size: 10px;
            font-weight: bold;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 12px 0 6px 0;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 7px 6px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover, .btn.active {
            background: #00f0ff;
            color: #000000;
            font-weight: bold;
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-size: 10px;
            color: #aaa;
            font-family: monospace;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .stat-val {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="studio-panel">
        <div class="studio-header">
            <span>🎬 STUDIO - PHASE 1</span>
            <span id="fps" style="color: #00ffcc;">60 FPS</span>
        </div>

        <div class="section-title">角色生成管理 (Actor Manager)</div>
        <div class="btn-grid">
            <button class="btn active" id="btn-actor-1" onclick="setActorCount(1)">單角色 (1 Actor)</button>
            <button class="btn" id="btn-actor-2" onclick="setActorCount(2)">雙角色 (2 Actors)</button>
            <button class="btn" id="btn-actor-3" onclick="setActorCount(3)" style="grid-column: span 2;">矩陣三角色 (3 Actors)</button>
        </div>

        <div class="section-title">單角粒子密度 (Particles / Actor)</div>
        <div class="btn-grid">
            <button class="btn" onclick="setParticleDensity(1000)">1,000 Pts</button>
            <button class="btn active" id="btn-p2000" onclick="setParticleDensity(2000)">2,000 Pts</button>
        </div>

        <div class="section-title">效能監控 (Engine Performance)</div>
        <div class="stat-box">
            <div class="stat-line"><span>總渲染粒子數:</span> <span class="stat-val" id="stat-total-particles">2,000</span></div>
            <div class="stat-line"><span>骨架計算開銷:</span> <span class="stat-val" id="stat-calc-time">0.0 ms</span></div>
            <div class="stat-line"><span>架構狀態:</span> <span class="stat-val" style="color:#00f0ff;">Class Encapsulated</span></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, autoFitScale = 1.0;
        function updateScreenDimensions() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            autoFitScale = Math.min(width, height) / 450;
        }
        updateScreenDimensions();

        // 人體骨架連線結構表
        const BONES = [
            { from: 0, to: 1, radius: 18 }, { from: 1, to: 2, radius: 28 }, { from: 2, to: 3, radius: 24 },
            { from: 2, to: 4, radius: 14 }, { from: 4, to: 5, radius: 11 }, { from: 5, to: 6, radius: 9 },
            { from: 2, to: 7, radius: 14 }, { from: 7, to: 8, radius: 11 }, { from: 8, to: 9, radius: 9 },
            { from: 3, to: 10, radius: 18 }, { from: 10, to: 11, radius: 14 }, { from: 11, to: 12, radius: 10 },
            { from: 3, to: 13, radius: 18 }, { from: 13, to: 14, radius: 14 }, { from: 14, to: 15, radius: 10 }
        ];

        // -------------------------------------------------------------
        // 核心模組 1：物件導向 Actor 類別 (Actor Class)
        // -------------------------------------------------------------
        class Actor {
            constructor(id, offsetX = 0, color = '#00f0ff', particleCount = 2000) {
                this.id = id;
                this.offsetX = offsetX;
                this.color = color;
                this.particleCount = particleCount;
                this.joints = Array.from({ length: 16 }, () => ({ x: 0, y: 0, z: 0 }));
                this.particles = [];
                this.initParticles();
            }

            initParticles() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        boneIndex: Math.floor(Math.random() * BONES.length),
                        u: Math.random(),
                        theta: Math.random() * Math.PI * 2,
                        rRatio: Math.sqrt(Math.random()),
                        x: 0, y: 0, z: 0
                    });
                }
            }

            // 更新骨架關節與粒子座標 (內含快取算術)
            update(timeOffset) {
                const time = timeOffset;
                const joints = this.joints;
                const ox = this.offsetX;
                const bob = Math.sin(time * 5) * 12;
                const punch = Math.sin(time * 7) * 45;

                // 骨架動態座標計算
                joints[3] = { x: ox, y: 20 + bob, z: 0 };
                joints[2] = { x: ox, y: -50 + bob, z: 0 };
                joints[1] = { x: ox, y: -80 + bob, z: 0 };
                joints[0] = { x: ox, y: -105 + bob, z: 0 };

                joints[4] = { x: ox - 25, y: -45, z: 15 };
                joints[5] = { x: ox - 20, y: -25, z: 30 + punch };
                joints[6] = { x: ox - 15, y: -35, z: 55 + punch * 1.2 };

                joints[7] = { x: ox + 25, y: -45, z: 15 };
                joints[8] = { x: ox + 18, y: -20, z: 20 };
                joints[9] = { x: ox + 10, y: -30, z: 35 };

                joints[10] = { x: ox - 20, y: joints[3].y + 15, z: 0 };
                joints[11] = { x: ox - 25, y: joints[10].y + 50, z: 20 };
                joints[12] = { x: ox - 25, y: joints[11].y + 50, z: 0 };

                joints[13] = { x: ox + 20, y: joints[3].y + 15, z: 0 };
                joints[14] = { x: ox + 25, y: joints[13].y + 50, z: -20 };
                joints[15] = { x: ox + 25, y: joints[14].y + 50, z: 0 };

                // 粒子群座標相對插值更新
                const len = this.particles.length;
                for (let i = 0; i < len; i++) {
                    const p = this.particles[i];
                    const bone = BONES[p.boneIndex];
                    const jA = joints[bone.from];
                    const jB = joints[bone.to];

                    const cx = jA.x + (jB.x - jA.x) * p.u;
                    const cy = jA.y + (jB.y - jA.y) * p.u;
                    const cz = jA.z + (jB.z - jA.z) * p.u;

                    const r = bone.radius * p.rRatio;
                    p.x = cx + Math.cos(p.theta) * r;
                    p.y = cy + Math.sin(p.theta) * r;
                    p.z = cz + Math.sin(p.theta * 2) * (r * 0.5);
                }
            }
        }

        // -------------------------------------------------------------
        // 核心模組 2：3D 矩陣投影與快取系統 (Matrix Projection)
        // -------------------------------------------------------------
        let currentRotX = 0.1, currentRotY = 0;
        let cachedCosX = Math.cos(0.1), cachedSinX = Math.sin(0.1);
        let cachedCosY = Math.cos(0), cachedSinY = Math.sin(0);

        function updateCameraMatrix(rx, ry) {
            currentRotX = rx;
            currentRotY = ry;
            // 快取三角函數結果，避免在粒子迴圈中重複計算
            cachedCosX = Math.cos(rx);
            cachedSinX = Math.sin(rx);
            cachedCosY = Math.cos(ry);
            cachedSinY = Math.sin(ry);
        }

        function project3DFast(x, y, z) {
            let x1 = x * cachedCosY - z * cachedSinY;
            let z1 = z * cachedCosY + x * cachedSinY;

            let y2 = y * cachedCosX - z1 * cachedSinX;
            let z2 = z1 * cachedCosX + y * cachedSinX;

            const fov = 400;
            const scale = (fov / (fov + z2 + 480)) * autoFitScale;
            return {
                x: width / 2 + x1 * scale,
                y: height / 2 + y2 * scale,
                scale: scale,
                z: z2
            };
        }

        // -------------------------------------------------------------
        // 場景與角色實例化管理
        // -------------------------------------------------------------
        let activeActors = [];
        let particlesPerActor = 2000;

        function rebuildScene(count) {
            activeActors = [];
            if (count === 1) {
                activeActors.push(new Actor(1, 0, '#00f0ff', particlesPerActor));
            } else if (count === 2) {
                activeActors.push(new Actor(1, -90, '#00f0ff', particlesPerActor));
                activeActors.push(new Actor(2, 90, '#ff2a5f', particlesPerActor));
            } else if (count === 3) {
                activeActors.push(new Actor(1, -120, '#00f0ff', particlesPerActor));
                activeActors.push(new Actor(2, 0, '#00ff66', particlesPerActor));
                activeActors.push(new Actor(3, 120, '#ff2a5f', particlesPerActor));
            }
            updateStatsUI();
        }

        function updateStatsUI() {
            const total = activeActors.length * particlesPerActor;
            document.getElementById('stat-total-particles').innerText = total.toLocaleString();
        }

        rebuildScene(1);

        // -------------------------------------------------------------
        // 繪圖主循環 (Main Render Loop)
        // -------------------------------------------------------------
        let lastTime = performance.now();
        let frameCount = 0;

        function animate(now) {
            const startTime = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps').innerText = `${frameCount} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            // 更新攝影機旋轉矩陣
            const rotY = Math.sin(now * 0.0005) * 0.4;
            const rotX = 0.1 + Math.cos(now * 0.0003) * 0.1;
            updateCameraMatrix(rotX, rotY);

            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            const timeSec = now * 0.001;

            // 收集所有粒子的渲染串流，進行深度排序 (Z-Sorting)
            const renderQueue = [];

            activeActors.forEach((actor, index) => {
                actor.update(timeSec + index * 0.8);
                const particles = actor.particles;
                const len = particles.length;
                const color = actor.color;

                for (let i = 0; i < len; i++) {
                    const p = particles[i];
                    const proj = project3DFast(p.x, p.y, p.z);
                    renderQueue.push({
                        x: proj.x,
                        y: proj.y,
                        scale: proj.scale,
                        z: proj.z,
                        color: color
                    });
                }
            });

            // 按 Z 軸排序，確保前後透視遮蔽正確
            renderQueue.sort((a, b) => b.z - a.z);

            // 批量渲染粒子
            const renderLen = renderQueue.length;
            for (let i = 0; i < renderLen; i++) {
                const item = renderQueue[i];
                const size = Math.max(0.6, 2.0 * item.scale);
                ctx.fillStyle = item.color;
                ctx.fillRect(item.x - size / 2, item.y - size / 2, size, size);
            }

            const calcEndTime = performance.now();
            document.getElementById('stat-calc-time').innerText = `${(calcEndTime - startTime).toFixed(1)} ms`;

            requestAnimationFrame(animate);
        }

        // UI 指令綁定
        window.setActorCount = function(count) {
            document.querySelectorAll('#btn-actor-1, #btn-actor-2, #btn-actor-3').forEach(b => b.classList.remove('active'));
            if (event) event.target.classList.add('active');
            rebuildScene(count);
        };

        window.setParticleDensity = function(density) {
            particlesPerActor = density;
            activeActors.forEach(actor => {
                actor.particleCount = density;
                actor.initParticles();
            });
            updateStatsUI();
        };

        window.addEventListener('resize', updateScreenDimensions);
        requestAnimationFrame(animate);
    </script>
</body>
</html>
