<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全 3D 沉浸式太陽系星際探險 - 深度表面探勘版</title>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Noto Sans TC', sans-serif;
            color: #fff;
        }
        #webgl-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism UI Panel */
        .glass-panel {
            background: rgba(10, 16, 28, 0.7);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.08);
            border-radius: 12px;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 320px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a9ba8;
            margin: 12px 0 6px 0;
        }

        select, button {
            width: 100%;
            padding: 10px;
            background: rgba(10, 25, 47, 0.75);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 6px;
            color: #e6f1ff;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover, button:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.15);
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-group button.active {
            background: rgba(0, 240, 255, 0.25);
            border-color: #00f0ff;
            color: #00f0ff;
            font-weight: bold;
        }

        .slider-container {
            margin: 10px 0;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #a8b2d1;
            margin-bottom: 4px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00f0ff;
            cursor: pointer;
            box-shadow: 0 0 8px #00f0ff;
        }

        .action-btn {
            margin-top: 8px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(100, 0, 255, 0.2));
            border: 1px solid rgba(0, 240, 255, 0.4);
            font-weight: 500;
        }

        .land-btn {
            background: linear-gradient(135deg, rgba(255, 170, 0, 0.25), rgba(255, 0, 100, 0.25));
            border: 1px solid rgba(255, 170, 0, 0.5);
            color: #ffcc00;
            font-weight: bold;
            margin-top: 10px;
        }

        .land-btn:hover {
            border-color: #ffcc00;
            box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
            background: rgba(255, 170, 0, 0.35);
        }

        /* Planet Info HUD */
        #info-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 330px;
            padding: 20px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        #info-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #info-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #00f0ff;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        #info-desc {
            font-size: 0.83rem;
            line-height: 1.5;
            color: #c5d1ec;
            margin-bottom: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 0;
        }

        .stat-label { color: #8a9ba8; }
        .stat-value { color: #00f0ff; font-family: 'Orbitron', sans-serif; }

        .feature-tag {
            display: inline-block;
            font-size: 0.65rem;
            background: rgba(0, 240, 255, 0.15);
            color: #00f0ff;
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            margin-top: 8px;
            margin-right: 4px;
        }

        /* Mode Status Overlay */
        #mode-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            padding: 8px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #00f0ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00f0ff;
            box-shadow: 0 0 8px #00f0ff;
        }

        @media (max-width: 768px) {
            #ui-container { width: calc(100% - 40px); top: 10px; left: 20px; padding: 15px; }
            #info-panel { width: calc(100% - 40px); bottom: 10px; right: 20px; padding: 15px; }
            #mode-indicator { display: none; }
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>

    <!-- Mode Indicator -->
    <div id="mode-indicator" class="glass-panel">
        <div class="status-dot"></div>
        <span id="mode-text">ORBITAL VIEW (軌道全景)</span>
    </div>

    <!-- UI Panel -->
    <div id="ui-container" class="glass-panel">
        <h1>SOLAR EXPLORER <span style="font-size: 0.6rem; color: #00f0ff; border: 1px solid #00f0ff; padding: 2px 6px; border-radius: 4px;">SURFACE+</span></h1>
        
        <div class="section-title">聚焦目標 Focus Body</div>
        <select id="planet-select">
            <option value="Sun">太陽 (Sun)</option>
            <option value="Mercury">水星 (Mercury)</option>
            <option value="Venus">金星 (Venus)</option>
            <option value="Earth" selected>地球 [月球/衛星網/垃圾網] (Earth)</option>
            <option value="Mars">火星 (Mars)</option>
            <option value="Jupiter">木星 [四大伽利略衛星] (Jupiter)</option>
            <option value="Saturn">土星 [卡西尼環縫結構] (Saturn)</option>
            <option value="Uranus">天王星 (Uranus)</option>
            <option value="Neptune">海王星 (Neptune)</option>
            <option value="Pluto">冥王星 (Pluto)</option>
        </select>

        <!-- Surface Landing Toggle Button -->
        <button id="btn-land" class="land-btn">🛬 進入地表 / 內部探勘 (Enter Surface)</button>

        <div class="section-title">公轉速度 Orbit Speed</div>
        <div class="btn-group">
            <button id="speed-0">0x 暫停</button>
            <button id="speed-1" class="active">1x 標準</button>
            <button id="speed-5">5x 加速</button>
        </div>

        <div class="slider-container">
            <div class="slider-label"><span>鏡頭距離 Camera Distance</span><span id="dist-val">100%</span></div>
            <input type="range" id="distance-slider" min="0.15" max="3" step="0.05" value="1">
        </div>

        <button id="btn-flyby" class="action-btn">🚀 啟動全星系巡航漫遊</button>
        <button id="btn-reset" class="action-btn" style="background: rgba(255,255,255,0.05); margin-top: 5px;">↺ 重置全景視角</button>
    </div>

    <!-- Info Panel -->
    <div id="info-panel" class="glass-panel">
        <div id="info-name">EARTH</div>
        <div id="info-desc">我們的家園，太陽系中唯一已知孕育生命的天體。</div>
        <div class="stat-row"><span class="stat-label">赤道直徑</span><span class="stat-value" id="stat-diameter">12,742 km</span></div>
        <div class="stat-row"><span class="stat-label">日公轉週期</span><span class="stat-value" id="stat-period">365.25 天</span></div>
        <div class="stat-row"><span class="stat-label">日距</span><span class="stat-value" id="stat-distance">1.0 AU</span></div>
        <div id="info-tags"></div>
    </div>

    <script>
        // --- 1. Procedural Texture Generator ---
        const TextureGen = {
            sun() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, 0, 512);
                grad.addColorStop(0, '#ffcc00'); grad.addColorStop(0.5, '#ff3300'); grad.addColorStop(1, '#ff9900');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
                for (let i = 0; i < 4000; i++) {
                    ctx.fillStyle = `rgba(255, ${Math.random()*255}, 0, ${Math.random()*0.35})`;
                    ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*18+4, 0, Math.PI*2); ctx.fill();
                }
                return new THREE.CanvasTexture(canvas);
            },
            planet(type) {
                const w = 1024, h = 512;
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');

                if (type === 'mercury') {
                    ctx.fillStyle = '#8c8c8c'; ctx.fillRect(0,0,w,h);
                    for (let i=0; i<1000; i++) {
                        ctx.fillStyle = Math.random() > 0.5 ? '#444' : '#ccc';
                        ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*6, 0, Math.PI*2); ctx.fill();
                    }
                } else if (type === 'venus') {
                    const grad = ctx.createLinearGradient(0,0,0,h);
                    grad.addColorStop(0, '#e3bb76'); grad.addColorStop(0.5, '#c29d5b'); grad.addColorStop(1, '#dfa851');
                    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    for(let i=0; i<30; i++) ctx.fillRect(0, Math.random()*h, w, Math.random()*30);
                } else if (type === 'earth') {
                    ctx.fillStyle = '#0f3875'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#227b43';
                    for(let i=0; i<50; i++) { ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*90+20, 0, Math.PI*2); ctx.fill(); }
                    ctx.fillStyle = 'rgba(255,255,255,0.65)';
                    for(let i=0; i<80; i++) { ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*45+15, 0, Math.PI*2); ctx.fill(); }
                } else if (type === 'moon') {
                    ctx.fillStyle = '#aaaaaa'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#666666';
                    for(let i=0; i<300; i++) { ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*8+2, 0, Math.PI*2); ctx.fill(); }
                } else if (type === 'mars') {
                    ctx.fillStyle = '#c1440e'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#6b1d00';
                    for(let i=0; i<600; i++) { ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*12, 0, Math.PI*2); ctx.fill(); }
                } else if (type === 'jupiter') {
                    for(let y=0; y<h; y++) {
                        const band = Math.sin(y/10) * 0.5 + 0.5;
                        ctx.fillStyle = band > 0.6 ? '#b07f35' : (band > 0.3 ? '#e0ae6f' : '#8d5b28');
                        ctx.fillRect(0, y, w, 1);
                    }
                    ctx.fillStyle = '#b82a00';
                    ctx.beginPath(); ctx.ellipse(w*0.65, h*0.7, 55, 32, 0, 0, Math.PI*2); ctx.fill();
                } else if (type === 'saturn') {
                    for(let y=0; y<h; y++) {
                        const v = Math.sin(y/6)*0.5+0.5;
                        ctx.fillStyle = `rgb(${210+v*30}, ${180+v*20}, ${140+v*20})`;
                        ctx.fillRect(0,y,w,1);
                    }
                } else if (type === 'uranus') {
                    ctx.fillStyle = '#4b70dd'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    for(let i=0; i<15; i++) ctx.fillRect(0, Math.random()*h, w, Math.random()*15);
                } else if (type === 'neptune') {
                    ctx.fillStyle = '#274687'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = 'rgba(255,255,255,0.25)';
                    for(let i=0; i<20; i++) { ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*25, 0, Math.PI*2); ctx.fill(); }
                } else if (type === 'pluto') {
                    ctx.fillStyle = '#968570'; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = '#3d3226';
                    for(let i=0; i<250; i++) { ctx.beginPath(); ctx.arc(Math.random()*w, Math.random()*h, Math.random()*8, 0, Math.PI*2); ctx.fill(); }
                }
                return new THREE.CanvasTexture(canvas);
            },
            saturnRingDetailed() {
                const canvas = document.createElement('canvas');
                canvas.width = 1024; canvas.height = 1;
                const ctx = canvas.getContext('2d');
                for (let x = 0; x < 1024; x++) {
                    const r = x / 1024;
                    let alpha = 0; let color = '#d2be98';
                    if (r >= 0.05 && r < 0.2) alpha = 0.15;
                    else if (r >= 0.2 && r < 0.4) alpha = 0.35 + Math.sin(r * 200) * 0.1;
                    else if (r >= 0.4 && r < 0.72) { alpha = 0.95 + Math.sin(r * 400) * 0.05; color = '#e2cca0'; }
                    else if (r >= 0.72 && r < 0.78) alpha = 0.03; 
                    else if (r >= 0.78 && r < 0.94) { alpha = 0.7 + Math.sin(r * 300) * 0.1; if (r > 0.88 && r < 0.90) alpha = 0.1; }
                    else if (r >= 0.96 && r < 0.98) alpha = 0.6;
                    ctx.fillStyle = color; ctx.globalAlpha = Math.max(0, Math.min(1, alpha)); ctx.fillRect(x, 0, 1, 1);
                }
                return new THREE.CanvasTexture(canvas);
            }
        };

        // --- 2. Celestial Data ---
        const PLANET_DATA = {
            Sun: { name: "太陽 (Sun)", diameter: "1,392,700 km", period: "N/A", distance: "0 AU", radius: 18, orbitDist: 0, speed: 0, desc: "太陽系的中心恆星，佔據整個太陽系質量的 99.86%。內部為熾熱電漿核心。", tags: ["恆星電漿內部", "日冕風暴"] },
            Mercury: { name: "水星 (Mercury)", diameter: "4,879 km", period: "88 天", distance: "0.39 AU", radius: 1.2, orbitDist: 32, speed: 0.04, desc: "最靠近太陽的行星，表面佈滿深邃隕石坑，極端溫差。", tags: ["隕石坑廢墟地表", "太陽強光"] },
            Venus: { name: "金星 (Venus)", diameter: "12,104 km", period: "225 天", distance: "0.72 AU", radius: 2.2, orbitDist: 48, speed: 0.015, desc: "擁有濃厚的硫酸與二氧化碳大氣，內部呈現黃金色高溫雲霧世界。", tags: ["濃硫酸濃霧", "超高壓雲層"] },
            Earth: { name: "地球 (Earth)", diameter: "12,742 km", period: "365.25 天", distance: "1.0 AU", radius: 2.5, orbitDist: 68, speed: 0.01, desc: "人類家園。進入後可觀察大氣層光暈與近地軌道俯瞰視角。", tags: ["近地低空軌道", "藍色大氣光暈"] },
            Mars: { name: "火星 (Mars)", diameter: "6,779 km", period: "687 天", distance: "1.52 AU", radius: 1.6, orbitDist: 88, speed: 0.008, desc: "紅色荒漠行星，地表擁有豐富的氧化鐵沙塵與奧林帕斯火山地貌。", tags: ["氧化鐵沙塵暴", "峽谷火山地表"] },
            Jupiter: { name: "木星 (Jupiter)", diameter: "139,820 km", period: "11.86 年", distance: "5.2 AU", radius: 6.5, orbitDist: 125, speed: 0.004, desc: "氣態巨行星。進入內部可觀察濃厚氣體雲帶流體與電閃雷鳴。", tags: ["氣態巨行星內部", "流體風暴粒子"] },
            Saturn: { name: "土星 (Saturn)", diameter: "116,460 km", period: "29.45 年", distance: "9.5 AU", radius: 5.5, orbitDist: 165, speed: 0.003, desc: "擁有華麗光環。進入內部視角可近距離穿梭於土星環冰晶顆粒群中。", tags: ["土星環冰晶微粒", "琥珀色大氣"] },
            Uranus: { name: "天王星 (Uranus)", diameter: "50,724 km", period: "84 年", distance: "19.2 AU", radius: 3.8, orbitDist: 205, speed: 0.002, desc: "冰巨行星，內部是大洋般的甲烷與冰水混合濃厚雲氣。", tags: ["冰巨行星大氣", "蔚藍甲烷霧"] },
            Neptune: { name: "海王星 (Neptune)", diameter: "49,244 km", period: "164.8 年", distance: "30.1 AU", radius: 3.6, orbitDist: 240, speed: 0.001, desc: "風暴最猛烈的冰巨星，內部呈現湛藍色超高速強風氣流。", tags: ["極速風暴流體", "深藍氣體核心"] },
            Pluto: { name: "冥王星 (Pluto)", diameter: "2,377 km", period: "248 年", distance: "39.5 AU", radius: 0.9, orbitDist: 270, speed: 0.0007, desc: "柯伊伯帶矮行星，地表覆蓋氮冰平原與永恆昏暗冰原。", tags: ["冰原凍土", "極遠微弱陽光"] }
        };

        // --- 3. Scene Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02050a, 0.0005);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.05, 4000);
        camera.position.set(0, 80, 160);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 1500;
        controls.minDistance = 0.08;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333344, 0.9);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2.2, 2000, 0.5);
        scene.add(sunLight);

        // Background Starfield
        function createStarfield() {
            const count = 9000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const r = 600 + Math.random() * 800;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i*3+2] = r * Math.cos(phi);

                const c = new THREE.Color();
                c.setHSL(Math.random() * 0.2 + 0.55, 0.6, Math.random() * 0.5 + 0.5);
                colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, transparent: true, opacity: 0.8 });
            scene.add(new THREE.Points(geometry, material));
        }
        createStarfield();

        // --- 4. Planets & Moons Creation ---
        const planets = {};
        const planetMeshes = [];

        // Sun
        const sunGeo = new THREE.SphereGeometry(PLANET_DATA.Sun.radius, 64, 64);
        const sunMesh = new THREE.Mesh(sunGeo, new THREE.MeshBasicMaterial({ map: TextureGen.sun() }));
        scene.add(sunMesh);
        planets['Sun'] = { mesh: sunMesh, data: PLANET_DATA.Sun, angle: 0 };

        const coronaMesh = new THREE.Mesh(
            new THREE.SphereGeometry(PLANET_DATA.Sun.radius * 1.25, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.25, side: THREE.BackSide })
        );
        sunMesh.add(coronaMesh);

        // Planets Loop
        Object.keys(PLANET_DATA).forEach(key => {
            if (key === 'Sun') return;

            const data = PLANET_DATA[key];

            // Orbit Line
            const orbitGeo = new THREE.BufferGeometry();
            const points = [];
            for (let i = 0; i <= 128; i++) {
                const theta = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * data.orbitDist, 0, Math.sin(theta) * data.orbitDist));
            }
            orbitGeo.setFromPoints(points);
            const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.15 }));
            scene.add(orbitLine);

            // Planet Mesh
            const pMesh = new THREE.Mesh(
                new THREE.SphereGeometry(data.radius, 48, 48),
                new THREE.MeshStandardMaterial({
                    map: TextureGen.planet(key.toLowerCase()),
                    roughness: 0.75,
                    metalness: 0.1
                })
            );
            scene.add(pMesh);

            // SPECIAL 1: Earth (Moon System + Debris + Satellites)
            if (key === 'Earth') {
                const moonGeo = new THREE.SphereGeometry(0.55, 32, 32);
                const moonMat = new THREE.MeshStandardMaterial({ map: TextureGen.planet('moon'), roughness: 0.8 });
                const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                pMesh.add(moonMesh);

                pMesh.userData.moon = { mesh: moonMesh, distance: 5.2, speed: 0.02, angle: 0 };

                // Debris & Satellites
                const debrisCount = 1000;
                const debrisGeo = new THREE.BufferGeometry();
                const debrisPos = new Float32Array(debrisCount * 3);
                for (let i = 0; i < debrisCount; i++) {
                    const r = data.radius * (1.15 + Math.random() * 0.45);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    debrisPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                    debrisPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    debrisPos[i*3+2] = r * Math.cos(phi);
                }
                debrisGeo.setAttribute('position', new THREE.BufferAttribute(debrisPos, 3));
                const debrisPoints = new THREE.Points(debrisGeo, new THREE.PointsMaterial({ color: 0x88aaff, size: 0.1, transparent: true, opacity: 0.8 }));
                pMesh.add(debrisPoints);

                pMesh.userData.debris = debrisPoints;
            }

            // SPECIAL 2: Jupiter Galilean Moons
            if (key === 'Jupiter') {
                const galileanMoons = [
                    { name: 'Io', size: 0.4, distance: 9.5, speed: 0.045, color: 0xfda50f },
                    { name: 'Europa', size: 0.35, distance: 12.0, speed: 0.035, color: 0xb0e0e6 },
                    { name: 'Ganymede', size: 0.6, distance: 15.5, speed: 0.025, color: 0xa9a9a9 },
                    { name: 'Callisto', size: 0.52, distance: 19.0, speed: 0.015, color: 0x696969 }
                ];
                pMesh.userData.galileanMoons = [];
                galileanMoons.forEach(m => {
                    const mMesh = new THREE.Mesh(new THREE.SphereGeometry(m.size, 24, 24), new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.7 }));
                    pMesh.add(mMesh);
                    pMesh.userData.galileanMoons.push({ mesh: mMesh, distance: m.distance, speed: m.speed, angle: Math.random() * Math.PI * 2 });
                });
            }

            // SPECIAL 3: Saturn Rings
            if (data.hasRings) {
                const innerR = data.radius * 1.25;
                const outerR = data.radius * 2.8;
                const ringGeo = new THREE.RingGeometry(innerR, outerR, 96);
                const pos = ringGeo.attributes.position;
                const uv = ringGeo.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    const vx = pos.getX(i); const vy = pos.getY(i);
                    const dist = Math.sqrt(vx * vx + vy * vy);
                    uv.setXY(i, (dist - innerR) / (outerR - innerR), 0.5);
                }
                const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ map: TextureGen.saturnRingDetailed(), side: THREE.DoubleSide, transparent: true, opacity: 0.95 }));
                ringMesh.rotation.x = Math.PI / 2.25;
                pMesh.add(ringMesh);
            }

            const initialAngle = Math.random() * Math.PI * 2;
            planets[key] = { mesh: pMesh, data: data, angle: initialAngle };
            planetMeshes.push(pMesh);
        });

        // --- 5. Surface & Interior Feature Generator (Dynamic Localized Scenes) ---
        let surfaceGroup = null;

        function createPlanetSurfaceDetails(key, targetMesh) {
            if (surfaceGroup) {
                targetMesh.remove(surfaceGroup);
                surfaceGroup.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                surfaceGroup = null;
            }

            surfaceGroup = new THREE.Group();
            const radius = PLANET_DATA[key].radius;

            if (key === 'Earth') {
                // Earth Atmosphere Glow Layer
                const atmoGeo = new THREE.SphereGeometry(radius * 1.08, 32, 32);
                const atmoMat = new THREE.MeshBasicMaterial({ color: 0x00bfff, transparent: true, opacity: 0.25, side: THREE.BackSide });
                surfaceGroup.add(new THREE.Mesh(atmoGeo, atmoMat));
            } else if (key === 'Jupiter' || key === 'Saturn' || key === 'Venus' || key === 'Uranus' || key === 'Neptune') {
                // Gas Giants / Thick Atmosphere Interior Mist & Storm Particles
                const pCount = 2000;
                const pGeo = new THREE.BufferGeometry();
                const pPos = new Float32Array(pCount * 3);
                const pCol = new Float32Array(pCount * 3);
                const colorBase = key === 'Jupiter' ? new THREE.Color(0xff8833) : (key === 'Venus' ? new THREE.Color(0xffaa22) : new THREE.Color(0x33aaff));

                for (let i = 0; i < pCount; i++) {
                    const r = radius * (0.85 + Math.random() * 0.28);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    pPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                    pPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    pPos[i*3+2] = r * Math.cos(phi);

                    pCol[i*3] = colorBase.r + (Math.random()-0.5)*0.2;
                    pCol[i*3+1] = colorBase.g + (Math.random()-0.5)*0.2;
                    pCol[i*3+2] = colorBase.b + (Math.random()-0.5)*0.2;
                }
                pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
                pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
                const pMat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.85 });
                surfaceGroup.add(new THREE.Points(pGeo, pMat));
            } else if (key === 'Mars' || key === 'Mercury' || key === 'Pluto') {
                // Rocky Surface Dust / Crater Details
                const dustCount = 800;
                const dustGeo = new THREE.BufferGeometry();
                const dustPos = new Float32Array(dustCount * 3);
                for (let i = 0; i < dustCount; i++) {
                    const r = radius * (1.01 + Math.random() * 0.08);
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    dustPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                    dustPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                    dustPos[i*3+2] = r * Math.cos(phi);
                }
                dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
                const dustMat = new THREE.PointsMaterial({ color: key === 'Mars' ? 0xff5500 : 0xaaaaaa, size: 0.08, transparent: true, opacity: 0.6 });
                surfaceGroup.add(new THREE.Points(dustGeo, dustMat));
            } else if (key === 'Sun') {
                // Solar Flare Plasma Rings
                const flareGeo = new THREE.TorusGeometry(radius * 1.05, 0.4, 16, 64);
                const flareMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, wireframe: true, transparent: true, opacity: 0.4 });
                const flareMesh = new THREE.Mesh(flareGeo, flareMat);
                flareMesh.rotation.x = Math.PI / 3;
                surfaceGroup.add(flareMesh);
            }

            targetMesh.add(surfaceGroup);
        }

        // --- 6. Camera States & Landing Interaction ---
        let currentTargetKey = 'Earth';
        let targetCamPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();
        let isTransitioning = false;
        let isSurfaceMode = false;
        let speedFactor = 1.0;
        let userDistanceScale = 1.0;
        let isAutoFlyby = false;
        let flybyTimer = null;

        function focusOnTarget(key, smooth = true) {
            currentTargetKey = key;
            const target = planets[key];
            const data = target.data;

            document.getElementById('info-name').innerText = data.name;
            document.getElementById('info-desc').innerText = data.desc;
            document.getElementById('stat-diameter').innerText = data.diameter;
            document.getElementById('stat-period').innerText = data.period;
            document.getElementById('stat-distance').innerText = data.distance;
            
            const tagContainer = document.getElementById('info-tags');
            tagContainer.innerHTML = '';
            if (data.tags) {
                data.tags.forEach(t => {
                    const span = document.createElement('span');
                    span.className = 'feature-tag';
                    span.innerText = t;
                    tagContainer.appendChild(span);
                });
            }

            document.getElementById('info-panel').classList.add('visible');
            document.getElementById('planet-select').value = key;

            const meshPos = target.mesh.position;
            const offsetDist = data.radius * (isSurfaceMode ? 1.08 : 4.2) * userDistanceScale + (isSurfaceMode ? 0.2 : 2);
            
            targetLookAt.copy(meshPos);
            targetCamPos.copy(meshPos).add(new THREE.Vector3(offsetDist * 0.7, offsetDist * 0.35, offsetDist));

            if (!smooth) {
                camera.position.copy(targetCamPos);
                controls.target.copy(targetLookAt);
            } else {
                isTransitioning = true;
            }
        }

        // Toggle Surface Mode
        const landBtn = document.getElementById('btn-land');
        landBtn.addEventListener('click', () => {
            isSurfaceMode = !isSurfaceMode;
            const modeText = document.getElementById('mode-text');

            if (isSurfaceMode) {
                landBtn.innerText = "🚀 離開地表 / 重返軌道 (Return to Orbit)";
                landBtn.style.background = "linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 100, 255, 0.25))";
                landBtn.style.color = "#00f0ff";
                modeText.innerText = `SURFACE/INTERIOR MODE (${PLANET_DATA[currentTargetKey].name} 表面/內部探勘)`;
                
                // Add Dynamic Surface Effects
                createPlanetSurfaceDetails(currentTargetKey, planets[currentTargetKey].mesh);
            } else {
                landBtn.innerText = "🛬 進入地表 / 內部探勘 (Enter Surface)";
                landBtn.style.background = "linear-gradient(135deg, rgba(255, 170, 0, 0.25), rgba(255, 0, 100, 0.25))";
                landBtn.style.color = "#ffcc00";
                modeText.innerText = "ORBITAL VIEW (軌道全景)";
            }

            focusOnTarget(currentTargetKey, true);
        });

        // Init Focus
        focusOnTarget('Earth', false);

        // UI Handlers
        document.getElementById('planet-select').addEventListener('change', (e) => {
            stopAutoFlyby();
            if (isSurfaceMode) {
                createPlanetSurfaceDetails(e.target.value, planets[e.target.value].mesh);
                document.getElementById('mode-text').innerText = `SURFACE/INTERIOR MODE (${PLANET_DATA[e.target.value].name} 表面/內部探勘)`;
            }
            focusOnTarget(e.target.value);
        });

        document.getElementById('speed-0').addEventListener('click', function() { setSpeed(0, this); });
        document.getElementById('speed-1').addEventListener('click', function() { setSpeed(1, this); });
        document.getElementById('speed-5').addEventListener('click', function() { setSpeed(5, this); });

        function setSpeed(spd, btn) {
            speedFactor = spd;
            document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        document.getElementById('distance-slider').addEventListener('input', (e) => {
            userDistanceScale = parseFloat(e.target.value);
            document.getElementById('dist-val').innerText = Math.round(userDistanceScale * 100) + '%';
            focusOnTarget(currentTargetKey, true);
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            stopAutoFlyby();
            if (isSurfaceMode) landBtn.click();
            currentTargetKey = 'Sun';
            targetLookAt.set(0, 0, 0);
            targetCamPos.set(0, 180, 380);
            isTransitioning = true;
            document.getElementById('info-panel').classList.remove('visible');
        });

        // Flyby Feature
        const flybyBtn = document.getElementById('btn-flyby');
        flybyBtn.addEventListener('click', () => {
            if (isAutoFlyby) stopAutoFlyby();
            else startAutoFlyby();
        });

        function startAutoFlyby() {
            isAutoFlyby = true;
            flybyBtn.innerText = "🛑 停止巡航漫遊";
            flybyBtn.style.background = "rgba(255, 50, 50, 0.35)";
            
            const keys = Object.keys(PLANET_DATA);
            let idx = 0;

            const nextStep = () => {
                focusOnTarget(keys[idx]);
                idx = (idx + 1) % keys.length;
            };

            nextStep();
            flybyTimer = setInterval(nextStep, 6000);
        }

        function stopAutoFlyby() {
            isAutoFlyby = false;
            if (flybyTimer) clearInterval(flybyTimer);
            flybyBtn.innerText = "🚀 啟動全星系巡航漫遊";
            flybyBtn.style.background = "linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(100, 0, 255, 0.2))";
        }

        // Raycaster Selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            if (e.target.closest('#ui-container') || e.target.closest('#info-panel') || e.target.closest('#mode-indicator')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planetMeshes.concat([sunMesh]));

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                Object.keys(planets).forEach(k => {
                    if (planets[k].mesh === hitMesh) {
                        stopAutoFlyby();
                        if (isSurfaceMode && k !== currentTargetKey) {
                            createPlanetSurfaceDetails(k, planets[k].mesh);
                            document.getElementById('mode-text').innerText = `SURFACE/INTERIOR MODE (${PLANET_DATA[k].name} 表面/內部探勘)`;
                        }
                        focusOnTarget(k);
                    }
                });
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Planet Dynamics
            Object.keys(planets).forEach(key => {
                const p = planets[key];
                
                // Self Rotation
                p.mesh.rotation.y += 0.004;

                // Rotate Surface Custom Group if Active
                if (surfaceGroup && p.mesh.children.includes(surfaceGroup)) {
                    surfaceGroup.rotation.y += 0.002;
                }

                // Earth Orbiting Objects
                if (key === 'Earth') {
                    if (p.mesh.userData.debris) p.mesh.userData.debris.rotation.y += 0.01;
                    if (p.mesh.userData.moon && speedFactor > 0) {
                        const m = p.mesh.userData.moon;
                        m.angle += m.speed * speedFactor * delta * 15;
                        m.mesh.position.x = Math.cos(m.angle) * m.distance;
                        m.mesh.position.z = Math.sin(m.angle) * m.distance;
                    }
                }

                // Jupiter Moons
                if (key === 'Jupiter' && p.mesh.userData.galileanMoons && speedFactor > 0) {
                    p.mesh.userData.galileanMoons.forEach(m => {
                        m.angle += m.speed * speedFactor * delta * 15;
                        m.mesh.position.x = Math.cos(m.angle) * m.distance;
                        m.mesh.position.z = Math.sin(m.angle) * m.distance;
                    });
                }

                // Orbit Around Sun
                if (key !== 'Sun' && speedFactor > 0) {
                    p.angle += p.data.speed * speedFactor * delta * 15;
                    p.mesh.position.x = Math.cos(p.angle) * p.data.orbitDist;
                    p.mesh.position.z = Math.sin(p.angle) * p.data.orbitDist;
                }
            });

            // Camera Motion Lerp
            const activePlanet = planets[currentTargetKey];
            if (activePlanet) {
                const currentPos = activePlanet.mesh.position;

                if (isTransitioning) {
                    const offsetDist = activePlanet.data.radius * (isSurfaceMode ? 1.08 : 4.2) * userDistanceScale + (isSurfaceMode ? 0.2 : 2);
                    const desiredCamPos = currentPos.clone().add(new THREE.Vector3(offsetDist * 0.7, offsetDist * 0.35, offsetDist));
                    
                    camera.position.lerp(desiredCamPos, 0.06);
                    controls.target.lerp(currentPos, 0.06);

                    if (camera.position.distanceTo(desiredCamPos) < 0.2) {
                        isTransitioning = false;
                    }
                } else {
                    const camOffset = camera.position.clone().sub(controls.target);
                    controls.target.copy(currentPos);
                    camera.position.copy(currentPos).add(camOffset);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
