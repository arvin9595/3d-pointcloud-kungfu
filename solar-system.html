<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽系 3D 深度探索系統 (完整球體修正版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Noto Sans TC', sans-serif; color: #fff; }
        #webgl-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        .glass-panel {
            background: rgba(10, 16, 28, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            border-radius: 12px;
        }

        #ui-container {
            position: absolute; top: 20px; left: 20px; z-index: 10; width: 330px; padding: 18px; max-height: calc(100vh - 40px); overflow-y: auto;
        }

        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 1.5px; color: #00f0ff; margin-bottom: 12px; }
        .section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: #8a9ba8; margin: 12px 0 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px; }

        select, button {
            width: 100%; padding: 10px; background: rgba(10, 25, 47, 0.8); border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 6px;
            color: #e6f1ff; font-family: inherit; font-size: 0.82rem; outline: none; cursor: pointer; transition: all 0.2s ease; margin-bottom: 6px;
        }

        select:hover, button:hover { border-color: #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); background: rgba(0, 240, 255, 0.15); }

        .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .mode-tab { padding: 8px 4px; font-size: 0.72rem; text-align: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .mode-tab.active { border-color: #00f0ff; background: rgba(0, 240, 255, 0.2); color: #00f0ff; font-weight: bold; }
        .mode-tab.xray-active { border-color: #ff66cc; background: rgba(255, 0, 150, 0.2); color: #ff66cc; font-weight: bold; }
        .mode-tab.fpv-active { border-color: #00ffaa; background: rgba(0, 255, 150, 0.2); color: #00ffaa; font-weight: bold; }

        .slider-container { margin: 8px 0; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: #a8b2d1; margin-bottom: 4px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: rgba(255, 255, 255, 0.15); height: 4px; border-radius: 2px; outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #00f0ff; cursor: pointer; box-shadow: 0 0 8px #00f0ff; }

        #sub-tools { display: none; background: rgba(255, 0, 150, 0.08); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 0, 150, 0.3); margin-top: 8px; }

        #mode-indicator { position: absolute; top: 20px; right: 20px; z-index: 10; padding: 8px 16px; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: #00f0ff; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }

        #fpv-instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 10px 20px;
            font-size: 0.8rem; color: #00ffaa; display: none; text-align: center; border: 1px solid #00ffaa;
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>

    <div id="mode-indicator" class="glass-panel">
        <div class="status-dot" id="status-dot"></div>
        <span id="mode-text">軌道全景視角 (ORBITAL VIEW)</span>
    </div>

    <div id="fpv-instructions" class="glass-panel">
        🎮 <b>第一人稱地表漫遊中</b><br>按住滑鼠拖曳旋轉視角 | 按下 [W][A][S][D] 鍵移動
    </div>

    <div id="ui-container" class="glass-panel">
        <h1>SOLAR EXPLORER</h1>

        <div class="section-title">1. 選擇探索天體 (九大行星)</div>
        <select id="planet-select">
            <option value="Sun">太陽 (Sun)</option>
            <option value="Mercury">水星 (Mercury)</option>
            <option value="Venus">金星 (Venus)</option>
            <option value="Earth" selected>地球 (Earth)</option>
            <option value="Moon">月球 (Moon)</option>
            <option value="Mars">火星 (Mars)</option>
            <option value="Jupiter">木星 (Jupiter)</option>
            <option value="Saturn">土星 (Saturn)</option>
            <option value="Uranus">天王星 (Uranus)</option>
            <option value="Neptune">海王星 (Neptune)</option>
            <option value="Pluto">冥王星 (Pluto)</option>
        </select>

        <div class="section-title">2. 切換觀察模式</div>
        <div class="mode-grid">
            <div id="tab-orbit" class="mode-tab active">🌌 軌道全景</div>
            <div id="tab-xray" class="mode-tab">🔬 內部解剖</div>
            <div id="tab-fpv" class="mode-tab">🚶 地表漫遊</div>
        </div>

        <div id="sub-tools">
            <div class="slider-label"><span style="color: #ff66cc;">剖面剝離角度</span><span id="cut-val" style="color: #ff66cc;">90°</span></div>
            <input type="range" id="cutaway-slider" min="10" max="180" value="90">
        </div>

        <div class="section-title">3. 視角微調</div>
        <div class="slider-container">
            <div class="slider-label"><span>鏡頭距離</span><span id="dist-val">100%</span></div>
            <input type="range" id="distance-slider" min="0.2" max="2.5" step="0.05" value="1">
        </div>

        <button id="btn-reset" style="margin-top: 10px; background: rgba(255,255,255,0.05);">↺ 重置太陽系視角</button>
    </div>

    <script>
        const textureLoader = new THREE.TextureLoader();

        const TEXTURE_URLS = {
            sun: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/lava/lavatile.jpg',
            mercury: 'https://upload.wikimedia.org/wikipedia/commons/3/30/Mercury_in_color_-_Prockter07_centered.jpg',
            venus: 'https://upload.wikimedia.org/wikipedia/commons/a/a9/Every_Planet_Map_-_Venus.png',
            earth: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg',
            moon: 'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/moon_1024.jpg',
            mars: 'https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg',
            jupiter: 'https://upload.wikimedia.org/wikipedia/commons/e/e2/Jupiter.jpg',
            saturn: 'https://upload.wikimedia.org/wikipedia/commons/b/b4/Saturn_map.jpg',
            uranus: 'https://upload.wikimedia.org/wikipedia/commons/9/95/Sol3-Uranus.jpg',
            neptune: 'https://upload.wikimedia.org/wikipedia/commons/0/06/Neptune.jpg',
            pluto: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Pluto_in_True_Color_-_ALMA_HST.jpg'
        };

        const PLANET_DATA = {
            Sun: { name: "太陽 (Sun)", radius: 18, orbitDist: 0, speed: 0 },
            Mercury: { name: "水星 (Mercury)", radius: 1.2, orbitDist: 35, speed: 0.01 },
            Venus: { name: "金星 (Venus)", radius: 2.6, orbitDist: 50, speed: 0.007 },
            Earth: { name: "地球 (Earth)", radius: 3.0, orbitDist: 70, speed: 0.005 },
            Moon: { name: "月球 (Moon)", radius: 0.8, orbitDist: 0, speed: 0 },
            Mars: { name: "火星 (Mars)", radius: 1.8, orbitDist: 95, speed: 0.004 },
            Jupiter: { name: "木星 (Jupiter)", radius: 7.0, orbitDist: 130, speed: 0.002 },
            Saturn: { name: "土星 (Saturn)", radius: 5.8, orbitDist: 170, speed: 0.0015 },
            Uranus: { name: "天王星 (Uranus)", radius: 4.0, orbitDist: 210, speed: 0.001 },
            Neptune: { name: "海王星 (Neptune)", radius: 3.8, orbitDist: 250, speed: 0.0008 },
            Pluto: { name: "冥王星 (Pluto)", radius: 0.9, orbitDist: 285, speed: 0.0005 }
        };

        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x02050a, 0.0002);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 3000);
        camera.position.set(0, 120, 280);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0x777788, 1.2));
        const sunLight = new THREE.PointLight(0xffffff, 2.0, 3000);
        scene.add(sunLight);

        // 星空背景
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(5000 * 3);
        for(let i=0; i<15000; i++) starPos[i] = (Math.random()-0.5)*2000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1.2, color: 0xffffff })));

        // 建立球體結構（預設皆為 360 度完整球體，且內核預設隱藏）
        function createPlanetGroup(radius, mapUrl) {
            const group = new THREE.Group();

            // 1. 外殼（預設 360 度完整）
            const outerGeo = new THREE.SphereGeometry(radius, 64, 64, 0, Math.PI * 2, 0, Math.PI);
            const outerMat = new THREE.MeshStandardMaterial({ map: textureLoader.load(mapUrl), side: THREE.DoubleSide, roughness: 0.5 });
            const outerMesh = new THREE.Mesh(outerGeo, outerMat);
            group.add(outerMesh);

            // 2. 地幔 (預設隱藏)
            const mantleGeo = new THREE.SphereGeometry(radius * 0.7, 32, 32);
            const mantleMat = new THREE.MeshStandardMaterial({ color: 0xff5500, emissive: 0xaa2200, emissiveIntensity: 0.3 });
            const mantleMesh = new THREE.Mesh(mantleGeo, mantleMat);
            mantleMesh.visible = false;
            group.add(mantleMesh);

            // 3. 地核 (預設隱藏)
            const coreGeo = new THREE.SphereGeometry(radius * 0.35, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.visible = false;
            group.add(coreMesh);

            group.userData = { outerMesh, mantleMesh, coreMesh, radius };
            return group;
        }

        function createOrbitLine(radius) {
            const points = [];
            for (let i = 0; i <= 128; i++) {
                const theta = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.18 });
            return new THREE.LineLoop(geometry, material);
        }

        const planets = {};

        // 太陽
        const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(PLANET_DATA.Sun.radius, 32, 32), new THREE.MeshBasicMaterial({ map: textureLoader.load(TEXTURE_URLS.sun) }));
        scene.add(sunMesh);
        planets['Sun'] = { mesh: sunMesh, data: PLANET_DATA.Sun, angle: 0 };

        // 八大行星 + 冥王星 + 月球
        ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune', 'Pluto', 'Moon'].forEach(key => {
            const data = PLANET_DATA[key];
            let pGroup;

            if (key === 'Moon') {
                pGroup = createPlanetGroup(data.radius, TEXTURE_URLS.moon);
                planets['Earth'].mesh.add(pGroup);
                pGroup.position.set(6.5, 0, 0);
            } else {
                pGroup = createPlanetGroup(data.radius, TEXTURE_URLS[key.toLowerCase()]);
                scene.add(pGroup);
                if (data.orbitDist > 0) scene.add(createOrbitLine(data.orbitDist));
            }
            planets[key] = { mesh: pGroup, data: data, angle: Math.random() * Math.PI * 2 };
        });

        let currentTarget = 'Earth';
        let currentMode = 'ORBIT';
        let userDistScale = 1.0;

        const keysPressed = {};
        window.addEventListener('keydown', (e) => keysPressed[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keysPressed[e.key.toLowerCase()] = false);

        // 設定剖面角度（當角度為 0 時，顯示完整 360 度球體並隱藏內核）
        function updateCutawayView(angleDeg) {
            document.getElementById('cut-val').innerText = `${angleDeg}°`;
            const p = planets[currentTarget];
            if (!p || !p.mesh.userData.outerMesh) return;

            const radius = p.data.radius;
            const outerMesh = p.mesh.userData.outerMesh;
            const mantleMesh = p.mesh.userData.mantleMesh;
            const coreMesh = p.mesh.userData.coreMesh;

            if (currentMode === 'XRAY' && angleDeg > 0) {
                // 開啟剖面：顯示內核，並將外殼根據角度剝離
                mantleMesh.visible = true;
                coreMesh.visible = true;
                const thetaRad = (360 - angleDeg) * (Math.PI / 180);
                outerMesh.geometry.dispose();
                outerMesh.geometry = new THREE.SphereGeometry(radius, 64, 64, 0, thetaRad, 0, Math.PI);
            } else {
                // 恢復完整球體：隱藏內核，外殼設為滿圓 360 度 (2*PI)
                mantleMesh.visible = false;
                coreMesh.visible = false;
                outerMesh.geometry.dispose();
                outerMesh.geometry = new THREE.SphereGeometry(radius, 64, 64, 0, Math.PI * 2, 0, Math.PI);
            }
        }

        function switchMode(newMode) {
            currentMode = newMode;

            document.querySelectorAll('.mode-tab').forEach(t => t.className = 'mode-tab');
            document.getElementById('sub-tools').style.display = 'none';
            document.getElementById('fpv-instructions').style.display = 'none';

            const statusDot = document.getElementById('status-dot');
            const modeText = document.getElementById('mode-text');

            if (newMode === 'ORBIT') {
                document.getElementById('tab-orbit').classList.add('active');
                statusDot.style.background = '#00f0ff';
                modeText.innerText = `軌道全景視角 (${currentTarget})`;
                updateCutawayView(0); // 恢復完整球體
            } 
            else if (newMode === 'XRAY') {
                document.getElementById('tab-xray').classList.add('xray-active');
                document.getElementById('sub-tools').style.display = 'block';
                statusDot.style.background = '#ff66cc';
                modeText.innerText = `內部解剖模式 (${currentTarget})`;
                const sliderVal = parseInt(document.getElementById('cutaway-slider').value);
                updateCutawayView(sliderVal); // 觸發剖面
            } 
            else if (newMode === 'FPV') {
                document.getElementById('tab-fpv').classList.add('fpv-active');
                document.getElementById('fpv-instructions').style.display = 'block';
                statusDot.style.background = '#00ffaa';
                modeText.innerText = `地表漫遊模式 (${currentTarget})`;
                updateCutawayView(0); // 恢復完整球體
            }

            focusCameraOnTarget();
        }

        function focusCameraOnTarget() {
            const p = planets[currentTarget];
            if (!p) return;

            const worldPos = p.mesh.getWorldPosition(new THREE.Vector3());

            if (currentMode === 'FPV') {
                const surfacePos = worldPos.clone().add(new THREE.Vector3(0, p.data.radius + 0.15, 0));
                camera.position.copy(surfacePos);
                controls.target.copy(surfacePos.clone().add(new THREE.Vector3(0, 0, -1)));
                controls.minDistance = 0.01;
                controls.maxDistance = 10;
            } else {
                controls.minDistance = 0.1;
                controls.maxDistance = 1500;
                const dist = p.data.radius * 4.2 * userDistScale;
                camera.position.copy(worldPos).add(new THREE.Vector3(dist*0.7, dist*0.4, dist));
                controls.target.copy(worldPos);
            }
        }

        document.getElementById('planet-select').addEventListener('change', (e) => {
            // 切換行星時，若當前是 XRAY 模式，先恢復舊行星完整度
            updateCutawayView(0);
            currentTarget = e.target.value;
            switchMode(currentMode);
        });

        document.getElementById('tab-orbit').addEventListener('click', () => switchMode('ORBIT'));
        document.getElementById('tab-xray').addEventListener('click', () => switchMode('XRAY'));
        document.getElementById('tab-fpv').addEventListener('click', () => switchMode('FPV'));

        document.getElementById('cutaway-slider').addEventListener('input', (e) => {
            updateCutawayView(parseInt(e.target.value));
        });

        document.getElementById('distance-slider').addEventListener('input', (e) => {
            userDistScale = parseFloat(e.target.value);
            document.getElementById('dist-val').innerText = Math.round(userDistScale * 100) + '%';
            if (currentMode !== 'FPV') focusCameraOnTarget();
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            updateCutawayView(0);
            currentTarget = 'Sun';
            document.getElementById('planet-select').value = 'Sun';
            switchMode('ORBIT');
            camera.position.set(0, 140, 320);
            controls.target.set(0, 0, 0);
        });

        switchMode('ORBIT');

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            Object.keys(planets).forEach(k => {
                const p = planets[k];
                if (p.mesh) p.mesh.rotation.y += 0.002;
                if (k !== 'Sun' && k !== 'Moon') {
                    p.angle += p.data.speed * delta * 12;
                    p.mesh.position.x = Math.cos(p.angle) * p.data.orbitDist;
                    p.mesh.position.z = Math.sin(p.angle) * p.data.orbitDist;
                }
            });

            if (currentMode === 'FPV') {
                const moveSpeed = 0.08;
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                dir.y = 0;
                dir.normalize();

                const sideDir = new THREE.Vector3().crossVectors(camera.up, dir).normalize();

                if (keysPressed['w'] || keysPressed['arrowup']) camera.position.addScaledVector(dir, moveSpeed);
                if (keysPressed['s'] || keysPressed['arrowdown']) camera.position.addScaledVector(dir, -moveSpeed);
                if (keysPressed['a'] || keysPressed['arrowleft']) camera.position.addScaledVector(sideDir, moveSpeed);
                if (keysPressed['d'] || keysPressed['arrowright']) camera.position.addScaledVector(sideDir, -moveSpeed);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
