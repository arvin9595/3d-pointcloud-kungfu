<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 太陽系 - 完整版（含衛星與邊界）</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-family: sans-serif;
      font-size: 13px;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
  <!-- 引入 Three.js 與 OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="info">
    <b>3D 太陽系模擬（完整版）</b><br>
    - 滑鼠左鍵：旋轉視角<br>
    - 滑鼠右鍵：平移視角<br>
    - 滾輪：縮放畫面<br>
    <small>包含：太陽、地球/月球、木星/四大衛星、軌道線與太陽系邊界</small>
  </div>

  <script>
    // -----------------------------------------------------------------
    // 1. 初始化場景、相機與渲染器
    // -----------------------------------------------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 45, 110);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // -----------------------------------------------------------------
    // 2. 光源設定
    // -----------------------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 400);
    scene.add(sunLight);

    // -----------------------------------------------------------------
    // 3. 建立太陽
    // -----------------------------------------------------------------
    const sunGeo = new THREE.SphereGeometry(5, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sunMesh);

    // 輔助函式：繪製軌道虛線
    function createOrbitLine(radius) {
      const segmentCount = 64;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array((segmentCount + 1) * 3);

      for (let i = 0; i <= segmentCount; i++) {
        const theta = (i / segmentCount) * Math.PI * 2;
        positions[i * 3] = Math.cos(theta) * radius;
        positions[i * 3 + 1] = 0;
        positions[i * 3 + 2] = Math.sin(theta) * radius;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
      return new THREE.Line(geometry, material);
    }

    // -----------------------------------------------------------------
    // 4. 地球系統（地球 + 月球）
    // -----------------------------------------------------------------
    const earthOrbitRadius = 20;
    scene.add(createOrbitLine(earthOrbitRadius));

    const earthSystem = new THREE.Group();
    scene.add(earthSystem);

    const earthGeo = new THREE.SphereGeometry(1.2, 32, 32);
    const earthMat = new THREE.MeshStandardMaterial({ color: 0x2266ff, roughness: 0.6 });
    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    earthMesh.position.x = earthOrbitRadius;
    earthSystem.add(earthMesh);

    const moonGeo = new THREE.SphereGeometry(0.35, 16, 16);
    const moonMat = new THREE.MeshStandardMaterial({ color: 0xd3d3d3, roughness: 0.8 });
    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
    const moonDistance = 2.8;
    earthMesh.add(moonMesh);

    // -----------------------------------------------------------------
    // 5. 木星系統（木星 + 四大伽利略衛星）
    // -----------------------------------------------------------------
    const jupiterOrbitRadius = 45;
    scene.add(createOrbitLine(jupiterOrbitRadius));

    const jupiterSystem = new THREE.Group();
    scene.add(jupiterSystem);

    const jupiterGeo = new THREE.SphereGeometry(3.2, 32, 32);
    const jupiterMat = new THREE.MeshStandardMaterial({ color: 0xd8ca9d, roughness: 0.5 });
    const jupiterMesh = new THREE.Mesh(jupiterGeo, jupiterMat);
    jupiterMesh.position.x = jupiterOrbitRadius;
    jupiterSystem.add(jupiterMesh);

    const galileanMoonsData = [
      { name: 'Io (木衛一)', size: 0.3, distance: 5.0, speed: 0.04, color: 0xfda50f },
      { name: 'Europa (木衛二)', size: 0.25, distance: 6.8, speed: 0.03, color: 0xb0e0e6 },
      { name: 'Ganymede (木衛三)', size: 0.45, distance: 9.0, speed: 0.02, color: 0xa9a9a9 },
      { name: 'Callisto (木衛四)', size: 0.4, distance: 11.5, speed: 0.012, color: 0x696969 }
    ];

    const jupiterSatellites = [];
    galileanMoonsData.forEach((data) => {
      const satGeo = new THREE.SphereGeometry(data.size, 16, 16);
      const satMat = new THREE.MeshStandardMaterial({ color: data.color });
      const satMesh = new THREE.Mesh(satGeo, satMat);

      jupiterMesh.add(satMesh);
      jupiterSatellites.push({
        mesh: satMesh,
        distance: data.distance,
        speed: data.speed,
        angle: Math.random() * Math.PI * 2
      });
    });

    // -----------------------------------------------------------------
    // 6. 太陽系邊界 (日球層頂網格 + 歐特雲微粒雲)
    // -----------------------------------------------------------------
    // A. 日球層頂 (Heliopause) - 半透明網格氣泡
    const heliopauseRadius = 75;
    const heliopauseGeo = new THREE.SphereGeometry(heliopauseRadius, 32, 32);
    const heliopauseMat = new THREE.MeshBasicMaterial({
      color: 0x4488ff,
      wireframe: true,
      transparent: true,
      opacity: 0.12,
      side: THREE.DoubleSide
    });
    const heliopauseMesh = new THREE.Mesh(heliopauseGeo, heliopauseMat);
    scene.add(heliopauseMesh);

    // B. 歐特雲 (Oort Cloud) - 外圍球殼粒子系統
    const oortParticleCount = 1500;
    const oortGeo = new THREE.BufferGeometry();
    const oortPositions = new Float32Array(oortParticleCount * 3);
    const innerRadius = 85;
    const outerRadius = 100;

    for (let i = 0; i < oortParticleCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = innerRadius + Math.random() * (outerRadius - innerRadius);

      oortPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      oortPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      oortPositions[i * 3 + 2] = r * Math.cos(phi);
    }

    oortGeo.setAttribute('position', new THREE.BufferAttribute(oortPositions, 3));
    const oortMat = new THREE.PointsMaterial({
      color: 0xaaaaee,
      size: 0.4,
      transparent: true,
      opacity: 0.35
    });
    const oortCloud = new THREE.Points(oortGeo, oortMat);
    scene.add(oortCloud);

    // -----------------------------------------------------------------
    // 7. 動畫繪製迴圈 (Animation Loop)
    // -----------------------------------------------------------------
    let moonAngle = 0;

    function animate() {
      requestAnimationFrame(animate);

      // 行星繞太陽公轉
      earthSystem.rotation.y += 0.008;
      jupiterSystem.rotation.y += 0.003;

      // 行星自轉
      earthMesh.rotation.y += 0.02;
      jupiterMesh.rotation.y += 0.03;
      sunMesh.rotation.y += 0.002;

      // 月球繞地球公轉
      moonAngle += 0.03;
      moonMesh.position.x = Math.cos(moonAngle) * moonDistance;
      moonMesh.position.z = Math.sin(moonAngle) * moonDistance;

      // 伽利略衛星繞木星公轉
      jupiterSatellites.forEach((sat) => {
        sat.angle += sat.speed;
        sat.mesh.position.x = Math.cos(sat.angle) * sat.distance;
        sat.mesh.position.z = Math.sin(sat.angle) * sat.distance;
      });

      // 太陽系邊界緩慢旋轉
      heliopauseMesh.rotation.y += 0.0002;
      oortCloud.rotation.y += 0.0001;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // -----------------------------------------------------------------
    // 8. 視窗大小適應
    // -----------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
